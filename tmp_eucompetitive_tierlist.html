<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EUCompetitive</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #131313;
      font-family: 'Roboto Mono', monospace;
      color: white;
      min-height: 100vh;
    }

    /* ── NAVBAR ── */
    .navbar {
      position: relative;
      width: 100%;
      background-color: #0d0d0d;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 28px;
    }
    .navbar img { height: 32px; opacity: 0.9; }
    .nav-buttons { display: flex; gap: 2px; align-items: center; }
    .nav-button {
      color: rgba(255,255,255,0.4);
      font-weight: 500;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 5px;
      background: transparent;
      transition: color 0.15s;
      font-family: 'Roboto Mono', monospace;
    }
    .nav-button:hover { color: #ffffff; }
    .social-icons { margin-left: auto; display: flex; gap: 4px; }
    .social-link {
      color: rgba(255,255,255,0.4);
      font-size: 16px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .social-link:hover { color: #ffffff; background: #181818; }

    /* ── LAYOUT ── */
    .page-wrapper {
      display: flex;
      gap: 0;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ── LEFT: TIERLIST ── */
    .tierlist-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-top: 60px;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .tierlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .tierlist-header h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
    }

    .tier-row {
      display: flex;
      align-items: stretch;
      margin-bottom: 4px;
      min-height: 72px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

.tier-label {
  width: 64px;
  min-width: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  color: #000;
  flex-shrink: 0;
  user-select: none;
  overflow: hidden;
  word-break: break-word;
  text-align: center;
  white-space: normal;
}

    .tier-S .tier-label { background: #e53535; }
    .tier-A .tier-label { background: #f97316; }
    .tier-B .tier-label { background: #eab308; }
    .tier-C .tier-label { background: #22c55e; }
    .tier-D .tier-label { background: #3b82f6; }
.tier-E .tier-label { background: #8b5cf6; }
.tier-F .tier-label { background: #6b7280; }

    .tier-content {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #1a1a1a;
      min-height: 72px;
      transition: background 0.15s;
    }

    .tier-content.drag-over {
      background: #252525;
      outline: 1px dashed rgba(255,215,0,0.4);
    }

    /* ── DUO CARD ── */
    .duo-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #242424;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: grab;
      transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      user-select: none;
      white-space: nowrap;
    }
    .duo-card:hover {
      border-color: rgba(255,215,0,0.35);
      box-shadow: 0 2px 8px rgba(255,215,0,0.1);
    }
    .duo-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }
    .duo-card .player-names {
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.3;
    }
    .duo-card .player1 { color: #ffffff; }
    .duo-card .player2 { color: #ffffff; font-size: 11px; }
    .duo-card .duo-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: #ffd700;
      flex-shrink: 0;
    }

    .tier-content .remove-btn {
      display: none;
    }

    /* tier card remove on hover (admin) */
    .tier-content .duo-card:hover .remove-btn {
      display: flex;
    }

    /* ── RIGHT: SIDEBAR ── */
    .sidebar {
  width: 280px;
  min-width: 280px;
  display: flex;
  flex-direction: column;
  background: #111111;
  border-left: 1px solid rgba(255,255,255,0.06);
  height: calc(100vh - 60px);
  overflow: hidden;
}

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      background: #181818;
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 20px;
      padding: 7px 14px 7px 30px;
      font-size: 12px;
      outline: none;
      font-family: 'Roboto Mono', monospace;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: rgba(255,215,0,0.35); }

    .duo-pool {
  flex: 1;
  overflow-y: scroll;
  padding: 12px 16px;
  min-height: 0;
}

    .pool-duo-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 6px;
      cursor: grab;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .pool-duo-card:hover {
      border-color: rgba(255,215,0,0.3);
      background: #222;
    }
    .pool-duo-card.dragging { opacity: 0.4; }
    .pool-duo-card.in-tier {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    .pool-duo-card .duo-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: #ffd700;
      flex-shrink: 0;
    }
    .pool-duo-card .player-names { display: flex; flex-direction: column; gap: 1px; }
    .pool-duo-card .player1 { font-size: 12px; font-weight: 600; color: #fff; }
.pool-duo-card .player2 { font-size: 12px; font-weight: 600; color: #ffffff; }

    /* ── ADMIN PANEL ── */
    .admin-toggle {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: auto;
    }

    .admin-btn {
      width: 100%;
      height: 32px;
      background: #181818;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      border-radius: 6px;
      font-size: 11px;
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .admin-btn:hover { color: #fff; border-color: rgba(255,215,0,0.3); }
    .admin-btn.active { border-color: #ffd700; color: #ffd700; }

    /* Admin login overlay */
    .admin-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }
    .admin-overlay.show { display: flex; }

    .admin-modal {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 32px;
      width: 340px;
    }
    .admin-modal h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
      text-align: center;
    }
    .admin-modal input {
      width: 100%;
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      outline: none;
      font-family: 'Roboto Mono', monospace;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .admin-modal input:focus { border-color: rgba(255,215,0,0.4); }
    .admin-modal .modal-btns { display: flex; gap: 8px; }
    .admin-modal button {
      flex: 1;
      height: 36px;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-confirm { background: #ffd700; color: #000; font-weight: 700; }
    .btn-confirm:hover { background: #ffed4e; }
    .btn-cancel { background: #222; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1) !important; }
    .btn-cancel:hover { color: #fff; }
    .admin-modal .error-msg {
      font-size: 11px;
      color: #ef4444;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }

    /* Admin add duo panel */
    .add-duo-panel {
      display: none;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: #0d0d0d;
    }
    .add-duo-panel.show { display: block; }
    .add-duo-panel h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ffd700;
      margin-bottom: 10px;
    }
    .add-duo-panel input {
      width: 100%;
      background: #181818;
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      outline: none;
      font-family: 'Roboto Mono', monospace;
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .add-duo-panel input:focus { border-color: rgba(255,215,0,0.35); }
    .add-duo-panel .add-btn {
      width: 100%;
      height: 32px;
      background: #ffd700;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Roboto Mono', monospace;
      color: #000;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    .add-duo-panel .add-btn:hover { background: #ffed4e; }

    /* Manage duos list */
    .manage-duo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
    }
    .manage-duo-item .names { color: rgba(255,255,255,0.7); }
    .manage-duo-item button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      transition: color 0.15s;
    }
    .manage-duo-item button:hover { color: #ef4444; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
    * { scrollbar-width: thin; scrollbar-color: #333 #1a1a1a; }

    /* Empty tier placeholder */
    .tier-empty-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.12);
      font-style: italic;
      padding: 4px;
      user-select: none;
      pointer-events: none;
    }

    .reset-btn {
      height: 28px;
      padding: 0 12px;
      border-radius: 5px;
      font-size: 11px;
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      background: #181818;
      color: rgba(255,255,255,0.35);
      transition: all 0.15s;
    }
    .reset-btn:hover { color: #ef4444; border-color: rgba(239,68,68,0.3); }

    .no-results {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      text-align: center;
      padding: 20px 0;
    }

    #searchInput:empty:before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.35);
    pointer-events: none;
}

    .duo-card.swap-target {
      outline: 2px dashed rgba(255,215,0,0.5);
      background: #2a2710;
    }

    .region-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      line-height: 1.4;
      vertical-align: middle;
    }
    .region-chip.eu { background: rgba(59,130,246,0.18); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .region-chip.nac { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

  </style>
</head>

        function buildDuoFlag(c1, c2) {
  const f1 = countryToFlag[c1];
  const f2 = countryToFlag[c2];

  if (!f1 && !f2) return '🌍';

  if (c1 === c2 && f1) {
    return `<img src="${f1}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">`;
  }

  if (f1 && f2) {
    return `
      <div style="width:28px;height:28px;border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;">
        <img src="${f1}" style="position:absolute;width:100%;height:100%;object-fit:cover;clip-path:polygon(0 0,100% 0,0 100%);">
        <img src="${f2}" style="position:absolute;width:100%;height:100%;object-fit:cover;clip-path:polygon(100% 0,100% 100%,0 100%);">
      </div>`;
  }

  return '🌍';
}

async function loadPlayers() {
  try {
    const [euRes, nacRes] = await Promise.all([
      fetch('../get_players.php'),
      fetch('../get_players_nac.php'),
    ]);
    const [euPlayers, nacPlayers] = await Promise.all([euRes.json(), nacRes.json()]);

    const allWithRegion = [
      ...euPlayers.map(p => ({ ...p, region: 'EU' })),
      ...nacPlayers.map(p => ({ ...p, region: 'NAC' })),
    ];

    allWithRegion.forEach(p => {
      const id = (p.ID || '').toString().trim();
      const name = (p.NAME || '').toString().trim();
      const country = (p.COUNTRY || '').toString().trim().toUpperCase();
      if (id) playerIdToName[id] = { name, country, region: p.region };
    });

    soloPlayers = allWithRegion
      .filter(p => (p.NAME || '').trim() && (p.NAME || '').trim() !== (p.ID || '').trim())
      .map(p => ({
        id: 'solo_' + p.region.toLowerCase() + '_' + (p.ID || '').trim(),
        p1: (p.NAME || '').trim(),
        c1: (p.COUNTRY || '').trim().toUpperCase(),
        region: p.region,
      }))
      .sort((a, b) => a.p1.localeCompare(b.p1));

    console.log(`Players loaded: ${euPlayers.length} EU, ${nacPlayers.length} NAC`);
  } catch(e) {
    console.error("Failed to load players:", e);
  }
}

function extractCountry(flagToken) {
  if (!flagToken) return '';
  const part = flagToken.split('_').pop().toUpperCase();
  // flagcdn używa 2-literowych kodów ISO, ale token ma pełną nazwę kraju
  // Szukamy w playerCountryMap albo używamy odwróconego lookupa
  return countryNameToCode[part] || '';
}

// Wyciąga eventId z windowId
// np. "S39_FNCSDivisionalCup_Division1_Week5Final_EU"
// -> "epicgames_S39_FNCSDivisionalCup_Division1_EU"
function deriveEventId(windowId) {
  // Format windowId: S39_FNCSDivisionalCup_Division1_Week5Final_EU
  // Format eventId:  epicgames_S39_FNCSDivisionalCup_Division1_EU
  const match = windowId.match(/^(S\d+_[A-Za-z]+_[A-Za-z0-9]+(?:_[A-Za-z0-9]+)?)_Week\d+[A-Za-z]*_(EU|NAC|BR|ASIA)$/);
  if (match) return `epicgames_${match[1]}_${match[2]}`;

  // Fallback dla innych formatów jak S39_PerformanceEvaluation_Event1Round2_EU
  const match2 = windowId.match(/^(S\d+_[A-Za-z]+)_Event\d+Round\d+_(EU|NAC)$/);
  if (match2) return `epicgames_${match2[1]}_${match2[2]}`;

  return null;
}

async function loadDuos() {
  try {
    const SEASON = 'S41';
    const ALLOWED_TYPES = ['fncs_div1_finals', 'performance_finals'];

    const calRes = await fetch(`APISYSTEMV2/calendar.php?season=${SEASON}`);
    const calData = await calRes.json();

    if (!calData.events || !calData.events.length) {
      console.error("Brak eventów w kalendarzu");
      return;
    }

    const now = new Date();

    // 2. Filtruj zakończone eventy odpowiednich typów, posortuj od najnowszych
    const finished = calData.events
      .filter(e =>
        e.endTime &&
        new Date(e.endTime) < now &&
        ALLOWED_TYPES.includes(e.type)
      )
      .sort((a, b) => new Date(b.endTime) - new Date(a.endTime));

    // 3. Weź ostatnie 3 unikalne turnieje (grupuj po nazwie bez Round/Week)
    const tournamentGroups = {};
    for (const ev of finished) {
      const tourneyKey = ev.windowId
        .replace(/_Round\d+/gi, '')
        .replace(/_Week\d+[A-Za-z]*/gi, '')
        .replace(/_Opens?/gi, '')
        .replace(/_Finals?/gi, '');
      if (!tournamentGroups[tourneyKey]) tournamentGroups[tourneyKey] = [];
      tournamentGroups[tourneyKey].push(ev);
    }

    const last3Tournaments = Object.values(tournamentGroups).slice(0, 3).flat();

    if (!last3Tournaments.length) {
      console.error("Brak turniejów do załadowania");
      return;
    }

    console.log(`Ładuję ${last3Tournaments.length} okien z 3 turniejów...`);

    // 4. Pobierz leaderboardy i wyciągnij duety
    const playerToPartner = {};
    const playerRegionMap = {};

    for (const ev of last3Tournaments) {
      if (!ev.eventId || !ev.windowId) continue;

      const regionMatch = ev.windowId.match(/_(EU|NAC|BR|ASIA)$/i);
      const evRegion = regionMatch ? regionMatch[1].toUpperCase() : 'EU';

      try {
        const lbRes = await fetch(
          `APISYSTEMV2/leaderboard.php?eventId=${encodeURIComponent(ev.eventId)}&eventWindowId=${encodeURIComponent(ev.windowId)}&page=0`
        );
        const lbData = await lbRes.json();

        if (!lbData.entries) continue;

        lbData.entries.forEach(entry => {
          const ids = entry.teamAccountIds || [];
          const names = entry.customNames || entry.teamAccountDisplayNames || [];
          const countries = entry.customCountries || [];

          if (ids.length !== 2) return;

          const [id0, id1] = ids;
          const name0 = names[0] || id0;
          const name1 = names[1] || id1;
          const c0 = countries[0] || '';
          const c1 = countries[1] || '';

          if (!playerToPartner[id0]) {
            playerToPartner[id0] = { partnerId: id1, playerName: name0, partnerName: name1, country0: c0, country1: c1 };
          }
          if (!playerToPartner[id1]) {
            playerToPartner[id1] = { partnerId: id0, playerName: name1, partnerName: name0, country0: c1, country1: c0 };
          }
          if (!playerRegionMap[id0]) playerRegionMap[id0] = evRegion;
          if (!playerRegionMap[id1]) playerRegionMap[id1] = evRegion;
        });

      } catch(e) {
        console.warn(`Błąd dla ${ev.windowId}:`, e);
      }
    }

    // 5. Zbuduj unikalne duety
    const seen = new Set();
    const rawDuos = [];

    Object.entries(playerToPartner).forEach(([id0, data]) => {
      const key = [id0, data.partnerId].sort().join('|');
      if (seen.has(key)) return;
      seen.add(key);
      rawDuos.push({ id0, id1: data.partnerId, name0: data.playerName, name1: data.partnerName, country0: data.country0, country1: data.country1 });
    });

    duos = rawDuos.map((d, i) => ({
      id: String(i),
      p1: d.name0,
      p2: d.name1,
      c1: d.country0,
      c2: d.country1,
    }));

    console.log(`Załadowano ${duos.length} duetów`);

    await loadPlayers();

    renderAll();



  } catch(e) {
    console.error("Błąd loadDuos:", e);
  }
}

      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; const td = getCurrentTierData(); delete td[duo.id]; saveTierlist(); renderAll(); }

      if (!draggedDuoId || card.dataset.id === draggedDuoId) return;
      const td = getCurrentTierData();

      const draggedTier = td[draggedDuoId];

      if (targetTier) td[draggedDuoId] = targetTier; else delete td[draggedDuoId];
      if (draggedTier) td[card.dataset.id] = draggedTier; else delete td[card.dataset.id];

      const idxB = items.findIndex(d => d.id === card.dataset.id);
      if (idxA !== -1 && idxB !== -1) [items[idxA], items[idxB]] = [items[idxB], items[idxA]];

    });

    const p1 = document.getElementById('customPlayer1').value.trim();
    const p2 = document.getElementById('customPlayer2').value.trim();
    if (!p1 || !p2 || p1 === p2) return;
    if (duos.find(d => (d.p1 === p1 && d.p2 === p2) || (d.p1 === p2 && d.p2 === p1))) return;
    const player1Data = Object.values(playerIdToName).find(p => p.name === p1);
    const player2Data = Object.values(playerIdToName).find(p => p.name === p2);
    duos.unshift({ id: 'custom_' + Date.now(), p1, p2, c1: player1Data ? player1Data.country : '', c2: player2Data ? player2Data.country : '' });
    document.getElementById('customPlayer1').value = ''; document.getElementById('customPlayer2').value = '';
    document.getElementById('suggestions1').style.display = 'none'; document.getElementById('suggestions2').style.display = 'none';
    renderAll();
  }
  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('modeDuosBtn').style.borderColor = mode === 'duos' ? '#ffd700' : 'rgba(255,255,255,0.06)';
    document.getElementById('modeDuosBtn').style.color = mode === 'duos' ? '#ffd700' : 'rgba(255,255,255,0.45)';
    document.getElementById('modeSoloBtn').style.borderColor = mode === 'solo' ? '#ffd700' : 'rgba(255,255,255,0.06)';
    document.getElementById('modeSoloBtn').style.color = mode === 'solo' ? '#ffd700' : 'rgba(255,255,255,0.45)';
    const createDuoSection = document.querySelector('.sidebar > div:last-child');
    if (createDuoSection) createDuoSection.style.display = mode === 'solo' ? 'none' : '';
    renderAll();
  }

  loadAllPlayerNames();
// Always load solo players from DB regardless of whether tournaments exist
loadPlayers().then(() => renderAll());
loadDuos();

</script>
