<!doctype html>
<html><head><meta charset="utf-8"><title>CompHub Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#16284a 0%,#0b1220 52%,#05070c 100%);font-family:Inter,system-ui,sans-serif}
  canvas{display:block;position:absolute;inset:0}
  #blase{position:absolute;max-width:var(--bw);padding:var(--bp);border-radius:22px;background:rgba(13,20,32,.93);border:2px solid rgba(0,163,255,.55);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 26px rgba(0,163,255,.18);color:#eef4ff;font-weight:700;font-size:var(--bf);line-height:1.32;opacity:0;transform-origin:50% 100%}
  #blase b{color:#36b9ff}
  #blase:after{content:"";position:absolute;left:var(--sx,50%);bottom:-14px;width:24px;height:24px;background:rgba(13,20,32,.93);border-right:2px solid rgba(0,163,255,.55);border-bottom:2px solid rgba(0,163,255,.55);transform:translateX(-50%) rotate(45deg)}
  #chip{position:absolute;left:var(--cl);top:var(--ct);display:flex;align-items:center;gap:14px;padding:12px 22px 12px 14px;border-radius:999px;background:rgba(10,16,26,.85);border:1.5px solid rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:var(--cf);letter-spacing:.04em;text-transform:uppercase;opacity:0}
  #chip img{height:calc(var(--cf) * 1.5)}
  #chip span{color:#36b9ff}
  #ende{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;opacity:0;pointer-events:none}
  #ende .zeile{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:var(--ef);color:#fff;white-space:pre}
  #ende .zeile i{font-style:normal;color:#00a3ff}
  #ende .unter{font-weight:700;font-size:calc(var(--ef) * .38);color:#8ea0bd;letter-spacing:.12em;text-transform:uppercase}
  .cursor{display:inline-block;width:.6em;height:1em;background:rgba(0,163,255,.7);vertical-align:-.12em;margin-left:4px}
</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<div id="chip"><img src="../../public/logos/CompHub-Logo-frei.png"><div id="chiptext"></div></div>
<div id="blase"><div id="blasetext"></div></div>
<div id="ende"><div class="zeile" id="endezeile"></div><div class="unter" id="endeunter"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const HOCH = window.FORMAT === 'hoch';
const B = HOCH ? 720 : 1280, H = HOCH ? 1280 : 720;
document.documentElement.style.cssText = HOCH
  ? '--bw:640px;--bp:22px 26px;--bf:34px;--cl:36px;--ct:70px;--cf:26px;--ef:60px'
  : '--bw:560px;--bp:18px 24px;--bf:26px;--cl:36px;--ct:30px;--cf:20px;--ef:64px';
document.body.style.width = B + 'px'; document.body.style.height = H + 'px';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(B, H);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x0a1120, 22, 52);
const camera = new THREE.PerspectiveCamera(HOCH ? 52 : 34, B / H, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x0a1020, 1.2));
const sonne = new THREE.DirectionalLight(0xffffff, 2.2); sonne.position.set(5, 12, 9); scene.add(sonne);
const blau = new THREE.PointLight(0x00a3ff, 7, 14, 1.6); blau.position.set(0, 3, 3); scene.add(blau);

const lerp = (a, b, t) => a + (b - a) * t, klemm = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const einAus = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const federn = (t) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const ab = (t, a, b) => klemm((t - a) / (b - a));
function leinwand(w, h, mal) { const c = document.createElement('canvas'); c.width = w; c.height = h; mal(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return tx; }
function rund(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const ladeBild = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

// ---------- Boden ----------
const boden = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ map: (() => { const t = leinwand(512, 512, (g, w, h) => { g.fillStyle = '#0a1120'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,163,255,0.16)'; g.lineWidth = 2; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(36, 36); return t; })(), roughness: 0.9 }));
boden.rotation.x = -Math.PI / 2; boden.position.y = -0.62; scene.add(boden);

// ---------- Symbole ----------
function symbol(g, art, w, h, farbe) {
  g.save(); g.translate(w / 2, h / 2); g.fillStyle = farbe; g.strokeStyle = farbe; g.lineWidth = w * 0.06; g.lineCap = 'round'; g.lineJoin = 'round';
  const s = w * 0.22;
  const P = { pokal() { g.beginPath(); g.moveTo(-s, -s); g.lineTo(s, -s); g.lineTo(s * 0.8, s * 0.1); g.quadraticCurveTo(0, s * 0.7, -s * 0.8, s * 0.1); g.closePath(); g.fill(); g.fillRect(-s * 0.12, s * 0.5, s * 0.24, s * 0.5); g.fillRect(-s * 0.55, s * 0.95, s * 1.1, s * 0.22); },
    balken() { [[-1, 0.4], [-0.33, -0.3], [0.33, 0.1], [1, -0.9]].forEach(([x, y]) => g.fillRect(x * s - s * 0.25, y * s, s * 0.5, s * 1.1 - y * s)); },
    kalender() { rund(g, -s * 1.2, -s, s * 2.4, s * 2.1, s * 0.3); g.stroke(); g.fillRect(-s * 1.2, -s, s * 2.4, s * 0.55); for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) g.fillRect(-s * 0.8 + i * s * 0.6, -s * 0.1 + j * s * 0.55, s * 0.35, s * 0.35); },
    krone() { g.beginPath(); g.moveTo(-s * 1.2, s * 0.7); g.lineTo(-s * 1.2, -s * 0.6); g.lineTo(-s * 0.6, 0); g.lineTo(0, -s); g.lineTo(s * 0.6, 0); g.lineTo(s * 1.2, -s * 0.6); g.lineTo(s * 1.2, s * 0.7); g.closePath(); g.fill(); },
    liste() { for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(-s, -s * 0.8 + i * s * 0.8, s * 0.18, 0, 7); g.fill(); g.beginPath(); g.moveTo(-s * 0.5, -s * 0.8 + i * s * 0.8); g.lineTo(s * 1.1, -s * 0.8 + i * s * 0.8); g.stroke(); } },
    stern() { g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.5 : s * 1.2; const a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); },
    play() { g.beginPath(); g.moveTo(-s * 0.7, -s); g.lineTo(s * 1.1, 0); g.lineTo(-s * 0.7, s); g.closePath(); g.fill(); },
    karte() { g.beginPath(); g.arc(0, -s * 0.3, s * 0.8, Math.PI, 0); g.lineTo(0, s * 1.1); g.closePath(); g.fill(); g.fillStyle = '#121a28'; g.beginPath(); g.arc(0, -s * 0.3, s * 0.32, 0, 7); g.fill(); },
    stufen() { [[-1, 0.2], [0, -0.6], [1, 0.6]].forEach(([x, y]) => g.fillRect(x * s * 0.75 - s * 0.36, y * s, s * 0.72, s * 1.1 - y * s)); },
    haus() { g.beginPath(); g.moveTo(0, -s * 1.1); g.lineTo(s * 1.2, 0); g.lineTo(s * 0.8, 0); g.lineTo(s * 0.8, s); g.lineTo(-s * 0.8, s); g.lineTo(-s * 0.8, 0); g.lineTo(-s * 1.2, 0); g.closePath(); g.fill(); },
    ziel() { [1.1, 0.7, 0.3].forEach((r, i) => { g.beginPath(); g.arc(0, 0, s * r, 0, 7); i === 2 ? g.fill() : g.stroke(); }); } };
  (P[art] ?? P.stern)(); g.restore();
}

// ---------- Dock ----------
const SEITEN = window.SEITEN, DREHBUCH = window.DREHBUCH;
const dock = new THREE.Group(); scene.add(dock);
const ICON = 1.5, ABST = 1.75;
const sockelM = new THREE.MeshStandardMaterial({ color: 0x111a29, roughness: 0.3, metalness: 0.3 });
const sockel = new THREE.Mesh(new RoundedBoxGeometry(ABST * (SEITEN.length + 1) + 0.6, 0.55, 2.3, 6, 0.27), sockelM); sockel.position.y = -0.3; dock.add(sockel);
const leiste = new THREE.Mesh(new THREE.BoxGeometry(ABST * (SEITEN.length + 1) + 0.2, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0x00a3ff })); leiste.position.set(0, -0.2, 1.16); dock.add(leiste);
const iconGeo = new RoundedBoxGeometry(ICON, 0.42, ICON, 6, 0.3);
const icons = [];
function iconMat(art, logo) {
  const tx = leinwand(256, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#1b2638'); gr.addColorStop(1, '#111926'); g.fillStyle = gr; g.fillRect(0, 0, w, h); if (logo) g.drawImage(logo, w * 0.15, h * 0.22, w * 0.7, w * 0.7 * logo.height / logo.width); else { const f = g.createLinearGradient(0, h * 0.25, 0, h * 0.75); f.addColorStop(0, '#4cc9ff'); f.addColorStop(1, '#0084e6'); symbol(g, art, w, h, f); } });
  const seite = new THREE.MeshStandardMaterial({ color: 0x172133, roughness: 0.35, metalness: 0.2, emissive: 0x00a3ff, emissiveIntensity: 0 });
  return [seite, seite, new THREE.MeshStandardMaterial({ map: tx, roughness: 0.3, emissive: 0x00a3ff, emissiveIntensity: 0, emissiveMap: null }), seite, seite, seite];
}

// ---------- Fenster ----------
function fenster(bild, titel) {
  const g = new THREE.Group(); const W = 7.2, Hh = 4.5;
  g.add(new THREE.Mesh(new RoundedBoxGeometry(W + 0.1, Hh + 0.46, 0.14, 6, 0.08), new THREE.MeshStandardMaterial({ color: 0x0f1622, roughness: 0.4, metalness: 0.2 })));
  const glow = new THREE.Mesh(new RoundedBoxGeometry(W + 0.24, Hh + 0.6, 0.06, 6, 0.12), new THREE.MeshBasicMaterial({ color: 0x00a3ff, transparent: true, opacity: 0.35 })); glow.position.z = -0.06; g.add(glow);
  const kopf = leinwand(1024, 52, (c, w, h) => { c.fillStyle = '#161f2d'; c.fillRect(0, 0, w, h); [['#ff5f57', 26], ['#febc2e', 52], ['#28c840', 78]].forEach(([f, x]) => { c.fillStyle = f; c.beginPath(); c.arc(x, 26, 9, 0, 7); c.fill(); }); c.fillStyle = '#0b111b'; rund(c, w / 2 - 230, 9, 460, 34, 17); c.fill(); c.fillStyle = '#8ea0bd'; c.font = '600 21px Inter, sans-serif'; c.textAlign = 'center'; c.fillText(titel, w / 2, 33); });
  const kopfM = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.04, 0.4), new THREE.MeshBasicMaterial({ map: kopf, toneMapped: false })); kopfM.position.set(0, Hh / 2 + 0.02, 0.075); g.add(kopfM);
  let tx = null;
  if (bild) { tx = new THREE.Texture(bild); tx.colorSpace = THREE.SRGBColorSpace; tx.needsUpdate = true; tx.anisotropy = 8; tx.minFilter = THREE.LinearMipmapLinearFilter; const sicht = Math.min(1, (bild.width * (Hh - 0.1) / (W - 0.12)) / bild.height); tx.repeat.set(1, sicht); tx.offset.set(0, 1 - sicht); }
  const inhalt = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.12, Hh - 0.1), new THREE.MeshBasicMaterial({ map: tx, color: tx ? 0xffffff : 0x0b1220, toneMapped: false })); inhalt.position.set(0, -0.2, 0.075); g.add(inhalt);
  g.userData = { W, H: Hh, tx, scrollen(s) { if (!tx) return; const sicht = tx.repeat.y; tx.offset.y = (1 - sicht) * (1 - s); } };
  return g;
}

// ---------- Figur: das Logo als Roehren-Maennchen mit Augen ----------
function figurBauen() {
  const gr = new THREE.Group(), k = new THREE.Group(); gr.add(k);
  const SK = 2.0 / 940; const P = (x, y) => new THREE.Vector3((x - 470) * SK, (650 - y) * SK, 0);
  const pfad = (teile) => { const cp = new THREE.CurvePath(); for (const t of teile) cp.add(t.length === 2 ? new THREE.LineCurve3(P(...t[0]), P(...t[1])) : new THREE.CubicBezierCurve3(P(...t[0]), P(...t[1]), P(...t[2]), P(...t[3]))); return cp; };
  const R = 33 * SK;
  const grau = new THREE.MeshStandardMaterial({ color: 0x5f6a80, roughness: 0.32, metalness: 0.15 });
  const blauM = new THREE.MeshStandardMaterial({ color: 0x0aa6ff, roughness: 0.28, metalness: 0.1, emissive: 0x0060a0, emissiveIntensity: 0.08 });
  const roehre = (teile, m) => { const p = pfad(teile); const mesh = new THREE.Mesh(new THREE.TubeGeometry(p, 160, R, 20, false), m); k.add(mesh); for (const e of [p.getPoint(0), p.getPoint(1)]) { const kap = new THREE.Mesh(new THREE.SphereGeometry(R, 20, 14), m); kap.position.copy(e); k.add(kap); } };
  roehre([[[300, 322], [150, 312], [55, 160], [55, 55]], [[55, 55], [570, 55]], [[570, 55], [690, 55], [770, 140], [806, 228]]], grau);
  roehre([[[806, 228], [826, 262], [846, 300], [852, 322]], [[852, 322], [300, 322]]], blauM);
  roehre([[[605, 402], [360, 402]], [[360, 402], [200, 402], [118, 520], [120, 632]], [[120, 632], [390, 632]], [[390, 632], [520, 632], [605, 520], [605, 402]]], blauM);
  roehre([[[668, 402], [858, 402]], [[858, 402], [888, 640]], [[888, 640], [762, 612], [676, 500], [668, 402]]], blauM);
  // Augen
  const weiss = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 }), schwarz = new THREE.MeshStandardMaterial({ color: 0x080a0e, roughness: 0.2 });
  const augen = [], pupillen = [];
  for (const [x, y] of [[540, 360], [745, 360]]) {
    const a = new THREE.Group(); a.position.copy(P(x, y)); a.position.z = 0.1; k.add(a);
    const ap = new THREE.Mesh(new THREE.SphereGeometry(64 * SK, 28, 20), weiss); ap.scale.z = 0.75; a.add(ap);
    const pu = new THREE.Mesh(new THREE.SphereGeometry(33 * SK, 22, 16), schwarz); pu.position.z = 38 * SK; a.add(pu);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(8 * SK, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); gl.position.set(9 * SK, 10 * SK, 22 * SK); pu.add(gl);
    augen.push(a); pupillen.push(pu);
  }
  const sch = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: leinwand(128, 128, (c) => { const r = c.createRadialGradient(64, 64, 4, 64, 64, 62); r.addColorStop(0, 'rgba(0,140,255,0.45)'); r.addColorStop(1, 'rgba(0,140,255,0)'); c.fillStyle = r; c.fillRect(0, 0, 128, 128); }), transparent: true, depthWrite: false }));
  sch.rotation.x = -Math.PI / 2; scene.add(sch);
  gr.userData = { k, augen, pupillen, sch };
  return gr;
}

// ---------- Aufbau ----------
const logo = await ladeBild('../../public/logos/CompHub-Logo-frei.png');
const bilder = await Promise.all(SEITEN.map((s) => ladeBild(s.bild)));
const startX = -(SEITEN.length * ABST) / 2;
const logoIcon = new THREE.Mesh(iconGeo, iconMat(null, logo)); logoIcon.position.set(startX, 0.2, 0); dock.add(logoIcon); icons.push(logoIcon);
SEITEN.forEach((s, i) => { const m = new THREE.Mesh(iconGeo, iconMat(s.symbol)); m.position.set(startX + (i + 1) * ABST, 0.2, 0); dock.add(m); icons.push(m); });
const fenstern = SEITEN.map((s, i) => { const f = fenster(bilder[i], s.titel); f.visible = false; scene.add(f); return f; });
const figur = figurBauen(); scene.add(figur);
await document.fonts.ready;

// ---------- Drehbuch -> Zeitplan ----------
// Teile: {art:'intro'} | {art:'seite', i, text, schnell} | {art:'ende', text}
const plan = []; let t0 = 0;
const lesezeit = (txt) => (txt ? 1.6 + txt.replace(/<[^>]+>/g, '').length * 0.055 : 0);
for (const teil of DREHBUCH) {
  let dauer = teil.art === 'intro' ? 4.2 : teil.art === 'ende' ? 5.5 : (teil.schnell ? 4.2 : 3.6 + lesezeit(teil.text));
  plan.push({ ...teil, von: t0, dauer }); t0 += dauer;
}
window.DAUER = t0;

const iconTop = (i) => new THREE.Vector3(icons[i].position.x, 0.42, 0);
const fensterOrt = (i) => new THREE.Vector3(icons[i + 1].position.x * (HOCH ? 0.15 : 0.35), 1.7, -3.4);
const hupf = (v, n, t, h) => { const p = v.clone().lerp(n, t); p.y += Math.sin(Math.PI * t) * h; return p; };
let __boden = 0.42;
function figurSetzen(pos, sprung, blick = 0, wackeln = 0, stauch = 0) {
  figur.position.copy(pos); figur.rotation.set(0, blick, wackeln); figur.scale.setScalar(HOCH ? 1.25 : 1);
  const sq = sprung >= 0 ? 1 + 0.16 * Math.sin(Math.PI * sprung) : 1 - stauch;
  figur.userData.k.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  const s = figur.userData.sch; s.position.set(pos.x, __boden + 0.01, pos.z); const hoch = Math.max(0, pos.y - __boden); s.scale.setScalar(2.6 / (1 + hoch * 0.35)); s.material.opacity = 1 / (1 + hoch * 0.5);
}
function augenSetzen(t, blickZiel) {
  const b = (t % 3.3) < 0.12 ? 0.12 : 1; figur.userData.augen.forEach((a) => (a.scale.y = b));
  figur.updateMatrixWorld(true);
  figur.userData.pupillen.forEach((p, i) => { const a = figur.userData.augen[i]; const lokal = a.worldToLocal(blickZiel.clone()).normalize(); p.position.set(lokal.x * 0.045, lokal.y * 0.045, 0.08); });
}
const el = (id) => document.getElementById(id);
function blase(text, anteil, ort, sichtbar) {
  const b = el('blase'); if (!text || sichtbar <= 0) { b.style.opacity = 0; return; }
  const roh = text; let n = Math.floor(roh.replace(/<[^>]+>/g, '').length * anteil), aus = '', zaehl = 0, inTag = false;
  for (const ch of roh) { if (ch === '<') inTag = true; if (inTag) { aus += ch; if (ch === '>') inTag = false; continue; } if (zaehl >= n) break; aus += ch; zaehl++; }
  el('blasetext').innerHTML = aus + (anteil < 1 ? '<span class="cursor"></span>' : '');
  const p = ort.clone().project(camera); const sx = (p.x * 0.5 + 0.5) * B, sy = (-p.y * 0.5 + 0.5) * H;
  const r = b.getBoundingClientRect(); const w = r.width, h = r.height;
  let x = klemm(sx - w / 2, 24, B - w - 24), y = klemm(sy - h - 30, 20, H - h - 20);
  b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.setProperty('--sx', klemm(sx - x, 30, w - 30) + 'px');
  b.style.opacity = sichtbar; b.style.transform = `scale(${0.85 + 0.15 * sichtbar})`;
}
function chip(text, sichtbar) { const c = el('chip'); c.style.opacity = sichtbar; el('chiptext').innerHTML = text; c.style.transform = `translateY(${(1 - sichtbar) * -20}px)`; }

window.zeichne = function (t) {
  __boden = 0.42;
  fenstern.forEach((f) => (f.visible = false));
  icons.forEach((m) => { m.position.y = 0.2; m.material[2].emissiveIntensity = 0; });
  el('ende').style.opacity = 0; let blaseText = null, blaseAnteil = 0, blaseSicht = 0, chipText = '', chipSicht = 0;
  const teil = plan.find((p) => t >= p.von && t < p.von + p.dauer) ?? plan[plan.length - 1];
  const lt = t - teil.von, u = lt / teil.dauer, idx = plan.indexOf(teil);
  let kp, kz;
  const vorIcon = (() => { for (let j = idx - 1; j >= 0; j--) if (plan[j].art === 'seite') return plan[j].i + 1; return 0; })();
  if (teil.art === 'intro') {
    const e = einAus(u);
    kp = new THREE.Vector3(lerp(9, startX + 3, e), lerp(1.8, 3.4, e), lerp(5.5, 7.8, e)).multiplyScalar(1).add(new THREE.Vector3(0, HOCH ? 2.5 : 0, HOCH ? 6 : 0)); kz = new THREE.Vector3(lerp(3, startX + 0.5, e), HOCH ? 3.2 : 0.4, 0);
    const l = iconTop(0);
    if (lt < 1.0) figurSetzen(new THREE.Vector3(l.x, 9, 0), 0.5);
    else if (lt < 1.9) { const f = ab(lt, 1.0, 1.9); figurSetzen(new THREE.Vector3(l.x, lerp(9, l.y, f * f), 0), 0.5); }
