<!doctype html><html><head><meta charset="utf-8">
<!-- Breiter, flacher Live-Post im Header-Stil (1600x600): Hintergrund aus schraeg gelegten Cup-Bildern und Spielerfotos wie auf der Seite (KartenHintergrund),
     schwarze Folie darueber, Streamer mit Profilbild, Flagge und Namen - ohne Zuschauerzahl. Daten aus cup-daten.js (scripts/streamer-post-daten.mjs). -->
<style>
:root{--rot:#ff3b5c}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:600px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05080e;position:relative}
.wand{position:absolute;left:-200px;top:-260px;width:2200px;display:grid;grid-template-columns:repeat(8,250px);gap:18px;transform:rotate(-8deg)}
.wand div{height:150px;border-radius:16px;background:#111 center/cover}
.folie{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.72),rgba(5,8,14,.86)),radial-gradient(ellipse at 50% 0%,rgba(0,163,255,.18),transparent 60%)}
.oben{position:absolute;top:38px;left:0;right:0;display:flex;gap:10px;justify-content:center}
.chip{padding:7px 16px;border-radius:999px;font-size:17px;letter-spacing:.1em;font-weight:900;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.25);color:#d6e2f3;background:rgba(5,8,14,.5)}
.chip.live{background:var(--rot);border-color:var(--rot);color:#fff}
.chip.live:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:9px;vertical-align:1px}
h1{position:absolute;left:0;right:0;top:88px;text-align:center;font-size:70px;font-weight:900;line-height:1;white-space:nowrap}
h1 span{color:var(--rot)}
.sub{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:22px;font-weight:700;color:#c4d0e3}
.reihe{position:absolute;left:60px;right:60px;top:228px;display:flex;justify-content:center;gap:56px}
.s{text-align:center;position:relative;width:220px}
.s .a{width:170px;height:170px;border-radius:50%;margin:0 auto;background:#1a2436 center/cover;border:4px solid var(--rot);box-shadow:0 0 30px rgba(255,59,92,.3)}
.s .f{position:absolute;top:132px;left:50%;margin-left:46px;width:50px;height:34px;border-radius:7px;background:center/cover;border:3px solid #0b1220}
.s .n{margin-top:16px;font-size:30px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .t{margin-top:4px;font-size:16px;color:#9fb0c9;font-weight:700}
.logo{position:absolute;bottom:22px;right:30px;opacity:.7}
.logo img{height:30px}
</style></head><body>
<div class="wand" id="wand"></div><div class="folie"></div>
<div id="inhalt"></div>
<div class="logo"><img src="../../public/logos/CompHub-Logo-frei.png"></div>
<script src="cup-daten.js" onerror="window.DATEN=null"></script>
<script>
const q=new URLSearchParams(location.search), D=window.DATEN||{streamer:[]};
const land=Object.fromEntries((q.get('land')||'').split(',').filter(Boolean).map(x=>x.split(':')));
const gross=u=>u?u.replace(/-\d+x\d+\./,'-600x600.'):'';
const C=['fncs-global-championship-2026-hd.jpg','fncs-grand-finals.webp','major-1-summit-2026.webp','fncs-solo-reload.webp','global-championship-2025.webp','fncs-major.webp','reload-cup.webp','solo-series.webp','elite-cup.webp','world-cup.webp'];
const P=['rax.jpg','swizzy.jpg','chap.jpg','focus.jpg','jannisz.jpg','darm.jpg','charyy.jpg','mariuscow.jpg','scroll.jpg','sky.jpg','kaan.jpg','pixovsky.jpg'];
let w='';for(let i=0;i<32;i++){const b=i%3===2?'../../public/spielerbilder/'+P[(i*5)%P.length]:'../../public/cups/'+C[(i*7)%C.length];w+=`<div style="background-image:url('${b}')"></div>`;}
document.getElementById('wand').innerHTML=w;
document.getElementById('inhalt').innerHTML=`
<div class="oben"><span class="chip live">Live now</span><span class="chip">${q.get('chip')||''}</span></div>
<h1>${q.get('h1')||'WATCH IT <span>LIVE</span>'}</h1>
<div class="sub">${q.get('sub')||''}</div>
<div class="reihe">${(D.streamer||[]).map(x=>`<div class="s"><div class="a" style="background-image:url('${gross(x.avatar)}')"></div>${land[x.login]?`<div class="f" style="background-image:url('../../public/flags/${land[x.login]}.png')"></div>`:''}<div class="n">${x.name}</div><div class="t">twitch.tv/${x.login}</div></div>`).join('')}</div>`;
</script></body></html>
