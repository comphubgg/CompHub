<!doctype html><html><head><meta charset="utf-8">
<!-- Stats-Post (1600x900): Top 5 Elims, Schaden, Strecke je Spieler. Daten aus cup-daten.js (scripts/stats-post-daten.mjs). -->
<style>
:root{--g:#8ea0bd;--b:#00a3ff;--gold:#f5c542;--rot:#ff5d73;--gruen:#3ddc97}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05080e;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,#16305e 0%,#0b1220 45%,#05080e 75%)}
.oben{position:absolute;top:44px;left:0;right:0;display:flex;gap:10px;justify-content:center}
.chip{padding:7px 16px;border-radius:999px;font-size:18px;letter-spacing:.1em;font-weight:900;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.25);color:#d6e2f3}
h1{position:absolute;left:0;right:0;top:96px;text-align:center;font-size:76px;font-weight:900;line-height:1;white-space:nowrap}
h1 span{color:var(--b)}
.sub{position:absolute;left:0;right:0;top:186px;text-align:center;font-size:22px;font-weight:700;color:#c4d0e3}
.spalten{position:absolute;left:56px;right:56px;top:246px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sp{border-radius:24px;background:rgba(15,22,34,.9);border:1px solid rgba(255,255,255,.08);padding:18px 18px 10px}
.sp h2{font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);font-weight:900;margin:2px 4px 14px;display:flex;align-items:center;gap:10px}
.sp h2:before{content:"";width:6px;height:20px;border-radius:3px;background:var(--c)}
.erst{display:flex;align-items:center;gap:16px;padding:12px;border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),transparent);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);margin-bottom:10px}
.erst .a{width:92px;height:92px;border-radius:50%;background:#1a2436 center/cover;border:3px solid var(--c);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;color:rgba(255,255,255,.3)}
.erst .n{font-size:26px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.erst .w{font-size:44px;font-weight:900;color:var(--c);line-height:1.05}
.z{display:flex;align-items:center;gap:12px;padding:9px 8px;border-top:1px solid rgba(255,255,255,.06)}
.z .p{width:34px;font-weight:900;color:var(--g);font-size:18px}
.z .a{width:40px;height:40px;border-radius:50%;background:#1a2436 center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:rgba(255,255,255,.3)}
.z .n{flex:1;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z .w{font-size:20px;font-weight:900}
.logo{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;opacity:.55}
.logo img{height:26px}
</style></head><body>
<div class="bg"></div>
<div id="inhalt"></div>
<div class="logo"><img src="../../public/logos/CompHub-Logo-frei.png"></div>
<script src="cup-daten.js" onerror="window.DATEN=null"></script>
<script>
const q=new URLSearchParams(location.search), D=window.DATEN||{};
const B='../../public/spielerbilder/';
const fmt=n=>Number(n).toLocaleString('en-US');
const kurz=n=>String(n).replace(/^\S+\s+(?=\S)/,'');
const foto=x=>x.bild?`background-image:url('${B}${x.bild.datei}');background-position:${x.bild.gesicht?Math.round(x.bild.gesicht[0]*100)+'% '+Math.round(x.bild.gesicht[1]*85)+'%':'50% 20%'}`:'';
const ini=x=>x.bild?'':kurz(x.name).slice(0,1).toUpperCase();
const spalte=(titel,farbe,liste,wert)=>`<div class="sp" style="--c:${farbe}"><h2>${titel}</h2>${liste.length?`<div class="erst"><div class="a" style="${foto(liste[0])}">${ini(liste[0])}</div><div><div class="n">${kurz(liste[0].name)}</div><div class="w">${wert(liste[0].wert)}</div></div></div>`:''}${liste.slice(1).map((x,i)=>`<div class="z"><div class="p">#${i+2}</div><div class="a" style="${foto(x)}">${ini(x)}</div><div class="n">${kurz(x.name)}</div><div class="w">${wert(x.wert)}</div></div>`).join('')}</div>`;
document.getElementById('inhalt').innerHTML=`
<div class="oben"><span class="chip">${q.get('chip')||'Trios Performance Cup · EU'}</span><span class="chip">${q.get('runde')||'Round 1'}</span></div>
<h1>PLAYER <span>STATS</span></h1>
<div class="sub">${q.get('sub')||''}</div>
<div class="spalten">
${spalte('Most eliminations','var(--rot)',D.elims||[],v=>fmt(v))}
${spalte('Most damage','var(--gold)',D.schaden||[],v=>fmt(v))}
${spalte('Most distance travelled','var(--gruen)',D.strecke||[],v=>(v/1000).toFixed(1)+' km')}
</div>`;
</script>
</body></html>
