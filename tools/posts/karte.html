<!doctype html><html><head><meta charset="utf-8">
<!-- Turnierkarte als Bild (1600x1600): Landespots von Noble Practice (scripts/noble-karte-daten.mjs -> karte-daten.js) auf der Fortnite-Karte. -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1600px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05080e;position:relative}
#k{position:absolute;width:2581px;height:2581px;left:-542px;top:-620px}
#k img{position:absolute;inset:0;width:100%;height:100%;filter:saturate(.75) brightness(.8)}
svg{position:absolute;inset:0;width:100%;height:100%}
.lab{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:17px;line-height:1.25;white-space:nowrap;background:rgba(5,8,14,.72);padding:4px 9px;border-radius:9px;border:1.5px solid var(--c)}
.kopf{position:absolute;top:28px;left:32px;display:flex;align-items:center;gap:14px;background:rgba(5,8,14,.82);padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.1)}
.kopf img{height:30px}
.kopf b{font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.kopf span{color:#8ea0bd;font-weight:700;font-size:18px}
</style></head><body>
<div id="k"><img id="bild"><svg id="s" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
<div class="kopf"><img src="../../public/logos/CompHub-Logo-frei.png"><b id="t"></b><span id="u"></span></div>
<script src="karte-daten.js" onerror="window.KARTE=null"></script>
<script>
const q=new URLSearchParams(location.search), K=window.KARTE||{formen:[]};
document.getElementById('bild').src=q.get('bild')||'karte.png';
document.getElementById('t').textContent=q.get('t')||K.turnier?.name||'';
document.getElementById('u').textContent=q.get('u')||K.fenster?.name||'';
const FARBEN=['#00a3ff','#f5c542','#ff5d73','#3ddc97','#a78bfa','#ff9f43','#22d3ee','#f472b6'];
const kurz=n=>String(n).replace(/^(\S+)\s+(?=\S)/,(m,a)=>/^[A-Z0-9]{1,6}$/.test(a)||/^[a-z]{2,6}$/.test(a)?'':m);
let svg='',lab='';
K.formen.forEach((f,i)=>{
 const c=f.teams.length?FARBEN[i%FARBEN.length]:'#8ea0bd';
 svg+=`<polygon points="${f.punkte.map(p=>p.x+','+p.y).join(' ')}" fill="${c}" fill-opacity="${f.teams.length?.28:.08}" stroke="${c}" stroke-width=".18" vector-effect="non-scaling-stroke"/>`;
 if(!f.teams.length)return;
 const mx=f.punkte.reduce((a,p)=>a+p.x,0)/f.punkte.length, my=f.punkte.reduce((a,p)=>a+p.y,0)/f.punkte.length;
 lab+=`<div class="lab" style="--c:${c};left:${mx}%;top:${my}%">${f.teams.map(t=>t.namen.map(kurz).join(' · ')).join('<br>')}</div>`;
});
document.getElementById('s').innerHTML=svg;
document.getElementById('k').insertAdjacentHTML('beforeend',lab);
</script>
</body></html>
