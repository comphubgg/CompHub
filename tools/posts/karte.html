<!doctype html><html><head><meta charset="utf-8">
<!-- Turnierkarte als Bild (1400x1400) - Nachbau von alsBild() aus app/maps/page.tsx: Inselbild, Formen (formFarbe), Namen in Alata mit schwarzer Kontur, Wasserzeichen, Logo. -->
<link href="https://fonts.googleapis.com/css2?family=Alata&display=block" rel="stylesheet">
<style>*{margin:0}body{width:1400px;height:1400px;background:#0a0a0b}canvas{display:block}</style>
</head><body><canvas id="c" width="1400" height="1400"></canvas>
<script src="karte-daten.js" onerror="window.KARTE=null"></script>
<script>
const K=window.KARTE||{formen:[]}, G=1400;
function rahmen(p){const xs=p.map(q=>q.x),ys=p.map(q=>q.y);const links=Math.min(...xs),oben=Math.min(...ys);return{links,oben,breite:Math.max(...xs)-links,hoehe:Math.max(...ys)-oben};}
function spanneBei(punkte,y){const s=[];for(let i=0,j=punkte.length-1;i<punkte.length;j=i++){const a=punkte[i],b=punkte[j];if((a.y>y)===(b.y>y))continue;s.push(a.x+((y-a.y)/(b.y-a.y))*(b.x-a.x));}if(s.length<2)return null;const l=Math.min(...s),r=Math.max(...s);return{mitte:(l+r)/2,breite:r-l};}
function schriftgroesse(breite,hoehe,zeichen){const nachHoehe=hoehe*0.7;const nachBreite=(breite*0.96)/Math.max(zeichen*0.62,1);return Math.max(0.6,Math.min(nachHoehe,nachBreite,3.2));}
function formFarbe(n){if(n>=2)return{fuellung:'rgba(255,0,0,0.4)',rand:'#d32f2f'};if(n===1)return{fuellung:'rgba(0,0,0,0.4)',rand:'#000'};return{fuellung:'rgba(0,0,0,0.14)',rand:'rgba(0,0,0,0.7)'};}
const spots=K.formen, namenVon=t=>t.anzeige||t.namen;
const einheitsGroesse=(()=>{const w=[];for(const s of spots){const r=rahmen(s.punkte);const a=s.teams.length||1;const hpt=r.hoehe/a;
 const saetze=s.teams.length?s.teams.map(t=>{const n=namenVon(t);return s.teams.length===1&&n.length>1?n:[n.join(' ')];}):[];
 for(const tx of saetze){const l=Math.max(...tx.map(t=>t.length),1);w.push(schriftgroesse(r.breite,hpt/tx.length,l));}}
 if(!w.length)return 1.2;w.sort((a,b)=>a-b);return Math.max(1.1,Math.min(w[Math.floor(w.length/3)],2.0));})();
const lade=src=>new Promise(ok=>{const b=new Image();b.onload=()=>ok(b);b.onerror=()=>ok(null);b.src=src;});
(async()=>{
 const c=document.getElementById('c'),g=c.getContext('2d');
 g.fillStyle='#0a0a0b';g.fillRect(0,0,G,G);
 const img=await lade('karte.png'); if(img)g.drawImage(img,0,0,G,G);
 const familie="'Alata'"; try{await document.fonts.load(`600 40px ${familie}`);}catch{}
 for(const s of spots){const f=formFarbe(s.teams.length);g.beginPath();s.punkte.forEach((p,i)=>{const x=p.x/100*G,y=p.y/100*G;i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fillStyle=f.fuellung;g.fill();g.strokeStyle=f.rand;g.lineWidth=2;g.stroke();
  const belegt=s.teams,r=rahmen(s.punkte);g.textAlign='center';g.textBaseline='middle';if(!belegt.length)continue;
  const hpt=r.hoehe/belegt.length;
  belegt.forEach((t,i)=>{const namen=namenVon(t);const allein=belegt.length===1&&namen.length>1;const zeilen=allein?namen:[namen.join(' ')];
   const bandMitte=r.oben+hpt*(i+0.5);const gp=einheitsGroesse,px=gp/100*G;const hoch=zeilen.length*gp*1.15;const obenY=r.oben+hoch*0.62,untenY=r.oben+r.hoehe-hoch*0.62,platzY=untenY-obenY;
   const yP=(belegt.length===1||platzY<=0)?bandMitte:obenY+platzY*(i/(belegt.length-1));const sp=spanneBei(s.punkte,yP)??{mitte:r.links+r.breite/2};
   g.font=`600 ${px}px ${familie}, system-ui, sans-serif`;const zx=sp.mitte/100*G,mitte=yP/100*G;
   zeilen.forEach((z,j)=>{const y=mitte+(j-(zeilen.length-1)/2)*px*1.05;g.strokeStyle='#000';g.lineWidth=px*0.14;g.lineJoin='round';g.strokeText(z,zx,y);g.fillStyle='#ffffff';g.fillText(z,zx,y);});});
  g.textBaseline='alphabetic';}
 g.save();g.globalAlpha=0.075;g.fillStyle='#ffffff';const wz=Math.round(G*0.055);g.font=`800 ${wz}px Segoe UI, system-ui, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.translate(G/2,G/2);g.rotate(-Math.PI/9);
 const bw=g.measureText('thecomphub.com').width,sx=bw*1.5,sy=wz*5.5;for(let y=-G;y<G;y+=sy){const v=(Math.round(y/sy)%2)*(sx/2);for(let x=-G-sx;x<G+sx;x+=sx)g.fillText('thecomphub.com',x+v,y);}g.restore();
 const logo=await lade('../../public/logos/CompHub-Logo-frei.png');
 if(logo&&logo.naturalWidth){const br=Math.round(G*0.155),ho=Math.round(br*(logo.naturalHeight/logo.naturalWidth)),rand=Math.round(G*0.022);g.save();g.shadowColor='rgba(0,0,0,0.55)';g.shadowBlur=12;g.globalAlpha=0.95;g.drawImage(logo,G-rand-br,G-rand-ho,br,ho);g.restore();
  g.save();g.shadowColor='rgba(0,0,0,0.6)';g.shadowBlur=8;g.fillStyle='rgba(255,255,255,0.85)';const ap=Math.round(G*0.019);g.font=`600 ${ap}px Segoe UI, system-ui, sans-serif`;g.textAlign='right';g.textBaseline='bottom';g.fillText('thecomphub.com',G-rand,G-Math.round(rand*0.35));g.restore();}
 document.body.dataset.fertig='1';
})();
</script></body></html>
