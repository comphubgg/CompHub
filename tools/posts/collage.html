<!doctype html><html><head><meta charset="utf-8">
<!-- Ruhiges Tweet-Bild (1600x900) aus Spielerfotos im Header-Stil: ?b=datei:Name:land:rang,... &t=Titel &u=Untertitel -->
<style>
:root{--b:#00a3ff;--gold:#f5c542;--g:#8ea0bd}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05080e;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,#0f2a55 0%,#081226 40%,#05080e 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,163,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,163,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 80%)}
.kopf{position:absolute;top:48px;left:64px;right:64px;display:flex;align-items:center;gap:16px}
.kopf img{height:34px}
.kopf .t{font-size:22px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#d6e2f3}
.kopf .u{margin-left:auto;font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.reihe{position:absolute;left:64px;right:64px;top:130px;bottom:70px;display:flex;gap:18px;justify-content:center}
.k{position:relative;flex:1;max-width:240px;transform:skewX(-6deg);border-radius:18px;overflow:hidden;background:#0d1626;border:1px solid rgba(255,255,255,.08)}
.k.g{border:1.5px solid rgba(245,197,66,.55)}
.k .i{position:absolute;top:0;bottom:0;left:-50px;right:-50px;transform:skewX(6deg)}.k .i img{position:absolute;filter:saturate(.85) contrast(1.05);transform-origin:0 0}
.k:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,0) 45%,rgba(5,8,14,.92) 92%),linear-gradient(180deg,rgba(0,163,255,.10),rgba(0,163,255,0) 40%)}
.k.g:after{background:linear-gradient(180deg,rgba(5,8,14,0) 45%,rgba(5,8,14,.92) 92%),linear-gradient(180deg,rgba(245,197,66,.10),rgba(245,197,66,0) 40%)}
.k .n{position:absolute;left:0;right:0;bottom:22px;z-index:1;transform:skewX(6deg);text-align:center;font-size:26px;font-weight:900}
.k .n img{height:16px;border-radius:3px;margin-right:8px;vertical-align:1px}
.k .r{position:absolute;top:14px;left:18px;z-index:1;transform:skewX(6deg);font-size:20px;font-weight:900;color:var(--b);background:rgba(5,8,14,.7);padding:4px 10px;border-radius:8px}
.k.g .r{color:var(--gold)}
.fuss{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#5d6d88;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="kopf"><img src="../../public/logos/CompHub-Logo-frei.png"><span class="t" id="t"></span><span class="u" id="u"></span></div>
<div class="reihe" id="reihe"></div>
<div class="fuss">The CompHub</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('t').textContent=q.get('t')||'';
document.getElementById('u').textContent=q.get('u')||'';
document.getElementById('reihe').innerHTML=(q.get('b')||'').split(',').filter(Boolean).map(x=>{const [d,n,l,r,gx,gy,gw]=x.split(':');
 return `<div class="k ${r==='1'?'g':''}"><div class="i"><img data-d="${d}" data-g="${gx?[gx,gy,gw].join(','):''}" src="../../public/spielerbilder/${d}"></div>${r?`<div class="r">${/^\d+$/.test(r)?"#"+r:r}</div>`:''}<div class="n">${l?`<img src="../../public/flags/${l}.png">`:''}${n}</div></div>`}).join('');
// Gesicht gross und mittig: Lage aus public/spielerbilder/_gesichter.json [x, y, Breite] (Anteile des Bildes).
fetch('../../public/spielerbilder/_gesichter.json').then(r=>r.json()).catch(()=>({})).then(G=>{
 for(const im of document.querySelectorAll('.k .i img')){
  const setze=()=>{const box=im.parentElement.getBoundingClientRect();const W=im.parentElement.offsetWidth,H=im.parentElement.offsetHeight;
   const g=im.dataset.g?im.dataset.g.split(',').map(Number):(G[im.dataset.d]||[.5,.3,.3]);const nw=im.naturalWidth,nh=im.naturalHeight;
   let s=Math.max(W/nw,H/nh,(W*0.3)/(g[2]*nw),W/(2*Math.max(.05,Math.min(g[0],1-g[0]))*nw));
   const x=W/2-g[0]*nw*s, y=H*0.36-g[1]*nh*s;
   im.style.width=nw*s+'px';im.style.height=nh*s+'px';im.style.left=Math.min(0,Math.max(W-nw*s,x))+'px';im.style.top=Math.min(0,Math.max(H-nh*s,y))+'px';};
  im.complete?setze():im.onload=setze;}
 document.body.dataset.fertig=1;});
</script>
</body></html>
