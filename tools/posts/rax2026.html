<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--blau:#00a3ff;--grau:#8ea0bd}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05080e}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 40%,#16305a 0%,#0a1324 45%,#05080e 80%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,163,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,163,255,.07) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(90deg,#000 0%,transparent 70%)}
.fotobox{position:absolute;right:-30px;bottom:0;height:900px;-webkit-mask-image:linear-gradient(0deg,transparent 0%,#000 18%);mask-image:linear-gradient(0deg,transparent 0%,#000 18%)}
.foto{height:900px;display:block;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 35%);mask-image:linear-gradient(90deg,transparent 0%,#000 35%);filter:saturate(1.05)}
.glanz{display:none}
.inhalt{position:absolute;left:72px;top:52px;width:860px}
.kopf{display:flex;align-items:center;gap:14px;color:var(--grau);font-weight:700;letter-spacing:.18em;font-size:20px;text-transform:uppercase}
.kopf img{height:34px}
h1{font-size:132px;line-height:.92;font-weight:900;letter-spacing:-.02em;margin-top:22px}
h1 .j{color:var(--blau)}
.sub{display:flex;align-items:center;gap:14px;margin-top:18px;font-size:26px;font-weight:700;color:#cfdbee}
.sub img{height:26px;border-radius:4px}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid rgba(0,163,255,.45);color:var(--blau);font-size:18px;letter-spacing:.08em}
.haupt{margin-top:32px;display:flex;gap:18px}
.gross{flex:1;padding:22px 26px;border-radius:20px;background:linear-gradient(180deg,rgba(0,163,255,.16),rgba(0,163,255,.04));border:1.5px solid rgba(0,163,255,.35)}
.gross .z{font-size:64px;font-weight:900;line-height:1}
.gross .l{margin-top:8px;color:var(--grau);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.raster{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.k{padding:16px 20px;border-radius:16px;background:rgba(15,22,34,.85);border:1px solid rgba(255,255,255,.07)}
.k .z{font-size:38px;font-weight:800}
.k .l{margin-top:4px;color:var(--grau);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.k .r{color:var(--blau);font-size:15px;font-weight:800;margin-left:6px}
.fuss{position:absolute;left:72px;bottom:30px;right:72px;display:flex;justify-content:space-between;color:#6f7f99;font-size:16px;font-weight:600}
.fuss b{color:#fff}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="fotobox"><img class="foto" src="../../public/spielerbilder/rax.jpg"></div>
<div class="glanz"></div>
<div class="inhalt">
  <div class="kopf"><img src="../../public/logos/CompHub-Logo-frei.png">The CompHub · Year in Review</div>
  <h1><span class="j">2026</span><br>OF RAX</h1>
  <div class="sub"><img src="../../public/flags/it.png">M8 Rax <span class="chip">EU · CHAPTER 7</span></div>
  <div class="haupt">
    <div class="gross"><div class="z">$39,200</div><div class="l">Prize Money</div></div>
    <div class="gross"><div class="z">410</div><div class="l">Eliminations</div></div>
    <div class="gross"><div class="z">140K</div><div class="l">Damage</div></div>
  </div>
  <div class="raster">
    <div class="k"><div class="z">46</div><div class="l">Events</div></div>
    <div class="k"><div class="z">281</div><div class="l">Matches</div></div>
    <div class="k"><div class="z">3,908<span class="r">#6 EU</span></div><div class="l">Team Elims</div></div>
    <div class="k"><div class="z">4,056</div><div class="l">Hits</div></div>
    <div class="k"><div class="z">537</div><div class="l">Headshots</div></div>
    <div class="k"><div class="z">1.34</div><div class="l">Damage Ratio</div></div>
  </div>
</div>
<div class="fuss"><span>Stats from the <b>CompHub Dashboard</b> · Chapter 7 Season 1–4 · as of Nov 10, 2026</span><span><b>thecomphub.com</b></span></div>
</body></html>
