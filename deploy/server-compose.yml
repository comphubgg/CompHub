# Was auf dem CompHub-Server (Contabo VPS) laeuft. Der Server holt diese Datei
# jede Minute von GitHub (scripts/server-einrichten.sh, /usr/local/bin/comphub-update)
# - eine Aenderung hier ist also nach dem Push binnen einer Minute dort.
services:
  # Die Seite: schlankes Image, ohne Hintergrundlaeufe.
  web:
    image: ghcr.io/comphubgg/comphub-web:latest
    restart: always
    env_file: web.env
    environment:
      COMPHUB_ABLAGE: supabase
      COMPHUB_KEIN_HINTERGRUND: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      # Absturzschleife 16.11.2026: der Kernel beendete next-server bei 5-8 GB rss (dmesg "Out of memory"), der Heap lag bei rund 1 GB. glibc legt je Thread
      # eigene Speicherbereiche an und gibt sie kaum zurueck (bekannt bei Node mit sharp/libvips) - zwei Bereiche halten den Prozess klein.
      MALLOC_ARENA_MAX: "2"
      # Die Status der Epic-Freunde (Match-IDs) kommen vom Dienst "xmpp" unten, nicht aus diesem Prozess (lib/epicFreundeStatus).
      XMPP_DIENST_URL: http://xmpp:3210
    ports:
      - "127.0.0.1:3100:10000"
    # Der Live-Stand der vollen Replays (Dienst "live", scripts/live-spur.mjs) - nur lesend. lib/clutchLive nimmt ihn statt des Release, solange er mehr
    # Matches kennt; fehlt er oder ist er kaputt, bleibt es beim Release.
    volumes:
      - ./live:/app/live:ro
      # Sofortspur (17.11.2026): app/api/sofort/match legt die auf GitHub gelesenen Matches (.github/workflows/sofortspur.yml) hier ab - der Dienst "live"
      # nimmt sie als ./live/eingang und baut daraus den Live-Stand. Braucht SOFORT_SECRET in web.env (derselbe Wert wie das GitHub-Secret SOFORT_SECRET).
      - ./live/eingang:/app/live-eingang

  # Die XMPP-Verbindung zu Epic (Status der Freunde = Match-IDs) als eigener Dienst (scripts/xmpp-dienst.mjs, Dockerfile.xmpp): ein Update der Seite
  # startet nur "web" neu, dieser Dienst laeuft weiter (sein Image :xmpp aendert sich nur mit dem Dienst selbst, .github/workflows/xmpp-image.yml).
  # Vorher hing die Verbindung am Prozess der Seite: nach jedem Update minutenlang keine Match-IDs (Heat 2, 15.11.2026). Nur im Compose-Netz erreichbar
  # (http://xmpp:3210), kein Port nach aussen. Protokoll: docker compose logs -f xmpp. Die Epic-Zugaenge (epic-auth.json, epic-auth-bot.json) holt er
  # beim Start aus dem Archiv (Schluessel aus web.env); klappt das nicht, nimmt er die von "hintergrund" (./daten, nur lesend).
  xmpp:
    image: ghcr.io/comphubgg/comphub-web:xmpp
    restart: always
    env_file: web.env
    environment:
      XMPP_DIENST_PORT: "3210"
      COMPHUB_DATEN: /app/data
      TZ: Europe/Berlin
    mem_limit: 256m
    volumes:
      - ./daten:/app/daten-hintergrund:ro
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p data; node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json,epic-auth-bot.json 2>&1 | tail -2; for f in epic-auth.json epic-auth-bot.json; do [ -s data/$$f ] || cp /app/daten-hintergrund/$$f data/ 2>/dev/null; done; exec node scripts/xmpp-dienst.mjs"]

  # Die Hintergrundlaeufe wie frueher auf dem PC (instrumentation.node.ts):
  # Live-Takt alle 5 Minuten, Replays stuendlich, Spieltage, Rangliste, Nachtlauf.
  # Fragt den Cup-Katalog bei "web" (WERKZEUG_URL). Nicht von aussen erreichbar.
  hintergrund:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    environment:
      COMPHUB_ABLAGE: supabase
      COMPHUB_KEIN_HINTERGRUND: ""
      WERKZEUG_URL: http://127.0.0.1:3100
      PORT: "3200"
      TZ: Europe/Berlin
      # Den Bot-Takt macht schon "web" - nicht doppelt.
      DISCORD_BOT_TOKEN: ""
      NODE_OPTIONS: --max-old-space-size=6144
    volumes:
      - ./daten:/app/data

  # Einmalig (17.11.2026): das Archiv der gesperrten Quelle und alles daraus Gerechnete aus dem Datenordner von "hintergrund" loeschen
  # (scripts/fremdquellen-sperre.mjs). Laeuft einmal und endet; die Marke verhindert eine Wiederholung. Die Statistik rechnet aus eigenen Daten neu.
  aufraeumen:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["cd /app/data && if [ ! -f .fremdquelle-weg-1711 ]; then rm -rf szene-stats szene-quelle akten _akten-vorstufe; find . -maxdepth 1 -name 'eu*-tierlist.json' -delete; rm -f fotos-eingang.json fehlende-bilder.txt bekannte-ohne-foto.txt lan-konten.json; [ -d antworten ] && find antworten -maxdepth 1 \\( -name 'szene_*' -o -name 'center_*' -o -name 'laender_*' -o -name 'tierlist_trios_auto*' \\) -delete; touch .fremdquelle-weg-1711; echo gesaeubert; else echo schon gesaeubert; fi"]
    volumes:
      - ./daten:/app/data

  # Die Replay-Uebersicht (Startseite "Matches ausgewertet", /admin/replays) alle 10 Minuten neu, aus den Zustaenden am Release
  # (14.11.2026: seit der PC aus ist, rechnete sie niemand mehr oft genug - die Zahl stand stundenlang bei 1.459.064).
  uebersicht:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    env_file: web.env
    environment:
      TZ: Europe/Berlin
    mem_limit: 2g
    entrypoint: ["sh", "-c"]
    command: ["while true; do nice -n 10 node scripts/replay-uebersicht.mjs --vom-release 2>&1 | tail -2 && node scripts/ablage-github.mjs --nur antworten/replays_uebersicht.json 2>&1 | tail -2; sleep 600; done"]

  # X-Links aus #admin-posts jede Minute als CompHub-Bot nach #social-posts (mit @everyone), Quelle mit ✅ abgehakt (scripts/discord-tweets.mjs).
  tweets:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    env_file: web.env
    mem_limit: 512m
    entrypoint: ["sh", "-c"]
    command: ["while true; do node scripts/discord-tweets.mjs --aus-admin-posts --anwenden 2>&1 | grep -v 'Keine (neuen)' | tail -5; sleep 60; done"]

  # Der Ergebnis-Post binnen einer Minute nach dem Ende eines Spieltags (scripts/ergebnis-sofort.mjs, lib/ergebnisSofort.ts): fragt "web" alle 15 s, solange
  # ein Spieltag laeuft, zeichnet das Bild (lib/ftBild.ts im kopflosen Chromium, wird beim Start einmal geholt) und postet Text + Bild nach #admin-posts
  # (🔔 an ERGEBNIS_PING_DISCORD_ID aus web.env) und nach #results. Nie nach X. Ein Post je Spieltag (ergebnis-sofort.json in der Ablage).
  # Protokoll: docker compose logs -f ergebnis.
  ergebnis:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    environment:
      WERKZEUG_URL: http://127.0.0.1:3100
      TZ: Europe/Berlin
    mem_limit: 1g
    entrypoint: ["sh", "-c"]
    command: ["npx playwright install --with-deps chromium 2>&1 | tail -2; exec node scripts/ergebnis-sofort.mjs --anwenden"]

  # Abgelaufene VIP-Schluessel alle zehn Minuten (app/api/cron/vip-ablauf, lib/discord vipAblaufLauf): Kanal, Rolle und Zugang weg, Erinnerung
  # drei Tage vorher, Countdown in den Schluesselnachrichten, Meldung an #admin-alarm. Gerechnet wird in "web" (dort ist der Bot-Token) - hier
  # nur der Anstoss. Vorher tat das allein die GitHub-Kette in discord-live.yml; die riss am 15.11.2026 um 15:06 UTC ab (API-Grenze) und bekam
  # ohnehin 401. Ein zweiter Anstoss schadet nicht: der Lauf ist idempotent.
  vip-ablauf:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    mem_limit: 256m
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do node -e 'const k=(process.env.CRON_SECRET||process.env.DISCORD_BOT_TOKEN||"").trim(); fetch("http://127.0.0.1:3100/api/cron/vip-ablauf",{headers:{authorization:"Bearer "+k},signal:AbortSignal.timeout(170000)}).then(async(r)=>console.log(new Date().toISOString(),"VIP-Ablauf",r.status,(await r.text()).slice(0,400))).catch((e)=>console.log(new Date().toISOString(),"VIP-Ablauf Fehler",e.message))'; sleep 600; done

  # Die Live-Spur (scripts/live-spur.mjs): volle Replays laufender Cups Match fuer Match, sobald Epic sie fertig abgelegt hat - gleich nach dem Spiel
  # statt 10 bis 20 Minuten spaeter (GitHub "Clutch rechnen" bleibt massgeblich und der einzige, der clutch/, clutch-je/, replays/ ans Release schreibt).
  # Geschrieben wird nur unter ./live (Teile je Match, Live-Stand clutch/<w>.json + clutch-je/<w>.json). Seit 15.11.2026 liest "web" den Live-Stand
  # (lib/clutchLive.ts), solange er mehr Matches kennt als das Release - sonst das Release.
  # Gebremst, damit "web" und "hintergrund" Vorrang haben: nice 10, hoechstens 3,5 Kerne, geringes CPU-Gewicht, 5 GB.
  # Die Epic-Anmeldung holt er sich wie die GitHub-Ablaeufe (daten-sync, Schluessel aus web.env) in sein eigenes /app/data; klappt das nicht, nimmt er die
  # von "hintergrund" (./daten, nur lesend eingehaengt - er schreibt dort nie).
  live:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    environment:
      WERKZEUG_URL: http://127.0.0.1:3100
      # Sofortspur (17.11.2026, Betreiber: der Server liest keine Replays mehr): gelesen wird auf GitHub (.github/workflows/sofortspur.yml), hier nur
      # zusammengefuehrt - die Teile aus ./live/eingang (app/api/sofort/match) alle 15 s mit clutch-zusammen.mjs auf den Stand vom Release.
      # "auto": so, sobald SOFORT_SECRET in web.env steht; ohne ihn (oder mit "0") liest der Dienst selbst wie bis zum 17.11.
      LIVE_NUR_BAUEN: auto
      LIVE_LESER: "3"
      LIVE_LADEN: "6"
      COMPHUB_LIVE_ORT: /app/live
      TZ: Europe/Berlin
      NODE_OPTIONS: --max-old-space-size=3072
    cpus: 3.5
    cpu_shares: 256
    mem_limit: 5g
    volumes:
      - ./live:/app/live
      - ./daten:/app/daten-hintergrund:ro
    entrypoint: ["sh", "-c"]
    command: ["node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2; [ -s data/epic-auth.json ] || cp /app/daten-hintergrund/epic-auth.json data/ 2>/dev/null; exec nice -n 10 node scripts/live-spur.mjs"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    network_mode: host
    user: root
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
