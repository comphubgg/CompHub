# Was auf dem CompHub-Server (Contabo VPS) laeuft. Der Server holt diese Datei
# jede Minute von GitHub (scripts/server-einrichten.sh, /usr/local/bin/comphub-update)
# - eine Aenderung hier ist also nach dem Push binnen einer Minute dort.
services:
  # Die Seite: schlankes Image, ohne Hintergrundlaeufe.
  web:
    image: ghcr.io/comphubgg/comphub-web:latest
    restart: always
    env_file: web.env
    environment:
      COMPHUB_ABLAGE: supabase
      COMPHUB_KEIN_HINTERGRUND: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    ports:
      - "127.0.0.1:3100:10000"

  # Die Hintergrundlaeufe wie frueher auf dem PC (instrumentation.node.ts):
  # Live-Takt alle 5 Minuten, Replays stuendlich, Spieltage, Rangliste, Nachtlauf.
  # Fragt den Cup-Katalog bei "web" (WERKZEUG_URL). Nicht von aussen erreichbar.
  hintergrund:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    environment:
      COMPHUB_ABLAGE: supabase
      COMPHUB_KEIN_HINTERGRUND: ""
      WERKZEUG_URL: http://127.0.0.1:3100
      PORT: "3200"
      TZ: Europe/Berlin
      # Den Bot-Takt macht schon "web" - nicht doppelt.
      DISCORD_BOT_TOKEN: ""
      NODE_OPTIONS: --max-old-space-size=6144
    volumes:
      - ./daten:/app/data

  # Die Replay-Uebersicht (Startseite "Matches ausgewertet", /admin/replays) alle 10 Minuten neu, aus den Zustaenden am Release
  # (14.11.2026: seit der PC aus ist, rechnete sie niemand mehr oft genug - die Zahl stand stundenlang bei 1.459.064).
  uebersicht:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    env_file: web.env
    environment:
      TZ: Europe/Berlin
    mem_limit: 2g
    entrypoint: ["sh", "-c"]
    command: ["while true; do nice -n 10 node scripts/replay-uebersicht.mjs --vom-release 2>&1 | tail -2 && node scripts/ablage-github.mjs --nur antworten/replays_uebersicht.json 2>&1 | tail -2; sleep 600; done"]

  # X-Links aus #admin-posts jede Minute als CompHub-Bot nach #social-posts (mit @everyone), Quelle mit ✅ abgehakt (scripts/discord-tweets.mjs).
  tweets:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    env_file: web.env
    mem_limit: 512m
    entrypoint: ["sh", "-c"]
    command: ["while true; do node scripts/discord-tweets.mjs --aus-admin-posts --anwenden 2>&1 | grep -v 'Keine (neuen)' | tail -5; sleep 60; done"]

  # Abgelaufene VIP-Schluessel alle zehn Minuten (app/api/cron/vip-ablauf, lib/discord vipAblaufLauf): Kanal, Rolle und Zugang weg, Erinnerung
  # drei Tage vorher, Countdown in den Schluesselnachrichten, Meldung an #admin-alarm. Gerechnet wird in "web" (dort ist der Bot-Token) - hier
  # nur der Anstoss. Vorher tat das allein die GitHub-Kette in discord-live.yml; die riss am 15.11.2026 um 15:06 UTC ab (API-Grenze) und bekam
  # ohnehin 401. Ein zweiter Anstoss schadet nicht: der Lauf ist idempotent.
  vip-ablauf:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    mem_limit: 256m
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do node -e 'const k=(process.env.CRON_SECRET||process.env.DISCORD_BOT_TOKEN||"").trim(); fetch("http://127.0.0.1:3100/api/cron/vip-ablauf",{headers:{authorization:"Bearer "+k},signal:AbortSignal.timeout(170000)}).then(async(r)=>console.log(new Date().toISOString(),"VIP-Ablauf",r.status,(await r.text()).slice(0,400))).catch((e)=>console.log(new Date().toISOString(),"VIP-Ablauf Fehler",e.message))'; sleep 600; done

  # Die Live-Spur (scripts/live-spur.mjs): volle Replays laufender Cups Match fuer Match, sobald Epic sie fertig abgelegt hat - gleich nach dem Spiel
  # statt 10 bis 20 Minuten spaeter (GitHub "Clutch rechnen" bleibt massgeblich und der einzige, der clutch/, clutch-je/, replays/ ans Release schreibt).
  # SCHATTENBETRIEB: geschrieben wird nur unter ./live (Teile je Match, Live-Stand clutch/<w>.json + clutch-je/<w>.json); die Seite liest davon noch nichts.
  # Gebremst, damit "web" und "hintergrund" Vorrang haben: nice 10, hoechstens 3,5 Kerne, geringes CPU-Gewicht, 5 GB.
  # Die Epic-Anmeldung holt er sich wie die GitHub-Ablaeufe (daten-sync, Schluessel aus web.env) in sein eigenes /app/data; klappt das nicht, nimmt er die
  # von "hintergrund" (./daten, nur lesend eingehaengt - er schreibt dort nie).
  live:
    image: ghcr.io/comphubgg/comphub-web:voll
    restart: always
    network_mode: host
    env_file: web.env
    environment:
      WERKZEUG_URL: http://127.0.0.1:3100
      LIVE_LESER: "3"
      LIVE_LADEN: "6"
      COMPHUB_LIVE_ORT: /app/live
      TZ: Europe/Berlin
      NODE_OPTIONS: --max-old-space-size=3072
    cpus: 3.5
    cpu_shares: 256
    mem_limit: 5g
    volumes:
      - ./live:/app/live
      - ./daten:/app/daten-hintergrund:ro
    entrypoint: ["sh", "-c"]
    command: ["node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2; [ -s data/epic-auth.json ] || cp /app/daten-hintergrund/epic-auth.json data/ 2>/dev/null; exec nice -n 10 node scripts/live-spur.mjs"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    network_mode: host
    user: root
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
