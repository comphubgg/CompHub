<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CompHub is catching its breath</title>
<style>
  :root {
    --grund: #08090c;
    --karte: #101319;
    --rand: rgba(148, 163, 184, .14);
    --text: #e2e8f0;
    --leise: #7d8798;
    --akzent: #0ea5e9;
    --akzent-hell: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--grund);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
    /* Ein sehr ruhiger Schimmer in der Mitte - dasselbe Blau wie auf der
       Startseite, nur weit heruntergedreht. */
    background-image:
      radial-gradient(60rem 32rem at 50% -10%, rgba(14,165,233,.13), transparent 70%);
  }

  main { width: min(560px, 100%); text-align: center; }

  /* --------------------------------------------------------- Das Logo */

  .zeichen {
    position: relative;
    width: 190px;
    margin: 0 auto 34px;
    /* Zwei Bewegungen uebereinander: ein langsames Schweben und ein noch
       langsameres Kippen. Zusammen wirkt es lebendig, ohne zu zappeln -
       die Seite steht mitunter minutenlang offen. */
    animation: schweben 4.6s ease-in-out infinite;
  }
  .zeichen img {
    display: block;
    width: 100%;
    filter: drop-shadow(0 14px 34px rgba(14,165,233,.30));
    animation: kippen 9s ease-in-out infinite;
  }
  /* Der Schein darunter atmet gegenlaeufig mit. */
  .zeichen::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -18px;
    width: 62%; height: 16px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(14,165,233,.34), transparent);
    animation: atmen 4.6s ease-in-out infinite;
  }
  @keyframes schweben {
    0%, 100% { transform: translateY(-7px); }
    50%      { transform: translateY(7px); }
  }
  @keyframes kippen {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.2deg); }
  }
  @keyframes atmen {
    0%, 100% { opacity: .30; transform: translateX(-50%) scaleX(.86); }
    50%      { opacity: .62; transform: translateX(-50%) scaleX(1.1); }
  }

  /* --------------------------------------------------------- Der Text */

  .marke {
    font-size: 12px; font-weight: 700; letter-spacing: .28em;
    text-transform: uppercase; color: var(--akzent-hell);
  }
  h1 {
    margin-top: 14px;
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 800; letter-spacing: -.02em;
    text-wrap: balance;
  }
  p.satz {
    margin: 14px auto 0;
    max-width: 42ch;
    font-size: 15px; line-height: 1.65; color: var(--leise);
  }

  /* ------------------------------------------------------- Der Kasten */

  .kasten {
    margin-top: 30px;
    display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap;
    border: 1px solid var(--rand);
    border-radius: 14px;
    background: var(--karte);
    padding: 14px 18px;
  }
  .punkt {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--akzent);
    box-shadow: 0 0 0 0 rgba(14,165,233,.55);
    animation: puls 1.9s ease-out infinite;
  }
  @keyframes puls {
    0%   { box-shadow: 0 0 0 0 rgba(14,165,233,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(14,165,233,0); }
    100% { box-shadow: 0 0 0 0 rgba(14,165,233,0); }
  }
  .kasten span.was { font-size: 14px; color: var(--text); }
  .kasten b { color: var(--akzent-hell); font-variant-numeric: tabular-nums; }

  button {
    border: 1px solid var(--akzent);
    background: rgba(14,165,233,.12);
    color: var(--akzent-hell);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 16px; border-radius: 9px; cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  button:hover { background: var(--akzent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--akzent-hell); outline-offset: 2px; }

  footer {
    margin-top: 26px;
    font-size: 11px; color: #4d5561; letter-spacing: .04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .zeichen, .zeichen img, .zeichen::after, .punkt { animation: none; }
  }
</style>
</head>

  <h1>We're catching our breath</h1>
  <p class="satz">
    The server behind CompHub is not answering right now. Nothing is lost —
    stats, tournaments and your tier lists are all still there. Sorry for the
    interruption.
  </p>

  <div class="kasten">
    <span class="punkt"></span>
    <span class="was">Checking again in <b id="zaehler">30</b>s</span>
    <button id="jetzt" type="button">Try now</button>
  </div>

  <footer>Fortnite Competitive · thecomphub.com</footer>

<script>
/*
 * Von selbst nachsehen.
 *
 * Wer hier landet, soll nicht alle paar Minuten F5 druecken. Alle dreissig
 * Sekunden wird neu geladen; sobald der Server wieder da ist, steht die Seite
 * wieder. Der Knopf macht dasselbe sofort.
 */
(function () {
  var rest = 30;
  var feld = document.getElementById('zaehler');
  function neu() { location.reload(); }
  document.getElementById('jetzt').addEventListener('click', neu);
  setInterval(function () {
    rest -= 1;
    if (rest <= 0) return neu();
    feld.textContent = rest;
  }, 1000);
})();
</script>
