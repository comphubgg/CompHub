<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Was möchtest du teilen?</title>
<style>
  :root { --grund: #09090b; --karte: #111114; --rand: #27272a; --text: #e4e4e7; --leise: #71717a; --akzent: #0ea5e9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--grund); color: var(--text); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; padding: 20px 22px 16px; user-select: none; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.hinweis { margin: 0 0 14px; color: var(--leise); font-size: 12.5px; }
  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--leise); margin: 16px 0 8px; font-weight: 600; }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  button.karte { text-align: left; background: var(--karte); border: 1px solid var(--rand); border-radius: 10px; padding: 8px; color: inherit; cursor: pointer; transition: border-color .12s, background .12s; }
  button.karte:hover { border-color: var(--akzent); background: #14161a; }
  button.karte img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #000; display: block; }
  button.karte span { display: block; margin-top: 7px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fuss { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 12px; background: linear-gradient(transparent, var(--grund) 30%); }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  input[type=checkbox] { accent-color: var(--akzent); width: 15px; height: 15px; }
  button.zu { background: transparent; border: 1px solid var(--rand); color: var(--text); border-radius: 8px; padding: 7px 16px; cursor: pointer; }
  button.zu:hover { border-color: var(--leise); }
</style>
</head>
<body>
  <h1>Was möchtest du teilen?</h1>
  <p class="hinweis">Für den Spielton den ganzen Bildschirm wählen und „Systemton mitsenden“ angehakt lassen.</p>
  <div id="inhalt"></div>
  <div class="fuss">
    <label><input id="ton" type="checkbox" checked> Systemton mitsenden</label>
    <button class="zu" id="abbrechen">Abbrechen</button>
  </div>
<script>
  const inhalt = document.getElementById('inhalt');
  const ton = document.getElementById('ton');
  function gruppe(titel, liste) {
    if (!liste.length) return;
    const h = document.createElement('h2'); h.textContent = titel; inhalt.appendChild(h);
    const r = document.createElement('div'); r.className = 'raster';
    for (const q of liste) {
      const b = document.createElement('button'); b.className = 'karte'; b.title = q.name;
      const i = document.createElement('img'); i.src = q.bild; i.alt = '';
      const s = document.createElement('span'); s.textContent = q.name;
      b.append(i, s);
      b.addEventListener('click', () => window.quelle.waehle({ id: q.id, ton: ton.checked }));
      r.appendChild(b);
    }
    inhalt.appendChild(r);
  }
  window.quelle.liste().then((liste) => {
    gruppe('Bildschirme', liste.filter((q) => q.schirm));
    gruppe('Fenster', liste.filter((q) => !q.schirm));
  });
  document.getElementById('abbrechen').addEventListener('click', () => window.quelle.waehle(null));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.quelle.waehle(null); });
</script>
</body>
</html>
