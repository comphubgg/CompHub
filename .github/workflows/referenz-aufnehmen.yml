# Interne Referenz-Aufnahme einer fremden Replay-Seite (Screenshots + JSON), nur zur Funktionsanalyse. Ergebnis als tar im Release "medien".
name: Referenz aufnehmen
on:
  push:
    branches: [replay-ausbau]
    paths: ['tools/referenz/**', '.github/workflows/referenz-aufnehmen.yml']
  workflow_dispatch:
    inputs:
      url: { description: 'Seite', required: true }
      name: { description: 'Dateiname im Release medien', required: false, default: 'referenz-replay' }
permissions:
  contents: write
jobs:
  aufnehmen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Aufnehmen
        env: { URL: "${{ inputs.url || 'https://eucompetitive.com/gametool/replay' }}" }
        run: node tools/referenz/aufnehmen.mjs "$URL" referenz || true
      - name: Hochladen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name || 'referenz-replay' }}
        run: |
          ls -la referenz || exit 0
          cat referenz/log.txt | head -100 || true
          tar -cf "$NAME.tar" referenz
          gh release upload medien "$NAME.tar" --clobber
