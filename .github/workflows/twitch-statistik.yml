# Die Twitch-Statistik der VIPs sammeln (scripts/twitch-statistik.mjs) - als Dauerlauf, der sich am Ende selbst wieder anstoesst.
#
# Der Betreiber (27.10.2026): Tag/Woche/Monat/Jahr/gesamt - Spitze mit und ohne Raid, neue Follower, Chatter, fuer die VIPs, denen er es gibt
# (/twitch-statistik). Zuschauer jede Minute, Follower alle zehn Minuten, der Chat dauernd (anonym) - deshalb ein Auftrag, der rund fuenfeinhalb Stunden
# anbleibt, kein Zeitplan im Minutentakt (GitHub uebergeht solche Plaene unter Last). Der Zeitplan ist nur der Rueckfall, falls die Kette reisst.

name: Twitch-Statistik

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twitch-statistik.yml'
      - 'scripts/twitch-statistik.mjs'
  schedule:
    - cron: '23 */3 * * *'

concurrency:
  group: twitch-statistik
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Vorrang fuer grosse Cups (16.11.2026): laeuft ein grosser Cup (FNCS, Cash, Performance Evaluation ...) oder endete er vor hoechstens einer Stunde,
  # belegt ein geplanter Lauf keinen der 20 Rechner - die volle Auswertung des Cups (clutch-rechnen.yml) geht vor. Von Hand angestossen laeuft er immer.
  vorrang:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      frei: ${{ steps.p.outputs.frei }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          frei=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            curl -sfL --max-time 20 "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/frischer-cup.mjs" -o /tmp/frisch.mjs \
              && n=$(node /tmp/frisch.mjs --gross --nach 60 || echo 0) || n=0
            if [ "${n:-0}" -gt 0 ]; then frei=0; echo "Grosser Cup laeuft oder endete vor weniger als einer Stunde ($(node /tmp/frisch.mjs --gross --nach 60 --liste)) - dieser Lauf wartet auf den naechsten Termin."; fi
          fi
          echo "frei=$frei" >> "$GITHUB_OUTPUT"

  sammeln:
    needs: vorrang
    if: needs.vorrang.outputs.frei == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Sammeln
        id: sammeln
        continue-on-error: true
        timeout-minutes: 335
        run: node scripts/twitch-statistik.mjs --minuten 330

      # Ohne eingetragene Kanaele kein naechster Auftrag (der Eintrag auf der Seite stoesst ihn an, der Zeitplan schaut alle drei Stunden nach).
      - name: Naechsten Auftrag anstossen
        if: ${{ !cancelled() && steps.sammeln.outputs.kanaele != '0' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run twitch-statistik.yml -R "${{ github.repository }}" --ref main && echo "naechster Auftrag angestossen"

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
