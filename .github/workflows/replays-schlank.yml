# Die schlanken Replay-Werte fuer die Seite - eigenstaendig und alle halbe Stunde.
#
# Der Betreiber (26.10.2026): bei einem Cup vom 22.10. stand "No replays analysed", obwohl die Auswertungen da waren. Die Seite liest je Spieltag nur die
# schlanke Fassung (lib/replaySchlank.ts); die entstand bisher nur im stuendlichen Gesamtlauf (daten-erneuern.yml) und kam an dessen gedeckeltem Hochladen
# nicht vorbei: die juengste lag am 15.10.2026 noch auf dem Stand vom 11.10.
#
# Hier ein kleiner, eigener Ablauf: Verzeichnisse der Releases vergleichen, nur die Spieltage holen, deren schlanke Fassung fehlt oder veraltet ist, die
# schlanken Dateien anlegen, hochladen. Ein Durchgang dauert Minuten; was nicht in einen Durchgang passt, kommt im naechsten dran.

name: Replays schlank

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/replays-schlank.yml'
      - 'scripts/replays-schlank-holen.mjs'
      - 'scripts/replays-schlank.mjs'

concurrency:
  group: replays-schlank
  cancel-in-progress: false

jobs:
  schlank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Auswertungen holen, schlank anlegen
        run: node scripts/replays-schlank-holen.mjs --hoechstens 80 2>&1 | tail -30

      - name: Ans Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls data/replays-schlank/S42 2>/dev/null | wc -l
          node scripts/ablage-github.mjs --nur replays-schlank 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -12

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
