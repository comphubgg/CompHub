# Diagnose: wo gehen Treffer eines Spielers im Replay-Leser verloren? (10.11.2026, Squads Victory Cup: Osirion zeigte bei manchen Spielern doppelt so viel Schaden)
name: Schaden-Diagnose

on:
  workflow_dispatch:
    inputs:
      match:
        description: Match-Id(s), Komma-getrennt
        required: true
      spieler:
        description: Spieler-Id(s) im Replay, gleiche Reihenfolge
        required: true
      fenster:
        description: Zeitfenster fuer Projektil-Verlust (s)
        required: false
        default: '0.6'
      zeiten:
        description: Zeitpunkte (s) fuer das Detailfenster, Komma-getrennt
        required: false
        default: ''
      rahmen:
        description: Zeitwaechter je Rahmen (ms)
        required: false
        default: '3000'
      umgebung:
        description: 'Zusaetzliche Schalter fuer den Leser, z. B. SCHADEN_AKTEUR=1 (Leerzeichen-getrennt)'
        required: false
        default: ''
      vergleich:
        description: 'Schaden je Match gegen Epic (nur Solo): eventId,windowId'
        required: false
        default: ''
      epic:
        description: 'Epic-Gegenprobe: eventId,windowId,epicId (leer = aus)'
        required: false
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Zugangsdaten
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
      - name: Epic-Gegenprobe
        if: inputs.epic != ''
        env:
          EPIC: ${{ inputs.epic }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra E <<< "$EPIC"
          if [ "${E[0]}" = "sitzungen" ]; then node scripts/diag-epic-sitzungen.mjs "${E[1]}" "${E[2]}" /tmp/epic-sitzungen.json "${E[3]:-3}" 2>&1 | grep EPIC; exit 0; fi
          if [ "${E[0]}" = "probe" ]; then node scripts/team-probe.mjs "${E[1]}" "${E[2]}" 2>&1 | grep PROBE; exit 0; fi
          if [ "${E[0]}" = "rangliste" ]; then node scripts/rangliste.mjs "${E[1]}" "${E[2]}" 2>&1 | grep RANG; exit 0; fi
          if [ "${E[0]}" = "jahr" ]; then JAHR_SEITEN=10 node scripts/spieler-jahr.mjs "${E[1]}" "${E[@]:2}" 2>&1 | grep JAHR; exit 0; fi
          if [ "${E[2]}" = "gegenprobe-aus" ]; then echo "(nach der Diagnose)"; elif [ "${E[2]}" = "gegenprobe" ]; then
            ID=$(gh api "repos/${{ github.repository }}/releases/tags/daten-clutch-roh" --jq ".assets[] | select(.name==\"clutch-roh__${E[1]}.json\") | .id")
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$ID" > /tmp/roh.json
            S=$(echo "${E[1]}" | grep -oE '^S[0-9]+' | tr 'S' 's')
            JID=$(gh api "repos/${{ github.repository }}/releases/tags/daten-clutch-je-$S" --jq ".assets[] | select(.name==\"clutch-je__${E[1]}.json\") | .id" 2>/dev/null)
            [ -n "$JID" ] && gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$JID" > /tmp/je.json
            node scripts/epic-gegenprobe.mjs "${E[0]}" "${E[1]}" /tmp/roh.json /tmp/je.json 2>&1 | tail -90
          else
            node scripts/epic-team-pruefen.mjs "${E[0]}" "${E[1]}" "${E[2]}" 2>&1 | tail -30
          fi
      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -5
      - name: Diagnose
        env:
          MATCHES: ${{ inputs.match }}
          SPIELER: ${{ inputs.spieler }}
          SCHADEN_ZEITEN: ${{ inputs.zeiten }}
          SCHADEN_FENSTER: ${{ inputs.fenster }}
          RAHMEN_MS: ${{ inputs.rahmen }}
        run: |
          for KV in ${{ inputs.umgebung }}; do export "$KV"; echo "Schalter: $KV"; done
          IFS=',' read -ra M <<< "$MATCHES"; IFS=',' read -ra S <<< "$SPIELER"
          for i in "${!M[@]}"; do
            echo "=== Match ${M[$i]} Spieler ${S[$i]}"
            node -e "const { downloadReplay } = require('fortnite-serverreplay-downloader'); (async () => { const b = await downloadReplay({ matchId: process.argv[1], dataCount: 100000, checkpointCount: 0, eventCount: 100000 }); require('fs').writeFileSync('/tmp/m.replay', b); console.log('geladen', b.length); })();" "${M[$i]}"
            node scripts/replay-zerlegen.mjs /tmp/m.replay 2>&1 | tail -40 || true
            mkdir -p "/tmp/ev-${M[$i]}" && node scripts/diag-ereignisse.mjs /tmp/m.replay "/tmp/ev-${M[$i]}" 2>&1 | cut -c1-600 | head -20 || true
            T0=$(date +%s.%N)
            SCHADEN_NEU="${NEU:-1}" SCHADEN_DIAG="${S[$i]}" dotnet tools/replay-voll/bin/Release/net10.0/ReplayVollReplayReader.dll /tmp/m.replay 2>/tmp/err.txt >/tmp/aus.json || echo "Exit $?"; echo "ZEIT Leser $(echo "$(date +%s.%N) - $T0" | bc) s"; grep -aE "Zeitlimit|PAKET|haengt|STAPEL|PRUEF SUMME|DIAG ABBAU|FELDENDE" /tmp/err.txt | head -80 || true; grep -E "DIAG|Fehler|Exception|defekt" /tmp/err.txt | grep -vE "DIAGWAFFE|DIAGSCHLEUDER|DIAGPARAM|DIAGFELDER|DIAGARRAY|DIAGGC|DIAGPARSER|DIAGCACHE|DIAGEFFEKT t|DIAGCUE|DIAGOPFER|DIAGVERLUST Spieler" | head -300 || true; grep -vE "^DIAG" /tmp/err.txt | head -60
            node -e "const t=require('fs').readFileSync('/tmp/aus.json','utf8');console.log('aus.json',t.length,'Bytes');try{const d=JSON.parse(t);console.log('Felder',Object.keys(d).join(','),'spieler',(d.spieler||[]).length,'schaden',(d.schaden||[]).length)}catch(e){console.log('kein JSON',t.slice(0,300))}" || true
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/aus.json','utf8'));const s=(d.schaden||[]).find(x=>x.id==process.argv[1]);const p=(d.spieler||[]).find(x=>x.id==process.argv[1]);console.log('Leser:',p&&p.name,JSON.stringify(s))" "${S[$i]}"
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/aus.json','utf8'));const p=(d.spieler||[]).find(x=>x.id==process.argv[1]);if(!p)process.exit();const team=(d.spieler||[]).filter(x=>x.team===p.team);const kv=d.killVerlauf||{};console.log('TEAMKILLS',team.map(x=>x.name+':'+((kv[x.id]||[]).slice(-1)[0]||[0,0])[1]+'/feed'+(d.feed||[]).filter(f=>f.art==='tot'&&f.taeter===x.id).length).join(' | '),'laenge',d.laenge,'feed',(d.feed||[]).length,'killVerlauf-Spieler',Object.keys(kv).length)" "${S[$i]}" || true
            grep -E "DIAG RAHMEN" /tmp/err.txt || true
            grep -E "^DIAGBAU" /tmp/err.txt > /tmp/bau.txt || true
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/aus.json','utf8'));const n={};for(const p of d.spieler||[])n[p.id]=p.name;for(const z of fs.readFileSync('/tmp/bau.txt','utf8').split('\\n').filter(Boolean)){const [, id, ...r]=z.split(' ');console.log('BAU',(n[id]||id).padEnd(22),r.join('  '))}" || true
            node scripts/diag-strecke.mjs /tmp/m.replay /tmp/aus.json 'Focus yhyh|Scroll 10|Toose|Nxthan|hyrax|pixie|Auvahalo|SwizzY|MaxDMG|Propz' || true
            if [ -n "$MS_DIAG" ]; then node scripts/diag-mats.mjs /tmp/aus.json 2>&1 | cut -c1-1500 | head -80 || true; [ -f /tmp/epic-sitzungen.json ] && node scripts/diag-strecke-epic.mjs /tmp/aus.json /tmp/epic-sitzungen.json /tmp/m.replay 2>&1 | head -60 || true; fi
            cp /tmp/aus.json "/tmp/aus-${M[$i]}.json"
            gzip -c /tmp/err.txt > "/tmp/err-${M[$i]}.txt.gz" || true
          done
      - name: Schaden gegen Epic je Match
        if: inputs.vergleich != ''
        env:
          V: ${{ inputs.vergleich }}
        run: |
          IFS=',' read -ra E <<< "$V"
          node scripts/epic-schaden-vergleich.mjs "${E[0]}" "${E[1]}" /tmp 2>&1 | tail -200
      - name: Epic-Gegenprobe mit Kill-Zaehler
        if: endsWith(inputs.epic, 'gegenprobe-aus')
        env:
          EPIC: ${{ inputs.epic }}
        run: |
          IFS=',' read -ra E <<< "$EPIC"
          node scripts/epic-gegenprobe.mjs "${E[0]}" "${E[1]}" aus 2>&1 | tail -60
      - name: Elims wie die Seite
        run: node scripts/diag-elims.mjs 'MrSavage|F1SHYX|zyfo|M8 Rax|TEYYDINHO|Wozah|Calle|VeriSnow|SkyJump|Focus yhyh|demu|Monky|Quix 115' || true
      - name: Summen je Spieler (Damage ohne Boden, Treffer)
        run: |
          node -e "
          const fs=require('fs');const sum={};
          for(const f of fs.readdirSync('/tmp').filter(f=>f.startsWith('aus-'))){const d=JSON.parse(fs.readFileSync('/tmp/'+f,'utf8'));const name=Object.fromEntries((d.spieler||[]).map(p=>[p.id,p.name]));
            for(const x of d.schaden||[]){const n=name[x.id];if(!n)continue;const a=sum[n]??={dmg:0,alle:0,tr:0,gen:0,sp:0};a.dmg+=x.gemachtOhneBoden??x.gemacht;a.alle+=x.gemacht;a.tr+=x.treffer;a.gen+=x.genommenOhneBoden??x.genommen;a.sp++;const sv=(d.streckeVoll||{})[x.id];if(sv){a.strecke=(a.strecke||[0,0,0,0,0]).map((v,i)=>v+sv[i])}const fv=(d.diagFarm||{})[x.id];if(fv){a.farm=(a.farm||[0,0,0,0,0,0,0,0,0]).map((v,i)=>v+Math.round(fv[i]||0))}const ab=(d.abbau||{})[x.id];if(ab){a.abbau=(a.abbau||0)+ab[0]+ab[1]+ab[2]}const sw=(d.schaden||[]).length;const kt=(d.diagKat||{})[x.id]||{};a.kat=a.kat||{};for(const[k,v]of Object.entries(kt))a.kat[k]=(a.kat[k]||0)+v;a.trOB=(a.trOB||0)+(x.trefferOhneBoden||0);a.trGl=(a.trGl||0)+(x.trefferGleichzeitig||0);const u=(d.diagUeber||{})[x.id];if(u){a.ueber=(a.ueber||0)+Math.round(u[0]);a.ueberN=(a.ueberN||0)+u[1];a.ueberNichtTod=(a.ueberNichtTod||0)+Math.round(u[2])}}}
          for(const [n,a] of Object.entries(sum).filter(([n])=>/MrSavage|F1SHYX|zyfo|M8 Rax|TEYYDINHO|Wozah|Calle|VeriSnow|SkyJump|pixie|Focus|demus|huty|Fredoxie|spexx|Matrekarrr|DORAAQG|ROC Kami|R8 Kenty|pkr29|MaxDMG|Alvin123|Scroll 10|Toose|Nxthan|hyrax|Auvahalo|SwizzY|Propz/i.test(n)))console.log('SUMME',n,JSON.stringify(a))"
      # Leser-Ausgabe und Diagnose je Match zum Nachrechnen (15.11.2026) - die Zeilen oben sind gekuerzt.
      - name: Ausgaben aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schaden-diag
          path: |
            /tmp/aus-*.json
            /tmp/err-*.txt.gz
            /tmp/ev-*/*
            /tmp/epic-sitzungen.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
