# Diagnose: wo gehen Treffer eines Spielers im Replay-Leser verloren? (10.11.2026, Squads Victory Cup: Osirion zeigte bei manchen Spielern doppelt so viel Schaden)
name: Schaden-Diagnose

on:
  workflow_dispatch:
    inputs:
      match:
        description: Match-Id(s), Komma-getrennt
        required: true
      spieler:
        description: Spieler-Id(s) im Replay, gleiche Reihenfolge
        required: true
      fenster:
        description: Zeitfenster fuer Projektil-Verlust (s)
        required: false
        default: '0.6'
      zeiten:
        description: Zeitpunkte (s) fuer das Detailfenster, Komma-getrennt
        required: false
        default: ''
      rahmen:
        description: Zeitwaechter je Rahmen (ms)
        required: false
        default: '3000'
      epic:
        description: 'Epic-Gegenprobe: eventId,windowId,epicId (leer = aus)'
        required: false
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Zugangsdaten
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
      - name: Epic-Gegenprobe
        if: inputs.epic != ''
        env:
          EPIC: ${{ inputs.epic }}
        run: |
          IFS=',' read -ra E <<< "$EPIC"
          node scripts/epic-team-pruefen.mjs "${E[0]}" "${E[1]}" "${E[2]}" 2>&1 | tail -30
      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -5
      - name: Diagnose
        env:
          MATCHES: ${{ inputs.match }}
          SPIELER: ${{ inputs.spieler }}
          SCHADEN_ZEITEN: ${{ inputs.zeiten }}
          SCHADEN_FENSTER: ${{ inputs.fenster }}
          RAHMEN_MS: ${{ inputs.rahmen }}
        run: |
          IFS=',' read -ra M <<< "$MATCHES"; IFS=',' read -ra S <<< "$SPIELER"
          for i in "${!M[@]}"; do
            echo "=== Match ${M[$i]} Spieler ${S[$i]}"
            node -e "const { downloadReplay } = require('fortnite-serverreplay-downloader'); (async () => { const b = await downloadReplay({ matchId: process.argv[1], dataCount: 100000, checkpointCount: 0, eventCount: 100000 }); require('fs').writeFileSync('/tmp/m.replay', b); console.log('geladen', b.length); })();" "${M[$i]}"
            node scripts/replay-zerlegen.mjs /tmp/m.replay 2>&1 | tail -40 || true
            SCHADEN_NEU="${NEU:-1}" SCHADEN_DIAG="${S[$i]}" dotnet tools/replay-voll/bin/Release/net10.0/ReplayVollReplayReader.dll /tmp/m.replay 2>/tmp/err.txt >/tmp/aus.json || echo "Exit $?"; grep -aE "Zeitlimit|PAKET|haengt|STAPEL|PRUEF" /tmp/err.txt | head -80 || true; grep -E "DIAG|Fehler|Exception|defekt" /tmp/err.txt | grep -vE "DIAGWAFFE|DIAGSCHLEUDER|DIAGPARAM|DIAGFELDER|DIAGARRAY|DIAGGC|DIAGPARSER|DIAGCACHE|DIAGEFFEKT t|DIAGCUE|DIAGOPFER|DIAGVERLUST Spieler" | head -300 || true; grep -vE "^DIAG" /tmp/err.txt | head -60
            node -e "const t=require('fs').readFileSync('/tmp/aus.json','utf8');console.log('aus.json',t.length,'Bytes');try{const d=JSON.parse(t);console.log('Felder',Object.keys(d).join(','),'spieler',(d.spieler||[]).length,'schaden',(d.schaden||[]).length)}catch(e){console.log('kein JSON',t.slice(0,300))}" || true
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/aus.json','utf8'));const s=(d.schaden||[]).find(x=>x.id==process.argv[1]);const p=(d.spieler||[]).find(x=>x.id==process.argv[1]);console.log('Leser:',p&&p.name,JSON.stringify(s))" "${S[$i]}"
            cp /tmp/aus.json "/tmp/aus-${M[$i]}.json"
          done
      - name: Summen je Spieler (Damage ohne Boden, Treffer)
        run: |
          node -e "
          const fs=require('fs');const sum={};
          for(const f of fs.readdirSync('/tmp').filter(f=>f.startsWith('aus-'))){const d=JSON.parse(fs.readFileSync('/tmp/'+f,'utf8'));const name=Object.fromEntries((d.spieler||[]).map(p=>[p.id,p.name]));
            for(const x of d.schaden||[]){const n=name[x.id];if(!n)continue;const a=sum[n]??={dmg:0,alle:0,tr:0,gen:0,sp:0};a.dmg+=x.gemachtOhneBoden??x.gemacht;a.alle+=x.gemacht;a.tr+=x.treffer;a.gen+=x.genommenOhneBoden??x.genommen;a.sp++;const kt=(d.diagKat||{})[x.id]||{};a.kat=a.kat||{};for(const[k,v]of Object.entries(kt))a.kat[k]=(a.kat[k]||0)+v;a.trOB=(a.trOB||0)+(x.trefferOhneBoden||0);a.trGl=(a.trGl||0)+(x.trefferGleichzeitig||0);const u=(d.diagUeber||{})[x.id];if(u){a.ueber=(a.ueber||0)+Math.round(u[0]);a.ueberN=(a.ueberN||0)+u[1];a.ueberNichtTod=(a.ueberNichtTod||0)+Math.round(u[2])}}}
          for(const [n,a] of Object.entries(sum).filter(([n])=>/MrSavage|F1SHYX|zyfo|M8 Rax|TEYYDINHO|Wozah|Calle|VeriSnow|SkyJump|pixie|Focus|demus/i.test(n)))console.log('SUMME',n,JSON.stringify(a))"
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
