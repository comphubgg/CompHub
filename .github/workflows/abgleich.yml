name: Abgleich

# Ein Abgleich der Replay-Werte gegen Vergleichszahlen (scripts/abgleich-*.mjs) - auf GitHub, damit der Rechner des Betreibers frei bleibt.
on:
  workflow_dispatch:
    inputs:
      skript:
        description: 'Skript unter scripts/ (ohne .mjs)'
        required: true
        default: 'abgleich-heilung'
      argumente:
        description: 'Argumente'
        required: true

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --omit=optional
      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -3
      - name: Epic-Anmeldung
        run: node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
      - name: Abgleich
        env:
          SKRIPT: ${{ inputs.skript }}
          ARGUMENTE: ${{ inputs.argumente }}
        run: |
          case "$SKRIPT" in abgleich-*) ;; *) echo "nur abgleich-Skripte"; exit 1;; esac
          node "scripts/$SKRIPT.mjs" $ARGUMENTE 2>&1 | tail -60
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
