# /stats-Probe (scripts/discord-stats-probe.cjs): die Antwort des Discord-Bots mit echten Daten bauen und ausgeben - aendert nichts, postet nichts.
name: Discord Stats Probe

on:
  workflow_dispatch:
    inputs:
      spieler:
        description: 'Spielername oder Epic-Konto-Id'
        required: true
        default: '8224fc7512ad42818f381e262e4a6a2b'
      cup:
        description: 'w:<Fenster> oder Cup-Id (leer = juengster Cup)'
        required: false
        default: 'w:S43_TriosCashCup_Event2_EU'
      event:
        description: 'eventId fuer die Epic-Gegenprobe (nur mit w:<Fenster> und Konto-Id)'
        required: false
        default: 'epicgames_S43_TriosCashCup_EU'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Zugangsdaten
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
      # Wie auf dem Server liegt das Gerechnete des Spieltags im Datenordner (der Server liest es von der Platte): hier vom Release geholt.
      - name: Daten des Spieltags
        env:
          CUP: ${{ inputs.cup }}
        run: |
          W="${CUP#w:}"; S=$(echo "$W" | grep -oE '^S[0-9]+' || true)
          NAMEN="epic-namen.json spieler-profile.json spielerbilder.json szene-quelle/spielerliste.json"
          if [ -n "$S" ] && [ "$W" != "$CUP" ]; then NAMEN="$NAMEN clutch/$W.json clutch-je/$W.json replays-schlank/$S/$W.json epic-spieltage/$S/$W.json"; fi
          node scripts/ablage-github-holen.mjs $NAMEN 2>&1 | tail -12
      - name: Probe
        env:
          SPIELER: ${{ inputs.spieler }}
          CUP: ${{ inputs.cup }}
          EVENT: ${{ inputs.event }}
        run: node scripts/discord-stats-probe.cjs "$SPIELER" "$CUP" "$EVENT" 2>&1 | grep -E "PROBE|Error|error" | head -400
      # Laeuft auf thecomphub.com schon der Stand mit ?raenge= (Einzelansicht von /stats)? Zeigt nur, ob die Antwort das Feld hat.
      - name: Stand der Seite
        continue-on-error: true
        run: |
          curl -s -m 60 "https://www.thecomphub.com/api/cup-spieler?window=S43_TriosCashCup_Event2_EU&event=epicgames_S43_TriosCashCup_EU&raenge=8224fc7512ad42818f381e262e4a6a2b" \
            | head -c 400; echo
          curl -s -m 30 https://www.thecomphub.com/api/stand | head -c 300; echo
          # Das Profil, das /stats auf dem Server liest (szene-stats) - mit Zeit.
          for ID in a5ed0e8113bb4cb3955630dfdace3fe4 8224fc7512ad42818f381e262e4a6a2b 24b48d453b6942d2ad5dc63d91bf66fc; do
            curl -s -m 60 -o /tmp/p.json -w "szene-stats $ID: HTTP %{http_code} %{time_total}s %{size_download}B\n" "https://www.thecomphub.com/api/szene-stats?spieler=$ID"
            node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/p.json','utf8'));console.log('  ', j.spieler?.anzeige, 'verlauf', (j.verlauf||[]).length, 'epicZeilen', (j.epicZeilen||[]).length, 'juengster', JSON.stringify((j.verlauf||[]).concat(j.epicZeilen||[]).sort((a,b)=>(b.datum||0)-(a.datum||0))[0]||null).slice(0,200))" || true
          done
          head -c 1500 /tmp/p.json >/dev/null
          curl -s -m 60 "https://www.thecomphub.com/api/szene-stats?spieler=a5ed0e8113bb4cb3955630dfdace3fe4" | head -c 1500; echo
          curl -s -m 60 "https://www.thecomphub.com/api/szene-stats?ansicht=suche&q=Focus" | head -c 1500; echo
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local data/epic-auth.json
