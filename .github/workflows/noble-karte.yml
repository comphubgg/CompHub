name: Noble-Karte
# Turnierkarte eines Spieltags (Landespots von Noble Practice) als Bild im Release "medien" - wenn die Seite offline ist.
on:
  workflow_dispatch:
    inputs:
      windowId: { description: 'windowId', required: true }
      titel: { description: 'Cup-Name fuer die Zuordnung ueber Datum', required: false, default: 'Performance Evaluation' }
      beginn: { description: 'Beginn in ms', required: false, default: '' }
      query: { description: 'Parameter fuer die Vorlage (t=...&u=...)', required: false, default: '' }
      name: { description: 'Dateiname im Release', required: true }

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium && sudo apt-get install -y fonts-inter >/dev/null
      - name: Daten
        run: node --experimental-strip-types scripts/noble-karte-daten.mjs "${{ inputs.windowId }}" tools/posts/karte-daten.js "${{ inputs.titel }}" "${{ inputs.beginn }}"
      - name: Zugang
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
      - name: Namen wie auf der Kartenseite
        run: node scripts/karte-namen.cjs tools/posts/karte-daten.js
      - name: Kartenbild (Insel aus der Ablage, sonst Epics Karte)
        run: node scripts/karte-insel-holen.cjs "${{ inputs.windowId }}" tools/posts/karte.png || curl -sL -o tools/posts/karte.png https://fortnite-api.com/images/map.png; file tools/posts/karte.png
      - name: Bild
        run: node tools/posts/aufnehmen.mjs "tools/posts/karte.html?${{ inputs.query }}" "${{ inputs.name }}" 1400 1400
      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload medien "${{ inputs.name }}" --clobber
