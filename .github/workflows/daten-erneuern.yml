# Die Daten von selbst erneuern - und zwar dort, wo die Seite sie liest.
#
# Der Nutzer wollte keinen Knopf zum Aktualisieren, sondern dass sich alles
# planmaessig selbst holt. Dieser Ablauf tut das seit jeher; nur landete das
# Ergebnis bisher im Repository - und weil `data/` in der .gitignore steht,
# fand `git add data/` nie etwas. Jeder Lauf endete still bei "nichts Neues",
# und im Repository gibt es bis heute keinen einzigen Commit "Daten erneuert".
# Die Erneuerung lief also, ohne je etwas zu erneuern.
#
# Seit dem Umzug gibt es ohnehin einen besseren Ort: Supabase. Von dort liest
# die Seite, egal ob sie auf seinem Rechner oder bei Vercel laeuft. Also legt
# der Ablauf sein Ergebnis jetzt dorthin.
#
# Warum ueberhaupt hier und nicht im Webserver: bisher liefen die Nachtlaeufe
# in instrumentation.node.ts, also in einem Vorgang, der durchlaufen muss. Bei
# Vercel gibt es den nicht - dort startet je Anfrage etwas und schlaeft danach
# wieder ein. GitHub Actions ist der passende Ort, und fuer oeffentliche Repos
# kostenlos und ohne Minutengrenze.
#
# Der Weg je Lauf:
#
#   1. Den Datenordner aus dem Zwischenspeicher holen. Die Skripte arbeiten
#      alle nachtragend - sie holen nur, was ihnen fehlt -, und dafuer muessen
#      sie wissen, was schon da ist. Beim ersten Mal oder wenn der
#      Zwischenspeicher abgelaufen ist, kommt der Stand aus Supabase.
#   2. Die Skripte laufen lassen, unveraendert, so wie auf seinem Rechner.
#   3. Nur die Dateien nach Supabase schreiben, die dieser Lauf angefasst hat -
#      geprueft, Zeichen fuer Zeichen. Alles hochzuladen waere nicht nur
#      langsam, es wuerde das kostenlose Kontingent in Tagen aufbrauchen.

name: Daten erneuern

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'   # jede Stunde, funfzehn nach

jobs:
  erneuern:
    runs-on: ubuntu-latest
    # Schreiben ans Release (zweite Ablage) braucht contents: write.
    permissions:
      contents: write
      # Fuer den Anstoss des naechsten Laufs (letzter Schritt).
      actions: write
    # Ein Lauf braucht gemessen gut neunzig Minuten (Replays holen 30,
    # Antworten vorrechnen 13, Supabase 12, Release 15). Mit einer Frist von
    # neunzig wurde am Ende jeder Lauf als "cancelled" abgebrochen - vierzig
    # Laeufe hintereinander ohne einen einzigen Erfolg, und der
    # Zwischenspeicher am Ende blieb jedes Mal ungesichert. Die Frist ist
    # jetzt weit genug; ueberlappen koennen sich Laeufe wegen der
    # Gruppe unten ohnehin nicht.
    # 16.11.2026: 100 statt 170. Ein Lauf braucht jetzt um 45 Minuten (Vorrechnen 20, Hochladen im Hintergrund); nur ein kalter Lauf
    # ohne Zwischenspeicher ("Stand vom Release holen", bis 40 Minuten) braucht mehr.
    timeout-minutes: 100

    # Zwei Laeufe gleichzeitig wuerden einander dieselben Zeilen
    # ueberschreiben - und der zweite haette den aelteren Stand.
    concurrency:
      group: daten-erneuern
      cancel-in-progress: false

    # Clutch-Dateien schreibt nur .github/workflows/clutch-rechnen.yml,
    # die voll ausgelesenen Replays nur .github/workflows/replays-voll.yml
    # (zwei Schreiber an einem Index verlieren sich gegenseitig Eintraege),
    # Replay-Staende und schlanke Fassungen nur die Replay-Ablaeufe
    # (replays-schnell.yml, replays-nacharbeiten.yml, replays-schlank.yml).
    env:
      OHNE_CLUTCH: '1'
      OHNE_REPLAYVOLL: '1'
      OHNE_REPLAYS: '1'
    steps:
      - name: Beginn merken
        run: echo "LAUF_BEGINN=$(date +%s)" >> "$GITHUB_ENV"

      # GitHub laesst geplante Laeufe unter Last ausfallen (am 28.9.2026 fuenf
      # Stunden lang keiner) - jeder Lauf stoesst den naechsten selbst an.
      # Den naechsten Lauf gleich zu Beginn anstossen. Er wartet in der
      # Gruppe (concurrency), bis dieser fertig ist. Am Ende stand der Schritt
      # hinter "Datenordner sichern" - und fiel mit weg, wenn der Laufrechner
      # dabei abgeschaltet wurde ("The runner has received a shutdown
      # signal", 29.9.2026, 09:56). Danach kam sechs Stunden lang kein Lauf.
      - name: Naechsten Lauf anstossen
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Nur, wenn nicht schon einer wartet (16.11.2026): GitHub haelt je Gruppe hoechstens einen wartenden Lauf und bricht den
        # aelteren ab, sobald ein neuer kommt - jeder Anstoss neben dem stuendlichen Plan erzeugte so einen "cancelled"-Lauf.
        run: |
          WARTEND=$(gh run list -R "${{ github.repository }}" -w daten-erneuern.yml -L 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' || echo 0)
          if [ "${WARTEND:-0}" -gt 0 ]; then echo "es wartet schon ein Lauf ($WARTEND) - kein weiterer"; exit 0; fi
          gh workflow run daten-erneuern.yml -R "${{ github.repository }}" --ref main && echo "naechster Lauf angestossen"
          # Die beiden Replay-Ablaeufe (replays-voll.yml, eigene-auswerten.yml) sind Schleifen und halten sich selbst am Laufen.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Mit den optionalen Paketen: darin steckt der native Uebersetzer von
      # Next (@next/swc-linux-x64-gnu). Ohne ihn scheiterte "Anwendung bauen"
      # nach zehn Sekunden, "continue-on-error" verschluckte es, und seit dem
      # 8. September kam aus diesem Ablauf keine einzige fertige Antwort mehr.
      - name: Abhängigkeiten
        run: npm ci

      - name: Zugangsdaten
        # Ein einziges Geheimnis mit dem Inhalt von .env.local - so kann beim
        # Einrichten kein einzelner Schluessel vergessen werden. Ausgegeben
        # wird davon nichts.
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      # Holen und Sichern getrennt, nicht als ein Schritt.
      #
      # actions/cache sichert erst am Ende des Auftrags - und nur, wenn der
      # Auftrag durchgelaufen ist. Genau daran hing der Ablauf fest: der
      # Schritt "Stand aus Supabase holen" laeuft nur bei leerem
      # Zwischenspeicher, er scheiterte, der Auftrag scheiterte, also wurde
      # nie ein Zwischenspeicher geschrieben - und beim naechsten Lauf war
      # er wieder leer. Stunde um Stunde dieselbe Fehlermail.
      #
      # Mit "save" und "if: always()" wird gesichert, was dieser Lauf
      # zusammengetragen hat, auch wenn spaeter etwas schiefgeht. Der
      # naechste Lauf faengt dann nicht wieder bei null an.
      - name: Datenordner aus dem Zwischenspeicher
        id: zwischenspeicher
        uses: actions/cache/restore@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}
          restore-keys: comphub-daten-

      # Aufraeumen nach dem Fehler vom 25.9.2026 (siehe "Anwendung bauen"):
      # jeder Lauf hatte den Datenordner eine Ebene tiefer geschoben, bis zu
      # data/daten-beiseite/daten-beiseite/... Die Ebenen werden hier wieder
      # zusammengefuehrt - die neueste zuerst, aeltere fuellen nur Luecken.
      # Danach ist nichts verloren; faellt nichts an, tut der Schritt nichts.
      - name: Verschachtelten Datenordner zusammenfuehren
        run: |
          EBENEN=0
          while [ -d data/daten-beiseite ]; do
            mv data/daten-beiseite /tmp/alte-ebene
            cp -rn /tmp/alte-ebene/. data/ 2>/dev/null || true
            rm -rf /tmp/alte-ebene
            EBENEN=$((EBENEN + 1))
          done
          echo "Zusammengefuehrt: $EBENEN Ebenen"

      # Einmalig (17.11.2026): alles aus der gesperrten Quelle und alles daraus Gerechnete aus dem Datenordner des Zwischenspeichers - die Akten, die
      # Antworten der Statistik und die LAN-Zuordnung rechnet dieser Lauf aus eigenen Daten neu (scripts/fremdquellen-sperre.mjs, fremdquelle-loeschen.mjs).
      - name: Gesperrte Quelle aus dem Datenordner
        run: |
          if [ ! -f data/.fremdquelle-weg-1711 ]; then
            rm -rf data/szene-stats data/szene-quelle data/akten data/_akten-vorstufe
            find data -maxdepth 1 -name 'eu*-tierlist.json' -delete 2>/dev/null || true
            rm -f data/fotos-eingang.json data/fehlende-bilder.txt data/bekannte-ohne-foto.txt data/lan-konten.json
            if [ -d data/antworten ]; then
              find data/antworten -maxdepth 1 \( -name 'szene_*' -o -name 'center_*' -o -name 'laender_*' -o -name 'tierlist_trios_auto*' \) -delete
            fi
            mkdir -p data && touch data/.fremdquelle-weg-1711
            echo "Datenordner gesaeubert"
          else
            echo "schon gesaeubert"
          fi

      - name: Stand vom Release holen
        # Nur wenn der Zwischenspeicher nichts hergab. GitHub wirft ihn nach
        # sieben Tagen ohne Zugriff weg; dann faengt der Lauf sonst bei null an
        # und wuerde alles neu von Epic holen.
        #
        # Vom Release, nicht aus Supabase: seit dem 22.9.2026 liegt alles
        # Gerechnete nur noch dort ("nur das Noetigste" in Supabase - das
        # Kontingent dort war an genau solchen Abholungen aufgebraucht).
        if: steps.zwischenspeicher.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner platzierungen \
            --ordner power-rankings \
            --ordner tournament-leaderboards --ordner akten --ordner antworten --ordner replays --ordner replays/S42 --ordner replays/S43 --ordner replays/S44 --ordner clutch \
            --ordner replays-schlank/S42 --ordner replays-schlank/S43 --ordner replays-schlank/S44 \
            2>&1 | tail -12

      # Die kleinen Staende jede Stunde: Fotos, gepflegte Profile, Namen,
      # Preisgelder. Sie aendern sich auf der Seite (der Betreiber pflegt
      # Fotos und Profile dort), und der Zwischenspeicher hier kennt davon
      # sonst nur den Stand vom ersten Tag. Genau so kam eine Startansicht
      # ohne ein einziges Bild in die Ablage: der Laufrechner hatte keine
      # spielerbilder.json. Alles Grosse bleibt draussen.
      - name: Das Noetigste aus dem Archiv
        id: noetiges
        # Genau die Liste aus scripts/daten-sync.mjs (NOETIGES) - was
        # Nutzer und Betreiber auf der Seite schreiben. Sonst nichts.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          node scripts/daten-sync.mjs --herunterladen --noetiges \
            --ohne kartenbilder,kontakt-bilder,admin-maps,galerie,eigene-matches \
            2>&1 | tail -4

      # Das Gepflegte sofort ans Release - vor allem anderen.
      #
      # Antwortet Supabase nicht, liest die Seite Karten, Prognosen und
      # Profile vom Release. Am 24.9.2026 war diese Kopie vom Vortag: das
      # Sichern stand hinter den Replays, und die hingen seit Stunden. Die
      # Globals-Karte stand waehrend eines Ausfalls dadurch ohne ein einziges
      # Team da. Jetzt wandern die gepflegten Dateien gleich nach dem Holen
      # hoch - aber nur, wenn das Holen geklappt hat, sonst laege hier ein
      # alter Stand aus dem Zwischenspeicher, und der ersetzte einen neueren.
      - name: Gepflegtes sofort ans Release
        if: steps.noetiges.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nur hier duerfen die gepflegten Dateien ans Release - siehe
          # scripts/ablage-github.mjs, GEPFLEGT.
          GEPFLEGT_HOCHLADEN: '1'
        run: |
          node scripts/ablage-github.mjs --nur prognosen.json --nur turnier-karten.json \
            --nur karten-vorlagen.json --nur spieler-profile.json --nur spielerbilder.json \
            --nur spieler-namen.json --nur orgtags.json 2>&1 | tail -6

      # Die Verdienst-Akte und Epics Auszahlungstabellen entstehen nur auf dem
      # Betreiber-Rechner (die alten Bestenlisten liegen nur dort) und kommen
      # von dort ans Release. Antwortet Supabase nicht, rechnete dieser Lauf
      # die Akten sonst mit dem Stand aus seinem Zwischenspeicher und lud sie
      # hoch - die Profile fielen auf gestern zurueck. Das Release ist fuer
      # diese Dateien die massgebliche Kopie.
      - name: Verdienst-Akte und Tabellen vom Release
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/ablage-github-holen.mjs verdienst-archiv.json elims-archiv.json elims-summen-alt.json preisgeld-tabellen.json wertung-tabellen.json lan-preisgelder.json lan-konten.json 2>&1 | tail -6

      # Die ausgewerteten Replays, aber nur, was sich geaendert hat.
      #
      # Der Live-Sammler legt waehrend eines Cups Aggregate ab, die dieser
      # Lauf nicht hat - und die Startseite, die hier vorgerechnet wird,
      # zaehlt daraus die Eliminierungen. Ohne diesen Schritt fehlten ihr
      # die juengsten Spieltage, und der Sammler unten hielte jedes dieser
      # Fenster fuer unberuehrt. Beim ersten Mal sind das siebenhundert
      # Megabyte, danach nur noch die Fenster, die sich bewegt haben.
      # Die ausgewerteten Replays des Live-Sammlers (replays-live.yml) und
      # die Epic-Spieltage, die der Betreiber-Rechner nach Kennung holt
      # (epic-fenster-holen.mjs): beides kommt seit dem 22.9.2026 vom
      # Release, nicht mehr aus Supabase. Nur, was sich unterscheidet.
      - name: Replays und Spieltage vom Release
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # Dazu Schaden und Clutch je Spieltag (Ablauf "Clutch rechnen") fuer die Akten.
          node scripts/ablage-github-holen.mjs --ordner replays --ordner replays/S42 --ordner replays/S43 --ordner replays/S44 --ordner epic-spieltage --ordner clutch 2>&1 | tail -4
          # Die schlanken Replays (16.11.2026). Seit der Schritt "Replays schlank ablegen" hier aus ist (29.10.), kamen sie nie mehr auf diesen
          # Rechner: lib/replaySchlank las fuer jeden neueren Spieltag das volle Aggregat (bis 156 MB) und fuer aeltere eine Fassung vom 29.10.
          # Gemessen (Messlauf 43869136304): die Startansicht von S42 las so 900 Replay-Dateien, 10,7 GB, und kam nicht durch.
          # Am Release liegen sie fertig (replays-schlank.yml): S42 0,8 GB, S43 0,2 GB, danach nur, was sich aendert.
          node scripts/ablage-github-holen.mjs --ordner replays-schlank/S42 --ordner replays-schlank/S43 --ordner replays-schlank/S44 2>&1 | tail -2

      # Alte Spieltage suchen, die Epics Liste nicht mehr nennt - je Lauf
      # ein Stueck (1500 Abfragen, gut zehn Minuten), das Gedaechtnis liegt
      # im Zwischenspeicher (_gesucht.json). Was gefunden wird, laedt der
      # Schritt "Ergebnis nach Supabase" mit hoch. Siehe das Skript.
      #
      # 16.11.2026: im Hintergrund, neben den Schritten bis zum Hochladen (vorher zwoelf Minuten je Lauf allein). Er fragt nur Epic
      # ueber die Seite und legt neue Dateien ganz oder gar nicht ab (scripts/epic-fenster-suchen.mjs, schreibeGanz); der Schritt
      # "Alte Spieltage abwarten" vor dem ersten grossen Hochladen wartet auf ihn. Zehn statt zwoelf Minuten - die gingen ohnehin
      # verloren: jede Epic-404 kam als 500 an und galt als Aussetzer, die Zahl der offenen Kennungen blieb Lauf fuer Lauf 274994.
      - name: Alte Spieltage suchen (Hintergrund)
        continue-on-error: true
        timeout-minutes: 1
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: |
          nohup bash -c 'timeout --signal=TERM 10m node scripts/epic-fenster-suchen.mjs --hoechstens 1500 > /tmp/suchen.log 2>&1; touch /tmp/suchen.fertig' > /dev/null 2>&1 &
          echo "gestartet"

      # Auch hier die Adresse des Werkzeugs. Ohne sie fragte das Skript auf
      # localhost ins Leere und brach nach einer Sekunde mit ECONNREFUSED ab
      # - Stunde um Stunde, unter "continue-on-error" unsichtbar. Genau
      # deshalb tauchte ein Cup, der gerade zu Ende war, weder unter
      # Turnieren noch in den Profilen auf: die Epic-Spieltage kamen nie.
      # Gefunden ueber das Protokoll des Laufs, das der Betreiber mit einem
      # GitHub-Token lesbar gemacht hat.
      - name: Spieltage holen
        continue-on-error: true
        timeout-minutes: 15
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: node scripts/epic-spieltage-holen.mjs 2>&1 | tail -20

      # Die neuen Spieltage sofort ans Release, nicht erst mit dem grossen Hochladen am Ende.
      #
      # Der Schritt oben brach seit dem 3.10.2026 jede Stunde nach 15 Minuten ab (sein Zeitrahmen fehlte), und die grossen Upload-Schritte
      # weiter unten brechen nach 25 bzw. 45 Minuten ab, weil GitHub nur achtzig Anlegen/Loeschen je Minute zulaesst und hunderte
      # Replay-Aggregate davor stehen. Dazwischen lag jedes Mal alles, was geholt war - und kam nie an. Dieser Schritt ist klein (nur
      # der Ordner epic-spieltage, wenige neue Dateien) und kommt deshalb immer durch; die Replay-Auswahl und die Profile lesen von dort.
      - name: Spieltage ans Release
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ablage-github.mjs --nur epic-spieltage 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -8

      # Die Team-Eliminierungen aus Epics Bestenlisten (Statistik, Jahre):
      # die offenen Saisons aus den Spieltagen oben neu, das laufende Jahr
      # und "alle Zeit" dazu aus den abgeschlossenen Summen vom Release
      # (elims-summen-alt.json, gebaut auf dem Betreiber-Rechner). Die
      # Jahre davor bleiben, wie sie sind. Siehe scripts/elims-archiv.mjs.
      - name: Team-Eliminierungen ergaenzen
        continue-on-error: true
        timeout-minutes: 5
        run: node --max-old-space-size=4096 scripts/elims-archiv.mjs --ergaenzen 2>&1 | tail -6

      # Auch hier die Adresse des Werkzeugs: das Skript holt die Bestenlisten
      # ueber die eigene Schnittstelle, und ohne die Adresse fragt es auf
      # localhost ins Leere - zwanzig Minuten lang, fuer jeden Spieltag ein
      # Fehlschlag. In der Ablage lagen deshalb fuer die laufende Saison genau
      # zwei Platzierungsdateien, und auf der Statistikseite stand bei Platz
      # und Punkten ein Strich.
      - name: Platzierungen holen
        continue-on-error: true
        timeout-minutes: 12
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: node scripts/platzierungen-holen.mjs 2>&1 | tee /tmp/platzierungen.log | tail -20

      # Auch die Platzierungen gleich ans Release (siehe "Spieltage ans Release"): sie standen bis zum 19.10.2026 auf dem Stand vom 11.10., weil sie erst am Ende
      # des Laufs - nach den Replays - drankamen, und das Ende kam nie.
      - name: Platzierungen ans Release
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ablage-github.mjs --nur platzierungen --hoechstens 80 --minuten 6 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -8

      # Einmal am Tag die aktuellen Epic-Namen aller Pros (Betreiber, 29.10.2026: "jeden Tag einmal Username updaten") - fuer die Spielersuche.
      # Hochgeladen wird epic-namen.json mit dem Zwischenstand ans Release.
      # Die Anmelde-Rueckwege pruefen (Betreiber, 29.10.2026: "die Callbacks immer wieder testen") - bei Fehlern nach #admin-alarm.
      - name: Anmeldung pruefen
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/anmeldung-pruefen.mjs --discord 2>&1 | tail -14

      - name: Pro-Namen erneuern
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/pro-namen-erneuern.mjs 2>&1 | tail -3

      # Die Server-Replays der Finals und LANs voll auszulesen (Zonen, Kill-Feed
      # mit Ort, Spieler) macht seit dem 14.10.2026 ein eigener Ablauf alle
      # zehn Minuten: .github/workflows/replays-voll.yml. Hier gab es nur
      # 24 Matches je Stunde, eines nach dem anderen.

      # Die Solo Clutch Points rechnet seit dem 29.9.2026 ein eigener Ablauf
      # fuer jeden Team-Spieltag (.github/workflows/clutch-rechnen.yml).

      # Im Admin-Archiv hochgeladene Videos vom Objektspeicher ans Release
      # "archiv-videos" legen (scripts/archiv-videos-umziehen.mjs).
      - name: Archiv-Videos umziehen
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/archiv-videos-umziehen.mjs 2>&1 | tail -12

      # LAN-Konten ("[FNCSGC26] BIG Vico") den echten Konten zuordnen - fuer
      # Flagge, X-Konto und Statistik (scripts/lan-konten-zuordnen.mjs).
      - name: LAN-Konten zuordnen
        continue-on-error: true
        run: node scripts/lan-konten-zuordnen.mjs 2>&1 | tail -8

      # Die Weltrangliste kommt seit dem 28.9.2026 ueber Epics Schnittstelle
      # (wie die Cup-Bestenlisten) statt aus einem Browser - Epics Webseite
      # lieferte den GitHub-Rechnern seit dem 23.9. keine Tabelle mehr.
      - name: Weltrangliste holen
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/power-rankings-holen.mjs 2>&1 | tail -8

      # Die Flagge, die jeder Spieler in Fortnite gewaehlt hat (Epics playerFlagTokens), aus der Weltrangliste und den Bestenlisten der juengsten
      # Spieltage - power-rankings/spiel-flaggen.json, Quelle "spiel" fuer Posts, Profile und Statistik (16.11.2026). Geht mit der Weltrangliste ans Release.
      - name: Spiel-Flaggen sammeln
        continue-on-error: true
        timeout-minutes: 7
        run: node scripts/spiel-flaggen.mjs --minuten 4 2>&1 | tail -15

      # Die Weltrangliste sofort ans Release: die Seite zeigte am 19.10.2026 den Stand vom 11.10. ("seit neun Tagen nicht aktualisiert"), weil sie erst am Ende des Laufs
      # hochkam. Eine einzige Datei - dieser Schritt dauert Sekunden.
      - name: Weltrangliste ans Release
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ablage-github.mjs --nur power-rankings 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -6

      # Dasselbe wie im Live-Ablauf: ohne diese Adresse sucht das Skript das
      # Werkzeug auf localhost, findet dort nichts und holt nichts. Der Bau
      # der Anwendung kommt in diesem Ablauf erst spaeter, ein eigener Server
      # steht hier also ohnehin nicht zur Verfuegung.
      # Mit Zeitgrenze: dieser Schritt lief zuletzt in jeder Stunde bis in
      # die Grenze des ganzen Auftrags (neunundsechzig Minuten), und alles
      # danach - Bauen, Vorrechnen, Hochladen - kam nie an die Reihe. Was
      # in dreissig Minuten nicht geholt ist, holt der naechste Lauf; der
      # Stand je Fenster wird alle zweihundert Matches gesichert.
      # Seit dem 29.10.2026 aus: frische Spieltage gehoeren der Schnellspur
      # (.github/workflows/replays-schnell.yml - mehrere Rechner je Spieltag,
      # ein Cup binnen einer halben Stunde), aeltere der Nacharbeit. Hier
      # hingen sie an diesem Lauf, der stundenlang stehen kann, und sein
      # Zwischenspeicher haette frische Staende mit alten ueberschrieben.
      - name: Replays holen
        if: ${{ false }}
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        continue-on-error: true
        timeout-minutes: 14
        # Seit dem 25.9.2026 nur noch das Frische der letzten zwoelf Stunden,
        # und nur zwoelf Minuten lang. Den Rueckstand aelterer Spieltage
        # arbeitet .github/workflows/replays-nacharbeiten.yml auf vier
        # Rechnern ab - hier kostete er neun Minuten je Stunde und schaffte
        # kaum etwas, waehrend der Lauf danach beim Bau abgeschossen wurde.
        # Die Grenze von zwoelf Stunden ist dieselbe wie dort (--ohne-frische
        # 12): so fassen nie zwei Rechner denselben Spieltag an. Neue
        # Spieltage legt nur dieser Gang an.
        #
        # (Frueher:) Zweiundsiebzig Stunden statt zwei: was der Live-Sammler waehrend
        # eines Cups verpasst hat, wird so binnen drei Tagen nachgeholt -
        # Epic haelt die Replays einunddreissig Tage vor. Schon Ausgewertetes
        # kostet dabei nichts, der Stand je Fenster kennt es.
        #
        # Zwei Gaenge in derselben halben Stunde: erst zwanzig Minuten das
        # Frische, dann neun Minuten das Liegengebliebene aelterer Fenster
        # (--wiederholen). Vorher lief nur der frische Gang, und ein grosser
        # Skin-Cup, der aelter als drei Tage war, blieb mit tausenden offenen
        # Matches fuer immer "still open" - der Betreiber: "5184 still open,
        # wie lange geht das noch?" Beide enden sanft an ihrer Frist (SIGTERM),
        # der Stand je Fenster ist alle zweihundert Matches gesichert.
        run: |
          timeout --signal=TERM 12m node scripts/replays-holen.mjs --frisch 12 2>&1 | tee /tmp/replays.log | grep -v ' \.\.\.$' | tail -25
          true

      - name: Replays auswerten
        if: ${{ false }}
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/replays-aggregieren.mjs 2>&1 | tee /tmp/aggregieren.log | tail -20

      # Die schlanke Fassung fuer die Seite (lib/replaySchlank): die volle
      # Auswertung eines offenen Cups ist bis zu 54 MB und riss auf Render
      # (512 MB) den Server um.
      - name: Replays schlank ablegen
        if: ${{ false }}
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/replays-schlank.mjs 2>&1 | tail -3

      # Die Uebersicht fuer /admin/replays gleich hier, nicht erst beim
      # Vorrechnen: scheitert das, stand die Seite tagelang auf "24.000 offen"
      # (scripts/replay-uebersicht.mjs). "Zwischenstand ans GitHub-Release"
      # nimmt die Datei mit.
      # Seit dem 29.10.2026 aus: die Uebersicht entsteht im Ablauf "Replays
      # schlank" aus den Staenden am Release (--vom-release); aus dem
      # Zwischenspeicher dieses Laufs waere sie veraltet.
      - name: Replay-Uebersicht ablegen
        if: ${{ false }}
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/replay-uebersicht.mjs 2>&1 | tail -3

      # Die Trios der Tierlist aus den Trio-Spieltagen (scripts/tierlist-trios.mjs):
      # je Spieler sein juengstes Trio, Flaggen ueber die Konto-Id. Seit dem
      # 29.9.2026 - Trios sind fuer 2027 der Hauptmodus.
      - name: Trios fuer die Tierlist
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/tierlist-trios.mjs 2>&1 | tail -4

      # Waffen und Gegenstaende fuer das Replay-HUD aus dem Fortnite-Wiki (scripts/waffen-bilder.mjs): alle sechs Stunden, so kommen neue Waffen nach einem
      # Update von selbst dazu (Betreiber, 7.11.2026).
      - name: Waffenbilder
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ]; then node scripts/waffen-bilder.mjs 2>&1 | tail -3; else echo "nicht in dieser Stunde"; fi

      # "Zwischenstand ans GitHub-Release" stand bis zum 16.11.2026 hier, vor dem Bau (seit dem 24.9.: der Laufrechner wurde beim Bauen
      # abgeschaltet, und alles danach fiel weg). Der Bau dauert inzwischen eine Minute; das Hochladen laeuft jetzt nach ihm im Hintergrund,
      # neben dem Vorrechnen - siehe dort.
      # Einmalig (28.9.2026, 20:24 UTC): ein versehentlich gestarteter
      # Hochladelauf vom Entwicklerrechner ersetzte am Release 17 Dateien durch
      # aeltere Staende (Antworten, Elims-Archiv, Preisgeld-Tabellen,
      # Epic-Namen, Clutch, Platzierungen). Die Manifeste blieben unberuehrt,
      # der normale Upload haelt sie daher fuer aktuell. Der Datenstand des
      # Laufs ist der richtige; er geht hier erzwungen hinauf. Die Marke im
      # Datenordner (wird mit ihm zwischengespeichert, nie hochgeladen)
      # verhindert eine Wiederholung.
      - name: Release-Reparatur vom 28.9.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/.reparatur-2809 ]; then
            node scripts/ablage-github.mjs --erzwingen --nur 'antworten/szene_ansicht=start_saison=S42.json' --nur 'antworten/szene_ansicht=turniere_region=EU.json' --nur 'antworten/szene_gesamt.json' --nur 'antworten/szene_heimat.json' --nur 'antworten/szene_saison=S42_spieler=072e8b9f8188405ab0eb52544e1dc906.json' --nur 'antworten/szene_saison=S42_spieler=39a4c6ccd9bf46a2bc6f9a3106de22f4.json' --nur 'antworten/szene_saison=S42_spieler=b39cded93b0f4aa59ffdadf0db18e853.json' --nur 'antworten/szene_saison=S42_spieler=e7987ee7c7fa43dd814252eedc06af2f.json' --nur 'antworten/szene_tagesbeste.json' --nur 'clutch/MannekenPis_Day1.json' --nur 'clutch/MannekenPis_Day2.json' --nur 'elims-archiv.json' --nur 'epic-namen.json' --nur 'preisgeld-tabellen.json' --nur 'platzierungen/S40/S40_FNCSMajor1_Final_Day1_ASIA.json' --nur 'platzierungen/_fehlend.json' --nur 'power-rankings/global.json' 2>&1 | tail -8 && touch data/.reparatur-2809
          else
            echo "schon repariert"
          fi

      # ------------------------------------------------- Antworten vorrechnen
      #
      # Die Startseite und die Statistikseite rechnen ueber neunhundert
      # Spieltage. Hier liegen die Dateien auf der Platte des Laufrechners -
      # das dauert Sekunden. Bei Vercel kaemen dieselben Dateien ueber das
      # Netz, und dort waren es erst eine Minute dreiundfuenfzig, nach dem
      # Umbau auf die Tabelle immer noch drei Minuten.
      #
      # Also wird hier gerechnet und nur das Ergebnis hochgeladen. Vercel
      # liest danach eine einzige Zeile: gemessen 0,8 Sekunden statt 113.
      # Der Bau und das Vorrechnen schreiben ein Protokoll nach
      # data/antworten/_lauf.json, das mit hochgeladen wird. Grund: seit dem
      # 8. September legte dieser Lauf keine Antworten mehr ab - der Bau
      # dauerte zwoelf Sekunden, das Vorrechnen genau die sechzig Sekunden
      # der Warteschleife - und "continue-on-error" verschluckte den Fehler.
      # Ohne Zugang zu den Protokollen von GitHub war nicht zu sehen, warum.
      # Jetzt steht es dort, wo das Werkzeug es lesen kann.
      - name: Anwendung bauen
        id: bau
        continue-on-error: true
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set +e
          # Uebrig gebliebene Replay-Auswerter beenden, bevor gebaut wird.
          # "timeout" im Schritt "Replays holen" beendet nur das Skript, die
          # gestarteten FortniteReplayAnalysis-Prozesse liefen weiter und
          # teilten sich den Speicher mit dem Bau - bis der Laufrechner
          # abgeschaltet wurde (siehe "Zwischenstand ans GitHub-Release").
          pkill -f FortniteReplayAnalysis || true
          pkill -f replays-holen || true
          free -m | head -2
          df -h / | tail -1
          # Der Datenordner geht waehrend des Baus beiseite - wie bei Vercel,
          # wo er gar nicht existiert. Hier lagen daneben ueber 155000
          # Dateien, und der Bau wurde seit dem 24.9.2026 jedes Mal nach
          # knapp vier Minuten abgeschossen ("The runner has received a
          # shutdown signal"), obwohl vorher 15 GB Speicher frei waren.
          mv data /tmp/daten-beiseite
          # Speicher und Platte im Blick, falls es doch wieder abbricht.
          ( while sleep 30; do echo "  [Wache] $(free -m | awk 'NR==2{print $7}') MB frei, Platte $(df -h / | awk 'NR==2{print $4}') frei"; done ) &
          WACHE=$!
          npm run build > /tmp/bau.log 2>&1
          CODE=$?
          kill $WACHE 2>/dev/null
          # Der Bau legt beim Laden von lib/datenOrt.ts selbst einen leeren
          # Ordner "data" an. Ein blosses "mv" schob den echten Ordner dann
          # HINEIN (data/daten-beiseite) - der Server sah beim Vorrechnen
          # nichts, und die Statistik stand am 25.9.2026 mit 0 Spielern da.
          # Den leeren Ordner des Baus also erst weg.
          if [ -d data ]; then mv data /tmp/bau-daten-leer; fi
          mv /tmp/daten-beiseite data
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 40 /tmp/bau.log
          exit $CODE

      # Das Gerechnete und Geholte ans Release, waehrend vorgerechnet wird (16.11.2026; vorher als eigener Schritt vor dem Bau, 4,3 Minuten
      # je Lauf allein). Erst nach dem Bau: der schiebt den Datenordner beiseite, ein Hochladen dabei saehe Dateien verschwinden. Neben dem
      # Vorrechnen ist es sicher - die Ablage schreibt jede Antwort erst daneben (".<pid>.neu", das Hochladen laesst die aus) und benennt
      # sie dann um, gelesen wird also nur Ganzes. Begrenzung wie bisher (100 Dateien, 14 Minuten, das Wichtigste zuerst; siehe
      # scripts/ablage-github.mjs). "Hochladen abwarten" vor "Akten ans Release" wartet darauf - zwei Hochlader an einem Manifest
      # verloeren sich gegenseitig Eintraege.
      - name: Zwischenstand ans GitHub-Release (Hintergrund)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ( node scripts/ablage-github.mjs --hoechstens 100 --minuten 14 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' > /tmp/zwischenstand.log; touch /tmp/zwischenstand.fertig ) < /dev/null > /dev/null 2>&1 &
          echo "gestartet"

      - name: Antworten vorrechnen
        continue-on-error: true
        timeout-minutes: 32
        env:
          BAU_CODE: ${{ steps.bau.outputs.code }}
          # Zu alte Antworten sofort neu rechnen statt im Hintergrund - der
          # Server wird nach jeder Portion beendet (lib/antwortSpeicher.ts).
          COMPHUB_VORRECHNEN: '1'
          # Mehr Speicher fuer den Server: am 25.9.2026 starb er mitten im
          # Vorrechnen (178 fertig, 394 "fetch failed"), und die Antwort fuer
          # die laufende Season blieb beim Stand vom 21.9. stehen - in der
          # Statistik fehlten deshalb Platz und Punkte der Week-4-Finals.
          # 12 Gigabyte Heap auf einem Laufrechner mit 16 Gigabyte: ab dem
          # 11.10.2026 starb der ganze Rechner mitten in Teil 1 ("The runner
          # has received a shutdown signal", fuenfmal hintereinander, jedes
          # Mal sechs bis sieben Minuten nach Beginn des Schritts) - und mit
          # ihm der Lauf, ohne dass eine einzige Antwort erneuert wurde.
          # Mit zehn Gigabyte bricht stattdessen nur der Server ab (der Teil
          # kommt ein zweites Mal dran), der Rechner bleibt am Leben.
          # 13.10.2026: trotzdem starb der Rechner in rund jedem siebten Lauf
          # (zwei Mails von GitHub je Absturz, "Run failed: Daten erneuern").
          # Der Server sass dann bei 7 bis 9 GB mit 8 bis 11 GB Auslagerung.
          # Jetzt: sieben Gigabyte Heap und acht statt vier Portionen - der
          # Server bleibt kleiner, und bricht er doch ab, kommt nur seine Portion
          # (ein Achtel) ein zweites Mal dran.
          NODE_OPTIONS: --max-old-space-size=7168
        run: |
          set +e
          # Bis hierhin darf gerechnet werden (16.11.2026: 20 statt 100 Minuten; gemessen 45 und 49 Minuten je Lauf mit 23). Der Schritt fuellte seine 100 Minuten in jedem Lauf -
          # Teil 1 dreimal je 40 Minuten an der Startansicht von S42, die Akten mit dem Rest -, und ein Lauf dauerte 133 Minuten statt
          # einer Stunde; die Laeufe stauten sich. Seit die schlanken Replays und die Saison-Sammlung nicht mehr jede Stunde voll gelesen
          # werden, reicht die Zeit fuer die Listen; die Akten bekommen den Rest, mindestens vier Minuten, und drehen sich ueber die Laeufe.
          ENDE=$(( $(date +%s) + 20 * 60 ))
          # Auslagerungsdatei: faengt Spitzen ab, statt dass der Laufrechner
          # bei vollem Speicher stehen bleibt. Auf /mnt liegt die grosse,
          # fluechtige Platte des Laufrechners.
          sudo fallocate -l 8G /mnt/auslagerung 2>/dev/null && sudo chmod 600 /mnt/auslagerung \
            && sudo mkswap /mnt/auslagerung >/dev/null && sudo swapon /mnt/auslagerung \
            && echo "Auslagerung an: $(free -m | awk '/Swap/{print $2}') MB" || echo "Auslagerung nicht moeglich"
          # Speicher im Blick - damit im Protokoll steht, wo es eng wird.
          ( while sleep 20; do echo "  [Wache] $(date +%T) belegt $(free -m | awk 'NR==2{print $3}') MB, Auslagerung $(free -m | awk 'NR==3{print $3}') MB, Groesster: $(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -1 | awk '{printf "%s %d MB", $2, $1/1024}')"; done ) &
          WACHE=$!
          # Den Server wirklich beenden. "kill $SERVER" traf nur den
          # npx-Mantel; der eigentliche next-server lief weiter und hielt den
          # Port. Am 29.9.2026 starb deshalb jeder Neustart mit EADDRINUSE,
          # alle Teile liefen gegen denselben, immer volleren Server, der
          # schliesslich im Speicher erstickte - der Schritt lief in seine
          # Frist, und alles dahinter (das Preisgeld der Globals) fiel aus.
          stoppen() {
            kill $SERVER 2>/dev/null; wait $SERVER 2>/dev/null
            pkill -f "next-server" 2>/dev/null; pkill -f "next start" 2>/dev/null
            for _ in $(seq 1 20); do
              curl -s -o /dev/null http://localhost:3000/ || break
              sleep 1
            done
            pkill -9 -f "next-server" 2>/dev/null || true
          }
          starten() {
            npx next start -p 3000 >> /tmp/server.log 2>&1 &
            SERVER=$!
            BEREIT=nein
            # Warten, bis er antwortet - hoechstens eine Minute.
            for _ in $(seq 1 30); do
              curl -sf http://localhost:3000/api/stand >/dev/null && { BEREIT=ja; break; }
              sleep 2
            done
          }
          # In vier Portionen, der Server frisch fuer jede: er waechst mit jeder
          # Antwort und lief am 26.9.2026 nach rund 390 Abfragen bei zehn
          # Gigabyte voll (JavaScript heap out of memory). Stirbt er trotzdem
          # in einer Portion, kommt sie ein zweites Mal dran.
          : > /tmp/vorrechnen.log
          # Zuerst, was nur einmal laufen muss und sonst hinter einer
          # abgelaufenen Frist verloren geht: das Preisgeld der Globals in die
          # Earnings (scripts/globals-preisgeld-eintragen.mjs, laeuft nur
          # einmal) und Epics Auszahlungstabellen der laufenden Season
          # (scripts/preisgeld-aus-katalog.mjs), bevor ein Fenster aus dem
          # Katalog faellt.
          starten
          node scripts/globals-preisgeld-eintragen.mjs http://localhost:3000 2>&1 | tail -3
          node scripts/preisgeld-aus-katalog.mjs http://localhost:3000 2>&1 | tail -2
          # Ebenso Epics Punktetabellen je Spieltag (scripts/wertung-aus-katalog.mjs) - sonst fehlt vergangenen Cups das Punktesystem unter About.
          node scripts/wertung-aus-katalog.mjs http://localhost:3000 2>&1 | tail -2
          stoppen
          # 15.11.2026: die Listen zuerst, alle acht Portionen; die Akten danach, jede Schale auf eigenem frischen Server und
          # mit der Zeit, die bleibt (scripts/antworten-vorrechnen.mjs, hole()). Vorher lief die Akte als erste Abfrage jeder
          # Portion, fetch brach sie nach 300 s ab, der Server rechnete sie neben den Saisonlisten weiter und starb in Teil 1
          # jedes Laufs (15 GB, 7 GB Auslagerung) - 72 von 77 Abfragen "fetch failed", die Liste von S43 blieb beim 6.11.
          # Die Frist des Schritts (110 min) wird hier eingeteilt, damit nichts mehr in sie hineinlaeuft.
          rest() { echo $(( ENDE - $(date +%s) )); }
          # Ein Aufruf mit frischem Server. $1 = Beschriftung, Rest = Angaben fuer das Skript. Setzt LEBT.
          portion() {
            local NAME=$1; shift
            local FRIST=$1; shift
            starten
            timeout $((FRIST + 30)) node scripts/antworten-vorrechnen.mjs http://localhost:3000 "$@" --frist=$FRIST 2>&1 | tee /tmp/teil.log | sed -u 's/^/  ['"$NAME"'] /'
            local CODE=${PIPESTATUS[0]}
            ENDE_CODE=$CODE
            LEBT=ja
            { [ "$CODE" = 3 ] || [ "$CODE" = 4 ] || [ "$CODE" = 124 ] || ! curl -sf -m 10 -o /dev/null http://localhost:3000/api/stand; } && LEBT=nein
            stoppen
            cat /tmp/teil.log >> /tmp/vorrechnen.log
            echo "$NAME, Versuch $VERSUCH (Frist ${FRIST}s, Ende $CODE): $(grep -E 'Vorgerechnet' /tmp/teil.log | tr -s ' ')"
            if [ "$LEBT" = nein ]; then echo "::warning::Server in $NAME abgestuerzt oder Frist erreicht:"; tail -n 8 /tmp/server.log; fi
          }
          # Teil 1 zuerst (Startansichten, Jahre), dann 2 bis 8 nach der Stunde gedreht: reicht die Zeit einmal nicht, trifft es jede Stunde
          # einen anderen Teil. Fuer jeden spaeteren Teil bleibt eine Minute (der Server braucht zum Warmwerden 30 bis 60 s), fuer die Akten
          # vier; ein Teil hoechstens zehn Minuten (Lauf 43899822030: Teil 1 hing 15 Minuten am ersten Aufbau der S42-Auszuege). Ein zweiter Versuch nur, wenn der
          # Server abstuerzte - nicht nach abgelaufener Frist; er faengt nicht von vorn an, was gerechnet ist, liegt in der Ablage
          # (16.11.2026 gemessen: Teile 3 bis 8 je unter einer Minute, Teil 2 um vier, Teil 1 um zehn).
          DREH=$(( 10#$(date -u +%H) % 7 ))
          REIHE="1"; for I in 0 1 2 3 4 5 6; do REIHE="$REIHE $(( (DREH + I) % 7 + 2 ))"; done
          N=0
          for TEIL in $REIHE; do
            N=$((N + 1))
            for VERSUCH in 1 2; do
              FRIST=$(( $(rest) - 240 - 60 * (8 - N) )); [ $FRIST -gt 600 ] && FRIST=600
              [ $FRIST -lt 45 ] && { echo "::warning::Keine Zeit mehr fuer Teil $TEIL"; break; }
              portion "teil $TEIL" $FRIST --teil=$TEIL/8
              [ "$LEBT" = ja ] && break
              [ "$ENDE_CODE" = 4 ] && break
            done
          done
          # Die Akten: je Schale ein frischer Server. Reicht die Zeit nicht fuer alle acht, faengt der naechste Lauf mit der
          # Schale an, die diesmal zu kurz kam (nach der Stunde gedreht).
          # 16.11.2026: jede Schale las alle Replay-Aggregate und Clutch-Dateien neu (gemessen 1236 s je Schale, auf dem
          # Laufrechner ueber 1500 s - abgebrochen, die Akten am Release blieben beim 7.11.). Jetzt legt aktenSchreiben je
          # Spieltag einen Auszug unter data/_akten-vorstufe ab (lib/szeneStats.ts, aktenVorstufe), und der Zwischenspeicher
          # nimmt ihn mit (440 MB): mit Auszug rund 70 s je Schale. Ohne (erster Lauf, leerer Zwischenspeicher) zahlt die erste Schale
          # einmal das Lesen; bricht sie ab, ist das Gelesene trotzdem abgelegt und die naechste macht dort weiter.
          ERSTE=$(( 10#$(date -u +%H) % 8 ))
          for I in 0 1 2 3 4 5 6 7; do
            SCHALE=$(( (ERSTE + I) % 8 + 1 ))
            VERSUCH=1
            FRIST=$(( $(rest) - 30 )); [ $FRIST -gt 900 ] && FRIST=900
            [ $FRIST -lt 120 ] && { echo "Keine Zeit mehr fuer Akten-Schale $SCHALE und folgende - sie kommen in den naechsten Laeufen dran"; break; }
            portion "akten $SCHALE" $FRIST --akten=$SCHALE/8
          done
          starten
          # Die Zahlen des Tages nach #admin-zahlen - eine Nachricht je Tag,
          # die jeder Lauf fortschreibt (scripts/admin-zahlen-discord.mjs).
          node scripts/admin-zahlen-discord.mjs http://localhost:3000 2>&1 | tail -2
          # Die ersten zehn jedes Finales nach #results (scripts/ergebnisse-discord.mjs).
          node scripts/ergebnisse-discord.mjs http://localhost:3000 2>&1 | tail -3
          stoppen
          kill $WACHE 2>/dev/null
          mkdir -p data/antworten
          BEREIT=$BEREIT node scripts/lauf-protokoll.mjs

      # Die beiden Hintergrund-Schritte (alte Spieltage suchen, Zwischenstand ans Release) muessen fertig sein, bevor weiter hochgeladen wird.
      - name: Hochladen abwarten
        if: always()
        continue-on-error: true
        timeout-minutes: 16
        run: |
          for _ in $(seq 1 900); do
            { [ -f /tmp/suchen.fertig ] || [ ! -f /tmp/suchen.log ]; } && { [ -f /tmp/zwischenstand.fertig ] || [ ! -f /tmp/zwischenstand.log ]; } && break
            sleep 1
          done
          echo "--- Alte Spieltage suchen"; tail -4 /tmp/suchen.log 2>/dev/null || echo "kein Protokoll"
          echo "--- Zwischenstand"; tail -30 /tmp/zwischenstand.log 2>/dev/null || echo "kein Protokoll"

      # Die Akten (je Spieler Turniere und Earnings, gebuendelt) gleich nach dem Vorrechnen ans Release (28.10.2026): bis dahin gingen sie erst mit dem
      # Zwischenstand des naechsten Laufs hoch - der ist auf 100 Dateien begrenzt und wurde oft abgebrochen; seit dem 11.10. kam keine Akte mehr an, die
      # Profile zeigten keine Earnings nach Ende September (Betreiber: "die neuesten Earnings sind vom 27.09.").
      - name: Akten ans Release
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ablage-github.mjs --nur akten --minuten 4 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -8

      - name: Ergebnis nach Supabase
        # "--neuer-als 120" nimmt nur, was dieser Lauf geschrieben hat. Die
        # Zeitspanne ist grosszuegiger als die Laufzeit, damit auch ein langer
        # Lauf nichts verliert.
        #
        # Die rohen Replays bleiben draussen: das sind Gigabytes, sie leben bei
        # Epic nur einunddreissig Tage, und gebraucht wird von ihnen ohnehin
        # nur das ausgewertete Ergebnis.
        #
        # Mit Frist: ist Supabase weg, bricht das Skript nach fuenf Fehlern
        # ab - und spaetestens hier ist Schluss, damit der Lauf nicht in
        # seine 90 Minuten laeuft und das Release leer ausgeht.
        #
        # Die Akten bleiben draussen: achttausend Dateien, ein Viertel
        # Gigabyte, jede Stunde neu geschrieben - sie liegen am Release, und
        # die Seite liest sie dort zuerst. In der Datenbank waren sie die
        # groesste Last am kostenlosen Kontingent (500 MB).
        #
        # Seit dem 22.9.2026 nur noch das Noetigste (NOETIGES in
        # scripts/daten-sync.mjs): was dieser Lauf davon anfasst - Namen,
        # Fotos-Zuordnung, Cup-Archiv. Antworten, Akten, Spieltage, Replays
        # gehen ausschliesslich ans Release. Supabase hatte das Projekt wegen
        # aufgebrauchten Datenverkehrs gesperrt; der Betreiber: "dort soll
        # immer nur das Noetigste ab jetzt sein."
        continue-on-error: true
        timeout-minutes: 6
        run: |
          node scripts/daten-sync.mjs --neuer-als 120 --noetiges \
            --ohne kartenbilder,kontakt-bilder,admin-maps,galerie,eigene-matches,antworten

      # Die zweite Ablage: dieselben Dateien als Anhaenge am Release "daten"
      # des Projekts (siehe lib/ablageGithub.ts). Von dort liest die Seite die
      # Antworten und Akten zuerst und alles andere, sobald Supabase nicht
      # antwortet. Am 16.9.2026 war die Datenbank dort dreimal am Tag weg, und
      # dieser Schritt hier war der einzige Weg, die Zahlen trotzdem zu zeigen.
      # Das Manifest am Release sagt, was sich geaendert hat; ein Lauf laedt
      # nur das hoch.
      #
      # Mit sichtbarem Fortschritt statt "tail": bis zum 22.9.2026 lief der
      # Schritt vierzig Minuten in die Zeitgrenze, und im Protokoll stand
      # nichts - weil tail erst am Ende druckt. Das Skript drosselt sich
      # jetzt selbst unter GitHubs Grenze und schreibt das Manifest
      # zwischendurch; ein Abbruch verliert nichts mehr.
      - name: Ergebnis ans GitHub-Release
        if: always()
        continue-on-error: true
        timeout-minutes: 11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ablage-github.mjs --hoechstens 100 --minuten 8 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -60

      - name: Datenordner sichern
        # Auch nach einem Fehlschlag - siehe oben.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}

      # Nur bei einem Problem eine Nachricht in #admin-alarm (siehe
      # scripts/lauf-bericht-discord.mjs) - vierzig abgebrochene Laeufe und
      # eine dreizehn Tage alte Weltrangliste hatte vorher niemand gesehen.
      - name: Bericht an den Admin-Kanal
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          LAUF_STATUS: ${{ job.status }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/lauf-bericht-discord.mjs 2>&1 | tail -3

      # Zum Schluss, nicht vorher: das Hochladen liest die Zugangsdaten aus
      # .env.local. Standen sie hier oben, scheiterte jeder Lauf am
      # Hochladen - und die Erneuerung erneuerte wieder einmal nichts.
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local

