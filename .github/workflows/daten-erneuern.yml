# Die Daten von selbst erneuern - und zwar dort, wo die Seite sie liest.
#
# Der Nutzer wollte keinen Knopf zum Aktualisieren, sondern dass sich alles
# planmaessig selbst holt. Dieser Ablauf tut das seit jeher; nur landete das
# Ergebnis bisher im Repository - und weil `data/` in der .gitignore steht,
# fand `git add data/` nie etwas. Jeder Lauf endete still bei "nichts Neues",
# und im Repository gibt es bis heute keinen einzigen Commit "Daten erneuert".
# Die Erneuerung lief also, ohne je etwas zu erneuern.
#
# Seit dem Umzug gibt es ohnehin einen besseren Ort: Supabase. Von dort liest
# die Seite, egal ob sie auf seinem Rechner oder bei Vercel laeuft. Also legt
# der Ablauf sein Ergebnis jetzt dorthin.
#
# Warum ueberhaupt hier und nicht im Webserver: bisher liefen die Nachtlaeufe
# in instrumentation.node.ts, also in einem Vorgang, der durchlaufen muss. Bei
# Vercel gibt es den nicht - dort startet je Anfrage etwas und schlaeft danach
# wieder ein. GitHub Actions ist der passende Ort, und fuer oeffentliche Repos
# kostenlos und ohne Minutengrenze.
#
# Der Weg je Lauf:
#
#   1. Den Datenordner aus dem Zwischenspeicher holen. Die Skripte arbeiten
#      alle nachtragend - sie holen nur, was ihnen fehlt -, und dafuer muessen
#      sie wissen, was schon da ist. Beim ersten Mal oder wenn der
#      Zwischenspeicher abgelaufen ist, kommt der Stand aus Supabase.
#   2. Die Skripte laufen lassen, unveraendert, so wie auf seinem Rechner.
#   3. Nur die Dateien nach Supabase schreiben, die dieser Lauf angefasst hat -
#      geprueft, Zeichen fuer Zeichen. Alles hochzuladen waere nicht nur
#      langsam, es wuerde das kostenlose Kontingent in Tagen aufbrauchen.

name: Daten erneuern

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'   # jede Stunde, funfzehn nach

jobs:
  erneuern:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Zwei Laeufe gleichzeitig wuerden einander dieselben Zeilen
    # ueberschreiben - und der zweite haette den aelteren Stand.
    concurrency:
      group: daten-erneuern
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Zugangsdaten
        # Ein einziges Geheimnis mit dem Inhalt von .env.local - so kann beim
        # Einrichten kein einzelner Schluessel vergessen werden. Ausgegeben
        # wird davon nichts.
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      # Holen und Sichern getrennt, nicht als ein Schritt.
      #
      # actions/cache sichert erst am Ende des Auftrags - und nur, wenn der
      # Auftrag durchgelaufen ist. Genau daran hing der Ablauf fest: der
      # Schritt "Stand aus Supabase holen" laeuft nur bei leerem
      # Zwischenspeicher, er scheiterte, der Auftrag scheiterte, also wurde
      # nie ein Zwischenspeicher geschrieben - und beim naechsten Lauf war
      # er wieder leer. Stunde um Stunde dieselbe Fehlermail.
      #
      # Mit "save" und "if: always()" wird gesichert, was dieser Lauf
      # zusammengetragen hat, auch wenn spaeter etwas schiefgeht. Der
      # naechste Lauf faengt dann nicht wieder bei null an.
      - name: Datenordner aus dem Zwischenspeicher
        id: zwischenspeicher
        uses: actions/cache/restore@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}
          restore-keys: comphub-daten-

      - name: Stand aus Supabase holen
        # Nur wenn der Zwischenspeicher nichts hergab. GitHub wirft ihn nach
        # sieben Tagen ohne Zugriff weg; dann faengt der Lauf sonst bei null an
        # und wuerde alles neu von Epic holen.
        if: steps.zwischenspeicher.outputs.cache-matched-key == ''
        run: |
          node scripts/umzug-supabase.mjs --herunterladen \
            --ohne replays,_sicherung

      - name: Spieltage holen
        continue-on-error: true
        run: node scripts/epic-spieltage-holen.mjs

      - name: Platzierungen holen
        continue-on-error: true
        run: node scripts/platzierungen-holen.mjs

      - name: Werte der Szene holen
        continue-on-error: true
        run: node scripts/szene-stats-holen.mjs

      - name: Weltrangliste holen
        continue-on-error: true
        run: node scripts/power-rankings-holen.mjs

      # Dasselbe wie im Live-Ablauf: ohne diese Adresse sucht das Skript das
      # Werkzeug auf localhost, findet dort nichts und holt nichts. Der Bau
      # der Anwendung kommt in diesem Ablauf erst spaeter, ein eigener Server
      # steht hier also ohnehin nicht zur Verfuegung.
      - name: Replays holen
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        continue-on-error: true
        run: node scripts/replays-holen.mjs --frisch 2

      - name: Replays auswerten
        continue-on-error: true
        run: node scripts/replays-aggregieren.mjs

      # ------------------------------------------------- Antworten vorrechnen
      #
      # Die Startseite und die Statistikseite rechnen ueber neunhundert
      # Spieltage. Hier liegen die Dateien auf der Platte des Laufrechners -
      # das dauert Sekunden. Bei Vercel kaemen dieselben Dateien ueber das
      # Netz, und dort waren es erst eine Minute dreiundfuenfzig, nach dem
      # Umbau auf die Tabelle immer noch drei Minuten.
      #
      # Also wird hier gerechnet und nur das Ergebnis hochgeladen. Vercel
      # liest danach eine einzige Zeile: gemessen 0,8 Sekunden statt 113.
      - name: Anwendung bauen
        continue-on-error: true
        run: npm run build

      - name: Antworten vorrechnen
        continue-on-error: true
        run: |
          npx next start -p 3000 &
          SERVER=$!
          # Warten, bis er antwortet - hoechstens eine Minute.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/stand >/dev/null && break
            sleep 2
          done
          node scripts/antworten-vorrechnen.mjs http://localhost:3000
          kill $SERVER || true

      - name: Ergebnis nach Supabase
        # "--neuer-als 120" nimmt nur, was dieser Lauf geschrieben hat. Die
        # Zeitspanne ist grosszuegiger als die Laufzeit, damit auch ein langer
        # Lauf nichts verliert.
        #
        # Die rohen Replays bleiben draussen: das sind Gigabytes, sie leben bei
        # Epic nur einunddreissig Tage, und gebraucht wird von ihnen ohnehin
        # nur das ausgewertete Ergebnis.
        run: |
          node scripts/umzug-supabase.mjs --neuer-als 120 \
            --ohne replays,_sicherung

      - name: Ausgewertete Replays nach Supabase
        # Die Aggregate liegen unter replays/, sind aber das Einzige daraus,
        # was die Seite braucht - deshalb hier eigens und ohne die rohen.
        continue-on-error: true
        run: |
          node scripts/umzug-supabase.mjs --neuer-als 120 --nur replays \
            2>&1 | tail -20

      - name: Datenordner sichern
        # Auch nach einem Fehlschlag - siehe oben.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}

      # Zum Schluss, nicht vorher: das Hochladen liest die Zugangsdaten aus
      # .env.local. Standen sie hier oben, scheiterte jeder Lauf am
      # Hochladen - und die Erneuerung erneuerte wieder einmal nichts.
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
