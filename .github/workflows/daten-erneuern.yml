# Die Daten von selbst erneuern - und zwar dort, wo die Seite sie liest.
#
# Der Nutzer wollte keinen Knopf zum Aktualisieren, sondern dass sich alles
# planmaessig selbst holt. Dieser Ablauf tut das seit jeher; nur landete das
# Ergebnis bisher im Repository - und weil `data/` in der .gitignore steht,
# fand `git add data/` nie etwas. Jeder Lauf endete still bei "nichts Neues",
# und im Repository gibt es bis heute keinen einzigen Commit "Daten erneuert".
# Die Erneuerung lief also, ohne je etwas zu erneuern.
#
# Seit dem Umzug gibt es ohnehin einen besseren Ort: Supabase. Von dort liest
# die Seite, egal ob sie auf seinem Rechner oder bei Vercel laeuft. Also legt
# der Ablauf sein Ergebnis jetzt dorthin.
#
# Warum ueberhaupt hier und nicht im Webserver: bisher liefen die Nachtlaeufe
# in instrumentation.node.ts, also in einem Vorgang, der durchlaufen muss. Bei
# Vercel gibt es den nicht - dort startet je Anfrage etwas und schlaeft danach
# wieder ein. GitHub Actions ist der passende Ort, und fuer oeffentliche Repos
# kostenlos und ohne Minutengrenze.
#
# Der Weg je Lauf:
#
#   1. Den Datenordner aus dem Zwischenspeicher holen. Die Skripte arbeiten
#      alle nachtragend - sie holen nur, was ihnen fehlt -, und dafuer muessen
#      sie wissen, was schon da ist. Beim ersten Mal oder wenn der
#      Zwischenspeicher abgelaufen ist, kommt der Stand aus Supabase.
#   2. Die Skripte laufen lassen, unveraendert, so wie auf seinem Rechner.
#   3. Nur die Dateien nach Supabase schreiben, die dieser Lauf angefasst hat -
#      geprueft, Zeichen fuer Zeichen. Alles hochzuladen waere nicht nur
#      langsam, es wuerde das kostenlose Kontingent in Tagen aufbrauchen.

name: Daten erneuern

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'   # jede Stunde, funfzehn nach

jobs:
  erneuern:
    runs-on: ubuntu-latest
    # Schreiben ans Release (zweite Ablage) braucht contents: write.
    permissions:
      contents: write
    # Ein Lauf braucht gemessen gut neunzig Minuten (Replays holen 30,
    # Antworten vorrechnen 13, Supabase 12, Release 15). Mit einer Frist von
    # neunzig wurde am Ende jeder Lauf als "cancelled" abgebrochen - vierzig
    # Laeufe hintereinander ohne einen einzigen Erfolg, und der
    # Zwischenspeicher am Ende blieb jedes Mal ungesichert. Die Frist ist
    # jetzt weit genug; ueberlappen koennen sich Laeufe wegen der
    # Gruppe unten ohnehin nicht.
    timeout-minutes: 170

    # Zwei Laeufe gleichzeitig wuerden einander dieselben Zeilen
    # ueberschreiben - und der zweite haette den aelteren Stand.
    concurrency:
      group: daten-erneuern
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Mit den optionalen Paketen: darin steckt der native Uebersetzer von
      # Next (@next/swc-linux-x64-gnu). Ohne ihn scheiterte "Anwendung bauen"
      # nach zehn Sekunden, "continue-on-error" verschluckte es, und seit dem
      # 8. September kam aus diesem Ablauf keine einzige fertige Antwort mehr.
      - name: Abhängigkeiten
        run: npm ci

      - name: Zugangsdaten
        # Ein einziges Geheimnis mit dem Inhalt von .env.local - so kann beim
        # Einrichten kein einzelner Schluessel vergessen werden. Ausgegeben
        # wird davon nichts.
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      # Holen und Sichern getrennt, nicht als ein Schritt.
      #
      # actions/cache sichert erst am Ende des Auftrags - und nur, wenn der
      # Auftrag durchgelaufen ist. Genau daran hing der Ablauf fest: der
      # Schritt "Stand aus Supabase holen" laeuft nur bei leerem
      # Zwischenspeicher, er scheiterte, der Auftrag scheiterte, also wurde
      # nie ein Zwischenspeicher geschrieben - und beim naechsten Lauf war
      # er wieder leer. Stunde um Stunde dieselbe Fehlermail.
      #
      # Mit "save" und "if: always()" wird gesichert, was dieser Lauf
      # zusammengetragen hat, auch wenn spaeter etwas schiefgeht. Der
      # naechste Lauf faengt dann nicht wieder bei null an.
      - name: Datenordner aus dem Zwischenspeicher
        id: zwischenspeicher
        uses: actions/cache/restore@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}
          restore-keys: comphub-daten-

      - name: Stand vom Release holen
        # Nur wenn der Zwischenspeicher nichts hergab. GitHub wirft ihn nach
        # sieben Tagen ohne Zugriff weg; dann faengt der Lauf sonst bei null an
        # und wuerde alles neu von Epic holen.
        #
        # Vom Release, nicht aus Supabase: seit dem 22.9.2026 liegt alles
        # Gerechnete nur noch dort ("nur das Noetigste" in Supabase - das
        # Kontingent dort war an genau solchen Abholungen aufgebraucht).
        if: steps.zwischenspeicher.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner platzierungen \
            --ordner szene-stats --ordner szene-quelle --ordner power-rankings \
            --ordner tournament-leaderboards --ordner akten --ordner antworten --ordner replays \
            2>&1 | tail -12

      # Die kleinen Staende jede Stunde: Fotos, gepflegte Profile, Namen,
      # Preisgelder. Sie aendern sich auf der Seite (der Betreiber pflegt
      # Fotos und Profile dort), und der Zwischenspeicher hier kennt davon
      # sonst nur den Stand vom ersten Tag. Genau so kam eine Startansicht
      # ohne ein einziges Bild in die Ablage: der Laufrechner hatte keine
      # spielerbilder.json. Alles Grosse bleibt draussen.
      - name: Das Noetigste aus Supabase
        id: noetiges
        # Genau die Liste aus scripts/umzug-supabase.mjs (NOETIGES) - was
        # Nutzer und Betreiber auf der Seite schreiben. Sonst nichts.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          node scripts/umzug-supabase.mjs --herunterladen --noetiges \
            --ohne kartenbilder,kontakt-bilder,admin-maps,galerie,eigene-matches \
            2>&1 | tail -4

      # Das Gepflegte sofort ans Release - vor allem anderen.
      #
      # Antwortet Supabase nicht, liest die Seite Karten, Prognosen und
      # Profile vom Release. Am 24.9.2026 war diese Kopie vom Vortag: das
      # Sichern stand hinter den Replays, und die hingen seit Stunden. Die
      # Globals-Karte stand waehrend eines Ausfalls dadurch ohne ein einziges
      # Team da. Jetzt wandern die gepflegten Dateien gleich nach dem Holen
      # hoch - aber nur, wenn das Holen geklappt hat, sonst laege hier ein
      # alter Stand aus dem Zwischenspeicher, und der ersetzte einen neueren.
      - name: Gepflegtes sofort ans Release
        if: steps.noetiges.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nur hier duerfen die gepflegten Dateien ans Release - siehe
          # scripts/ablage-github.mjs, GEPFLEGT.
          GEPFLEGT_HOCHLADEN: '1'
        run: |
          node scripts/ablage-github.mjs --nur prognosen.json --nur turnier-karten.json \
            --nur karten-vorlagen.json --nur spieler-profile.json --nur spielerbilder.json \
            --nur spieler-namen.json --nur orgtags.json 2>&1 | tail -6

      # Die Verdienst-Akte und Epics Auszahlungstabellen entstehen nur auf dem
      # Betreiber-Rechner (die alten Bestenlisten liegen nur dort) und kommen
      # von dort ans Release. Antwortet Supabase nicht, rechnete dieser Lauf
      # die Akten sonst mit dem Stand aus seinem Zwischenspeicher und lud sie
      # hoch - die Profile fielen auf gestern zurueck. Das Release ist fuer
      # diese Dateien die massgebliche Kopie.
      - name: Verdienst-Akte und Tabellen vom Release
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/ablage-github-holen.mjs verdienst-archiv.json elims-archiv.json elims-summen-alt.json preisgeld-tabellen.json lan-preisgelder.json 2>&1 | tail -6

      # Die ausgewerteten Replays, aber nur, was sich geaendert hat.
      #
      # Der Live-Sammler legt waehrend eines Cups Aggregate ab, die dieser
      # Lauf nicht hat - und die Startseite, die hier vorgerechnet wird,
      # zaehlt daraus die Eliminierungen. Ohne diesen Schritt fehlten ihr
      # die juengsten Spieltage, und der Sammler unten hielte jedes dieser
      # Fenster fuer unberuehrt. Beim ersten Mal sind das siebenhundert
      # Megabyte, danach nur noch die Fenster, die sich bewegt haben.
      # Die ausgewerteten Replays des Live-Sammlers (replays-live.yml) und
      # die Epic-Spieltage, die der Betreiber-Rechner nach Kennung holt
      # (epic-fenster-holen.mjs): beides kommt seit dem 22.9.2026 vom
      # Release, nicht mehr aus Supabase. Nur, was sich unterscheidet.
      - name: Replays und Spieltage vom Release
        continue-on-error: true
        timeout-minutes: 15
        run: |
          node scripts/ablage-github-holen.mjs --ordner replays --ordner epic-spieltage 2>&1 | tail -4

      # Auch hier die Adresse des Werkzeugs. Ohne sie fragte das Skript auf
      # localhost ins Leere und brach nach einer Sekunde mit ECONNREFUSED ab
      # - Stunde um Stunde, unter "continue-on-error" unsichtbar. Genau
      # deshalb tauchte ein Cup, der gerade zu Ende war, weder unter
      # Turnieren noch in den Profilen auf: die Epic-Spieltage kamen nie.
      # Gefunden ueber das Protokoll des Laufs, das der Betreiber mit einem
      # GitHub-Token lesbar gemacht hat.
      - name: Spieltage holen
        continue-on-error: true
        timeout-minutes: 15
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: node scripts/epic-spieltage-holen.mjs 2>&1 | tail -20

      # Alte Spieltage suchen, die Epics Liste nicht mehr nennt - je Lauf
      # ein Stueck (1500 Abfragen, gut zehn Minuten), das Gedaechtnis liegt
      # im Zwischenspeicher (_gesucht.json). Was gefunden wird, laedt der
      # Schritt "Ergebnis nach Supabase" mit hoch. Siehe das Skript.
      - name: Alte Spieltage suchen
        continue-on-error: true
        timeout-minutes: 15
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        # Endet selbst nach zwoelf Minuten (SIGTERM), statt jedes Mal hart in
        # die Grenze zu laufen und den Lauf als gescheitert zu markieren.
        run: |
          timeout --signal=TERM 12m node scripts/epic-fenster-suchen.mjs --hoechstens 1500 2>&1 | tail -15
          true

      # Die Team-Eliminierungen aus Epics Bestenlisten (Statistik, Jahre):
      # die offenen Saisons aus den Spieltagen oben neu, das laufende Jahr
      # und "alle Zeit" dazu aus den abgeschlossenen Summen vom Release
      # (elims-summen-alt.json, gebaut auf dem Betreiber-Rechner). Die
      # Jahre davor bleiben, wie sie sind. Siehe scripts/elims-archiv.mjs.
      - name: Team-Eliminierungen ergaenzen
        continue-on-error: true
        timeout-minutes: 5
        run: node --max-old-space-size=4096 scripts/elims-archiv.mjs --ergaenzen 2>&1 | tail -6

      # Auch hier die Adresse des Werkzeugs: das Skript holt die Bestenlisten
      # ueber die eigene Schnittstelle, und ohne die Adresse fragt es auf
      # localhost ins Leere - zwanzig Minuten lang, fuer jeden Spieltag ein
      # Fehlschlag. In der Ablage lagen deshalb fuer die laufende Saison genau
      # zwei Platzierungsdateien, und auf der Statistikseite stand bei Platz
      # und Punkten ein Strich.
      - name: Platzierungen holen
        continue-on-error: true
        timeout-minutes: 12
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: node scripts/platzierungen-holen.mjs 2>&1 | tee /tmp/platzierungen.log | tail -20

      - name: Werte der Szene holen
        continue-on-error: true
        run: node scripts/szene-stats-holen.mjs

      # Das Ranglisten-Skript liest Epics Seite in einem Browser. Der
      # Browser fehlte auf dem Laufrechner - der Schritt endete nach null
      # Sekunden, "continue-on-error" verschluckte es, und die Rangliste
      # blieb seit dem 8. September stehen.
      - name: Browser fuer die Weltrangliste
        continue-on-error: true
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium 2>&1 | tail -3

      - name: Weltrangliste holen
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/power-rankings-holen.mjs 2>&1 | tail -8

      # Dasselbe wie im Live-Ablauf: ohne diese Adresse sucht das Skript das
      # Werkzeug auf localhost, findet dort nichts und holt nichts. Der Bau
      # der Anwendung kommt in diesem Ablauf erst spaeter, ein eigener Server
      # steht hier also ohnehin nicht zur Verfuegung.
      # Mit Zeitgrenze: dieser Schritt lief zuletzt in jeder Stunde bis in
      # die Grenze des ganzen Auftrags (neunundsechzig Minuten), und alles
      # danach - Bauen, Vorrechnen, Hochladen - kam nie an die Reihe. Was
      # in dreissig Minuten nicht geholt ist, holt der naechste Lauf; der
      # Stand je Fenster wird alle zweihundert Matches gesichert.
      - name: Replays holen
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        continue-on-error: true
        timeout-minutes: 14
        # Seit dem 25.9.2026 nur noch das Frische der letzten zwoelf Stunden,
        # und nur zwoelf Minuten lang. Den Rueckstand aelterer Spieltage
        # arbeitet .github/workflows/replays-nacharbeiten.yml auf vier
        # Rechnern ab - hier kostete er neun Minuten je Stunde und schaffte
        # kaum etwas, waehrend der Lauf danach beim Bau abgeschossen wurde.
        # Die Grenze von zwoelf Stunden ist dieselbe wie dort (--ohne-frische
        # 12): so fassen nie zwei Rechner denselben Spieltag an. Neue
        # Spieltage legt nur dieser Gang an.
        #
        # (Frueher:) Zweiundsiebzig Stunden statt zwei: was der Live-Sammler waehrend
        # eines Cups verpasst hat, wird so binnen drei Tagen nachgeholt -
        # Epic haelt die Replays einunddreissig Tage vor. Schon Ausgewertetes
        # kostet dabei nichts, der Stand je Fenster kennt es.
        #
        # Zwei Gaenge in derselben halben Stunde: erst zwanzig Minuten das
        # Frische, dann neun Minuten das Liegengebliebene aelterer Fenster
        # (--wiederholen). Vorher lief nur der frische Gang, und ein grosser
        # Skin-Cup, der aelter als drei Tage war, blieb mit tausenden offenen
        # Matches fuer immer "still open" - der Betreiber: "5184 still open,
        # wie lange geht das noch?" Beide enden sanft an ihrer Frist (SIGTERM),
        # der Stand je Fenster ist alle zweihundert Matches gesichert.
        run: |
          timeout --signal=TERM 12m node scripts/replays-holen.mjs --frisch 12 2>&1 | tee /tmp/replays.log | grep -v ' \.\.\.$' | tail -25
          true

      - name: Replays auswerten
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/replays-aggregieren.mjs 2>&1 | tee /tmp/aggregieren.log | tail -20

      # Das Gerechnete sofort ans Release - noch vor dem Bau.
      #
      # Seit dem 24.9.2026 bekam der Laufrechner beim Bauen jedes Mal ein
      # Abschaltsignal ("The runner has received a shutdown signal", exit
      # 143), und alles danach - auch "Ergebnis ans GitHub-Release" mit
      # always() - fiel weg. Die Seite blieb auf dem Stand vom 23.9. stehen;
      # der Betreiber sah es an "Matches processed", das sich seit Tagen
      # nicht mehr bewegte. Jetzt ist das Wichtigste oben, bevor gebaut wird;
      # der Schritt am Ende laedt dann nur noch nach, was sich seither
      # geaendert hat (das Manifest kennt den Rest).
      - name: Zwischenstand ans GitHub-Release
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ablage-github.mjs 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -30

      # ------------------------------------------------- Antworten vorrechnen
      #
      # Die Startseite und die Statistikseite rechnen ueber neunhundert
      # Spieltage. Hier liegen die Dateien auf der Platte des Laufrechners -
      # das dauert Sekunden. Bei Vercel kaemen dieselben Dateien ueber das
      # Netz, und dort waren es erst eine Minute dreiundfuenfzig, nach dem
      # Umbau auf die Tabelle immer noch drei Minuten.
      #
      # Also wird hier gerechnet und nur das Ergebnis hochgeladen. Vercel
      # liest danach eine einzige Zeile: gemessen 0,8 Sekunden statt 113.
      # Der Bau und das Vorrechnen schreiben ein Protokoll nach
      # data/antworten/_lauf.json, das mit hochgeladen wird. Grund: seit dem
      # 8. September legte dieser Lauf keine Antworten mehr ab - der Bau
      # dauerte zwoelf Sekunden, das Vorrechnen genau die sechzig Sekunden
      # der Warteschleife - und "continue-on-error" verschluckte den Fehler.
      # Ohne Zugang zu den Protokollen von GitHub war nicht zu sehen, warum.
      # Jetzt steht es dort, wo das Werkzeug es lesen kann.
      - name: Anwendung bauen
        id: bau
        continue-on-error: true
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set +e
          # Uebrig gebliebene Replay-Auswerter beenden, bevor gebaut wird.
          # "timeout" im Schritt "Replays holen" beendet nur das Skript, die
          # gestarteten FortniteReplayAnalysis-Prozesse liefen weiter und
          # teilten sich den Speicher mit dem Bau - bis der Laufrechner
          # abgeschaltet wurde (siehe "Zwischenstand ans GitHub-Release").
          pkill -f FortniteReplayAnalysis || true
          pkill -f replays-holen || true
          free -m | head -2
          df -h / | tail -1
          # Der Datenordner geht waehrend des Baus beiseite - wie bei Vercel,
          # wo er gar nicht existiert. Hier lagen daneben ueber 155000
          # Dateien, und der Bau wurde seit dem 24.9.2026 jedes Mal nach
          # knapp vier Minuten abgeschossen ("The runner has received a
          # shutdown signal"), obwohl vorher 15 GB Speicher frei waren.
          mv data /tmp/daten-beiseite
          # Speicher und Platte im Blick, falls es doch wieder abbricht.
          ( while sleep 30; do echo "  [Wache] $(free -m | awk 'NR==2{print $7}') MB frei, Platte $(df -h / | awk 'NR==2{print $4}') frei"; done ) &
          WACHE=$!
          npm run build > /tmp/bau.log 2>&1
          CODE=$?
          kill $WACHE 2>/dev/null
          mv /tmp/daten-beiseite data
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 40 /tmp/bau.log
          exit $CODE

      - name: Antworten vorrechnen
        continue-on-error: true
        timeout-minutes: 20
        env:
          BAU_CODE: ${{ steps.bau.outputs.code }}
        run: |
          set +e
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          SERVER=$!
          BEREIT=nein
          # Warten, bis er antwortet - hoechstens eine Minute.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/stand >/dev/null && { BEREIT=ja; break; }
            sleep 2
          done
          node scripts/antworten-vorrechnen.mjs http://localhost:3000 > /tmp/vorrechnen.log 2>&1
          tail -n 30 /tmp/vorrechnen.log
          # Die Zahlen des Tages nach #admin-zahlen - eine Nachricht je Tag,
          # die jeder Lauf fortschreibt (scripts/admin-zahlen-discord.mjs).
          node scripts/admin-zahlen-discord.mjs http://localhost:3000 2>&1 | tail -2
          kill $SERVER || true
          mkdir -p data/antworten
          BEREIT=$BEREIT node scripts/lauf-protokoll.mjs

      - name: Ergebnis nach Supabase
        # "--neuer-als 120" nimmt nur, was dieser Lauf geschrieben hat. Die
        # Zeitspanne ist grosszuegiger als die Laufzeit, damit auch ein langer
        # Lauf nichts verliert.
        #
        # Die rohen Replays bleiben draussen: das sind Gigabytes, sie leben bei
        # Epic nur einunddreissig Tage, und gebraucht wird von ihnen ohnehin
        # nur das ausgewertete Ergebnis.
        #
        # Mit Frist: ist Supabase weg, bricht das Skript nach fuenf Fehlern
        # ab - und spaetestens hier ist Schluss, damit der Lauf nicht in
        # seine 90 Minuten laeuft und das Release leer ausgeht.
        #
        # Die Akten bleiben draussen: achttausend Dateien, ein Viertel
        # Gigabyte, jede Stunde neu geschrieben - sie liegen am Release, und
        # die Seite liest sie dort zuerst. In der Datenbank waren sie die
        # groesste Last am kostenlosen Kontingent (500 MB).
        #
        # Seit dem 22.9.2026 nur noch das Noetigste (NOETIGES in
        # scripts/umzug-supabase.mjs): was dieser Lauf davon anfasst - Namen,
        # Fotos-Zuordnung, Cup-Archiv. Antworten, Akten, Spieltage, Replays
        # gehen ausschliesslich ans Release. Supabase hatte das Projekt wegen
        # aufgebrauchten Datenverkehrs gesperrt; der Betreiber: "dort soll
        # immer nur das Noetigste ab jetzt sein."
        continue-on-error: true
        timeout-minutes: 6
        run: |
          node scripts/umzug-supabase.mjs --neuer-als 120 --noetiges \
            --ohne kartenbilder,kontakt-bilder,admin-maps,galerie,eigene-matches,antworten

      # Die zweite Ablage: dieselben Dateien als Anhaenge am Release "daten"
      # des Projekts (siehe lib/ablageGithub.ts). Von dort liest die Seite die
      # Antworten und Akten zuerst und alles andere, sobald Supabase nicht
      # antwortet. Am 16.9.2026 war die Datenbank dort dreimal am Tag weg, und
      # dieser Schritt hier war der einzige Weg, die Zahlen trotzdem zu zeigen.
      # Das Manifest am Release sagt, was sich geaendert hat; ein Lauf laedt
      # nur das hoch.
      #
      # Mit sichtbarem Fortschritt statt "tail": bis zum 22.9.2026 lief der
      # Schritt vierzig Minuten in die Zeitgrenze, und im Protokoll stand
      # nichts - weil tail erst am Ende druckt. Das Skript drosselt sich
      # jetzt selbst unter GitHubs Grenze und schreibt das Manifest
      # zwischendurch; ein Abbruch verliert nichts mehr.
      - name: Ergebnis ans GitHub-Release
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ablage-github.mjs 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -60

      - name: Datenordner sichern
        # Auch nach einem Fehlschlag - siehe oben.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: comphub-daten-${{ github.run_id }}

      # Nur bei einem Problem eine Nachricht in #admin-alarm (siehe
      # scripts/lauf-bericht-discord.mjs) - vierzig abgebrochene Laeufe und
      # eine dreizehn Tage alte Weltrangliste hatte vorher niemand gesehen.
      - name: Bericht an den Admin-Kanal
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          LAUF_STATUS: ${{ job.status }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/lauf-bericht-discord.mjs 2>&1 | tail -3

      # Zum Schluss, nicht vorher: das Hochladen liest die Zugangsdaten aus
      # .env.local. Standen sie hier oben, scheiterte jeder Lauf am
      # Hochladen - und die Erneuerung erneuerte wieder einmal nichts.
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
