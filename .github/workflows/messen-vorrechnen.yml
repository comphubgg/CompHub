# Messlauf nur von Hand: wo bleibt die Zeit in "Antworten vorrechnen" (daten-erneuern.yml)? Liest den Zwischenspeicher nur
# (kein Sichern), laedt nichts hoch, schreibt nur auf dem Laufrechner; Ergebnis als Anhang "messung" (CPU-Profile, Lese-/Netzzeiten
# aus tools/messen/messen.cjs). Auf main, weil ein Zweig den Zwischenspeicher von main nicht zu sehen bekam (16.11.2026).
name: Messen Vorrechnen
on:
  workflow_dispatch:
    inputs:
      # Leer: der bisherige Messlauf (Startansichten S41 bis S43). Sonst diese Abfragen (durch Leerzeichen getrennt, ohne "/api/"), jede auf
      # demselben frischen Server, mit Speicherverlauf und den Antworten als Anhang "messung" (28.11.2026: wo der Server beim Vorrechnen stirbt).
      abfragen:
        required: false
        default: ''
      # Heap des Servers in MB (wie in daten-erneuern.yml: 7168).
      heap:
        required: false
        default: '7168'
jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      OHNE_CLUTCH: '1'
      OHNE_REPLAYVOLL: '1'
      OHNE_REPLAYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
      - uses: actions/cache/restore@v4
        id: zs
        with:
          path: data
          key: messen-nie-${{ github.run_id }}
          restore-keys: comphub-daten-
      # Der Zwischenspeicher von daten-erneuern.yml war aus diesem Ablauf nicht zu finden (16.11.2026) - dann wie ein kalter
      # Lauf dort: dieselben Befehle wie "Stand vom Release holen", "Das Noetigste" und "Verdienst-Akte und Tabellen".
      - name: Stand vom Release
        if: steps.zs.outputs.cache-matched-key == ''
        timeout-minutes: 50
        run: |
          df -h / | tail -1
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner platzierungen \
            --ordner power-rankings \
            --ordner tournament-leaderboards --ordner akten --ordner antworten --ordner replays --ordner replays/S42 --ordner replays/S43 --ordner replays/S44 --ordner clutch \
            --ordner replays-schlank/S42 --ordner replays-schlank/S43 --ordner replays-schlank/S44 \
            2>&1 | tail -12
          node scripts/daten-sync.mjs --herunterladen --noetiges --ohne kartenbilder,kontakt-bilder,admin-maps,galerie,eigene-matches 2>&1 | tail -4 || true
          node scripts/ablage-github-holen.mjs verdienst-archiv.json elims-archiv.json elims-summen-alt.json preisgeld-tabellen.json wertung-tabellen.json lan-preisgelder.json lan-konten.json 2>&1 | tail -6
          du -sh data; df -h / | tail -1
      - name: Bauen
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          mv data /tmp/daten-beiseite
          npm run build > /tmp/bau.log 2>&1; CODE=$?
          if [ -d data ]; then mv data /tmp/bau-leer; fi
          mv /tmp/daten-beiseite data
          tail -5 /tmp/bau.log; exit $CODE
      - name: Messen (Abfragen)
        if: inputs.abfragen != ''
        timeout-minutes: 70
        env:
          COMPHUB_VORRECHNEN: '1'
          ABFRAGEN: ${{ inputs.abfragen }}
          HEAP: ${{ inputs.heap }}
          MESSEN_SPIELER: SwizzY,Charyy,Scroll
          MESSEN_HEAPPROFIL: '1'
        run: |
          set +e
          sudo fallocate -l 8G /mnt/auslagerung && sudo chmod 600 /mnt/auslagerung && sudo mkswap /mnt/auslagerung >/dev/null && sudo swapon /mnt/auslagerung
          mkdir -p /tmp/antworten
          du -sh data/epic-spieltage data/clutch data/replays-schlank data/replays data/platzierungen 2>&1
          for d in data/epic-spieltage/*; do echo "  $d: $(ls $d | wc -l) Dateien, $(du -sh $d | cut -f1)"; done
          export LAUF_BEGINN=$(date +%s)
          export MESSEN_GROSS=1
          NODE_OPTIONS="--max-old-space-size=$HEAP --require $PWD/tools/messen/messen.cjs" npx next start -p 3000 >> /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/api/stand >/dev/null && break; sleep 2; done
          ( while sleep 15; do echo "  [Wache] $(date +%T) belegt $(free -m | awk 'NR==2{print $3}') MB, Ausl. $(free -m | awk 'NR==3{print $3}') MB, Server $(ps -eo rss=,comm= --sort=-rss | awk '/next-server/{printf "%d MB", $1/1024; exit}')"; done ) &
          WACHE=$!
          N=0
          for q in $ABFRAGEN; do
            N=$((N + 1))
            # "warten": keine Abfrage, nur zwei Minuten - was der Server von selbst tut (instrumentation-node.ts).
            if [ "$q" = warten ]; then sleep 120; echo "  120s  (ohne Abfrage)"; else
            S=$(date +%s.%N); curl -s -o "/tmp/antworten/$N.json" -w "%{http_code} %{size_download}B" -m 1800 "http://localhost:3000/api/$q"; echo "  $(echo "$(date +%s.%N) - $S" | bc)s  $q"
            fi
            A=$(grep -c '\[PROFIL\]' /tmp/server.log)
            pkill -USR2 -f next-server; sleep 30; grep '\[HEAP\]' /tmp/server.log | tail -1
            grep '\[PROFIL\]' /tmp/server.log | tail -n +$((A + 1)) | cut -c1-400
            # Preisgeld einzelner Spieler aus einer Jahresliste (MESSEN_SPIELER, Anzeigenamen) - Anhaenge sind von aussen nicht immer lesbar.
            node -e 'try { const d = require(process.argv[1]); const l = (d.listen || []).find((x) => x.feld === "verdienst"); if (l) { console.log("    Spieltage", d.spieltage, "mit Regel", l.spieltageMitRegel); for (const n of (process.env.MESSEN_SPIELER || "").split(",")) { const p = l.plaetze.find((x) => x.anzeige === n); console.log("    " + n + ": " + (p ? p.verdienst : "-")); } } } catch (e) { console.log("    " + e.message); }' "/tmp/antworten/$N.json"
          done
          kill $WACHE
          echo "=== Verlauf"; grep -E '\[(MESS|HEAP)\]' /tmp/server.log | cut -c1-900
          echo "=== Grosse Dateien"; grep '\[GROSS\]' /tmp/server.log | head -60
          tail -30 /tmp/server.log | grep -v '\[MESS\]' | cut -c1-300
          true

      - name: Messen
        if: inputs.abfragen == ''
        timeout-minutes: 70
        env:
          COMPHUB_VORRECHNEN: '1'
        run: |
          set +e
          sudo fallocate -l 8G /mnt/auslagerung && sudo chmod 600 /mnt/auslagerung && sudo mkswap /mnt/auslagerung >/dev/null && sudo swapon /mnt/auslagerung
          mkdir -p /tmp/prof
          export LAUF_BEGINN=$(date +%s)
          export MESSEN_GROSS=1
          NODE_OPTIONS="--max-old-space-size=7168 --require $PWD/tools/messen/messen.cjs " \
            npx next start -p 3000 >> /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/api/stand >/dev/null && break; sleep 2; done
          ( while sleep 30; do echo "  [Wache] $(date +%T) belegt $(free -m | awk 'NR==2{print $3}') MB, Ausl. $(free -m | awk 'NR==3{print $3}') MB"; done ) &
          for q in 'ansicht=start&saison=S41' 'ansicht=start&saison=S42' 'ansicht=start&saison=S43'; do
            S=$(date +%s.%N); curl -s -o /tmp/a1.json -w "%{http_code} %{size_download}B" -m 900 "http://localhost:3000/api/szene-stats?$q"; echo "  $(echo "$(date +%s.%N) - $S" | bc)s  $q"
            cp /tmp/a1.json "/tmp/erst-$(echo $q | tr '&=' '__').json"
          done
          pkill -TERM -f next-server; sleep 20; pkill -9 -f next-server; sleep 2
          ls data/_vorrechnen-stand/aggregat/S42 | wc -l; du -sh data/_vorrechnen-stand; ls -la data/antworten/replays_saison_S4* 2>&1
          echo "=== zweiter frischer Server, neuer Laufbeginn: Startansicht neu, Saison-Sammlung aus Ablage/Auszug"
          export LAUF_BEGINN=$(date +%s)
          NODE_OPTIONS="--max-old-space-size=7168 --require $PWD/tools/messen/messen.cjs" npx next start -p 3000 >> /tmp/server2.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/api/stand >/dev/null && break; sleep 2; done
          for q in 'ansicht=start&saison=S41' 'ansicht=start&saison=S42' 'ansicht=start&saison=S43'; do
            S=$(date +%s.%N); curl -s -o /tmp/a2.json -w "%{http_code} %{size_download}B" -m 900 "http://localhost:3000/api/szene-stats?$q"; echo "  $(echo "$(date +%s.%N) - $S" | bc)s  $q"
            node -e "const a=require('/tmp/erst-$(echo $q | tr '&=' '__').json'),b=require('/tmp/a2.json');const o=(x)=>JSON.stringify({l:x.listen,g:x.grundlage,c:x.clutch&&x.clutch.gesamt});console.log('    Listen/Grundlage gleich wie erster Server:',o(a)===o(b))"
          done
          grep '\[GROSS\]' /tmp/server2.log | grep -c replays/ || true
          echo "=== grosse Lesevorgaenge"; grep -c '\[GROSS\]' /tmp/server.log
          grep '\[GROSS\]' /tmp/server.log | awk '{print $5}' | sed -E 's#/[^/]*$##' | sort | uniq -c | sort -rn | head -20
          grep '\[GROSS\]' /tmp/server.log | awk '{print $4}' | sort | uniq -c
          grep -A12 '\[GROSS\].*x1 ' /tmp/server.log | grep -v '\[GROSS\]' | head -60
          grep '\[GROSS\]' /tmp/server.log | sed -n '1~40p' | head -40
          ls data/replays/S42 | wc -l; ls data/replays-schlank/S42 2>/dev/null | wc -l; du -sh data/replays/S42 data/replays-schlank/S42 2>&1
          tail -20 /tmp/server.log | cut -c1-300
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messung
          path: |
            /tmp/server.log
            /tmp/antworten
          retention-days: 3
      - if: always()
        run: rm -f .env.local
