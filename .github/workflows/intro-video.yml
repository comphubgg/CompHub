# Das CompHub-Intro als MP4 (Betreiber, 10.11.2026): das Logo als 3D-Tierchen springt durch alle Seiten.
# Screenshots der Live-Seite, die 3D-Szene (tools/intro/szene.html) Bild fuer Bild, dann MP4 - abgelegt im Release "medien".
name: Intro-Video
on:
  workflow_dispatch:
    inputs:
      fps:
        description: Bilder je Sekunde
        required: false
        default: '30'
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: three.js und Browser
        run: |
          mkdir -p /tmp/three && cd /tmp/three && npm init -y >/dev/null && npm i three@0.170.0 --no-audit --no-fund
          ln -sfn /tmp/three/node_modules/three "$GITHUB_WORKSPACE/tools/intro/three"
          cd "$GITHUB_WORKSPACE" && npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: Aufnehmen
        run: node tools/intro/aufnehmen.mjs --fps "${{ inputs.fps }}" --aus /tmp/comphub-intro.mp4
      - name: Ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view medien >/dev/null 2>&1 || gh release create medien --title "Medien" --notes "Videos und Bilder fuer Posts" --prerelease
          gh release upload medien /tmp/comphub-intro.mp4 --clobber
          ls -la /tmp/comphub-intro.mp4
