# Server-Replays voll auslesen - Zonen, Kill-Feed, Spieler je Match - und zwar laufend.
#
# Der Betreiber (14.10.2026): "Wenn ein Cup zu Ende ist, soll eine halbe Stunde danach jede einzelne Runde analysiert sein ... kein Replay darf
# nicht funktionieren, nicht 99 Prozent, 100."
#
# Bis dahin las nur der stuendliche Lauf (daten-erneuern.yml) und hoechstens 24 Matches, eines nach dem anderen. Jetzt hat das Auslesen
# einen eigenen Auftrag:
#   - als Schleife: alle vier Minuten ein Durchgang, vier Matches gleichzeitig, jedes Herunterladen und Auslesen mit Wiederholungen; was
#     doch scheitert, steht im Index unter "fehler" und kommt im naechsten Durchgang als Erstes wieder dran
#   - nie zwei Auftraege gleichzeitig (der Index index.json hat genau einen Schreiber; der Stundenlauf laedt replay-voll nicht mehr hoch)
#
# Warum eine Schleife und nicht der Zehn-Minuten-Takt (cron): GitHub uebergeht geplante Laeufe unter Last stundenlang - dieser Ablauf lief nach
# dem Anlegen in drei Stunden einmal. Der Auftrag bleibt rund fuenfeinhalb Stunden an und stoesst am Ende den naechsten selbst an; ein Push an
# diesen Dateien startet ihn sofort neu, der Zeitplan ist nur der Rueckfall.
#
# Epic haelt ein Replay 31 Tage; was bis dahin nicht gelesen ist, ist fuer immer weg - deshalb lieber zu oft nachsehen als zu selten.

name: Replays voll auslesen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replays-voll.yml'
      - 'scripts/replay-voll-holen.mjs'
      - 'scripts/schleife.mjs'
      - 'lib/replayKern.mjs'
      - 'lib/releaseTags.mjs'
      - 'scripts/replay-voll-abgleich.mjs'
      - 'tools/replay-voll/**'
      - 'scripts/ablage-github.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: replays-voll
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  schleife:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -3

      - name: Epic-Anmeldung, Spieltage und Stand vom Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage 2>&1 | tail -3
          node scripts/ablage-github-holen.mjs replay-voll/index.json 2>&1 | tail -2
          node scripts/ablage-github-holen.mjs replay-voll/_spieler.json 2>&1 | tail -1

      # Jeder Durchgang: neue Matches auslesen, Ergebnis und Index ans Release. Die Spieltage (neue Finals) kommen alle dreissig Minuten frisch.
      - name: Schleife
        timeout-minutes: 340
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/schleife.mjs --minuten 325 --takt 240 \
            --schritt "40:node scripts/replay-voll-abgleich.mjs 2>&1 | tail -3" \
            --schritt "8:node scripts/ablage-github-holen.mjs --ordner epic-spieltage 2>&1 | tail -3" \
            --schritt "node scripts/replay-voll-holen.mjs --hoechstens 300 --parallel 4 --minuten 6 2>&1 | tail -40" \
            --schritt "node scripts/replay-spieler-index.mjs --hoechstens 400 2>&1 | tail -2" \
            --schritt "[ -d data/replay-voll ] && node scripts/ablage-github.mjs --nur replay-voll --neuer-als 20 --stempel replay-voll 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -8 || true"

      - name: Naechsten Auftrag anstossen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run replays-voll.yml -R "${{ github.repository }}" --ref main && echo "naechster Auftrag angestossen"

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
