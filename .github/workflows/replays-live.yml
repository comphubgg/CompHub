# Replays waehrend eines laufenden Cups.
#
# Was hier ersetzt wird: bis zum Umzug lief im Webserver selbst eine Uhr, die
# alle fuenf Minuten nachsah, ob gerade ein Cup laeuft, und dann die frischen
# Runden holte und auswertete (instrumentation.node.ts, LIVE_TAKT). Bei Vercel
# gibt es diese Uhr nicht mehr - dort startet je Anfrage etwas und schlaeft
# danach wieder ein.
#
# Ohne diesen Ablauf haetten die Matches waehrend eines Cups bis zu einer
# Stunde Rueckstand, weil die grosse Erneuerung nur stuendlich laeuft. Fuer
# eine Seite, auf der jemand waehrend des Turniers nachsieht, wer noch lebt,
# ist das zu lang.
#
# Deshalb ein eigener, schlanker Ablauf alle zehn Minuten. Er tut fast immer
# gar nichts: der erste Schritt fragt die eigene Seite, ob ueberhaupt ein Cup
# laeuft, und bricht sonst sofort ab. Das kostet ein paar Sekunden statt
# mehrerer Minuten - und die Minuten sind zwar frei, Epics Schnittstelle aber
# nicht endlos geduldig.

name: Replays live

on:
  workflow_dispatch:
  schedule:
    # Alle zehn Minuten. Feiner lohnt nicht: eine Runde dauert rund zwanzig
    # Minuten, und GitHub haelt geplante Laeufe ohnehin nicht auf die Sekunde
    # ein.
    - cron: '*/10 * * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    # Die Schleife sammelt bis zu 330 Minuten, solange ein Cup laeuft.
    timeout-minutes: 350

    # Nie zwei gleichzeitig - der zweite haette denselben Stand zweimal.
    # Und wenn der Naechste schon wartet, ist der Vorige ohnehin ueberholt.
    # Nie zwei gleichzeitig - aber einen laufenden auch nicht abwuergen:
    # der naechste wartet, bis dieser fertig ist. Vorher wurde ein Lauf, der
    # laenger als zehn Minuten sammelte, vom naechsten abgebrochen - und das
    # Hochladen am Ende kam nie.
    concurrency:
      group: replays-live
      cancel-in-progress: false

    steps:
      - name: Laeuft ueberhaupt ein Cup?
        id: pruefung
        run: |
          # Der Katalog nennt die Zahl der laufenden Cups. Antwortet die Seite
          # nicht, wird lieber gearbeitet als geschlafen - ein verpasster Lauf
          # faellt mehr ins Gewicht als ein ueberfluessiger.
          ANTWORT=$(curl -sf --max-time 30 \
            'https://www.thecomphub.com/api/cup-catalog?modus=aktuell' || echo '')
          if [ -z "$ANTWORT" ]; then
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
            echo "Seite antwortet nicht - wird trotzdem versucht."
            exit 0
          fi
          LIVE=$(printf '%s' "$ANTWORT" | node -e \
            'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).live??0)}catch{console.log(1)}})')
          echo "Laufende Cups: $LIVE"
          if [ "$LIVE" -gt 0 ]; then echo "weiter=ja" >> "$GITHUB_OUTPUT";
          else echo "weiter=nein" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.pruefung.outputs.weiter == 'ja'

      - uses: actions/setup-node@v4
        if: steps.pruefung.outputs.weiter == 'ja'
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        if: steps.pruefung.outputs.weiter == 'ja'
        run: npm ci --omit=optional

      - name: Zugangsdaten
        if: steps.pruefung.outputs.weiter == 'ja'
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Datenordner aus dem Zwischenspeicher
        if: steps.pruefung.outputs.weiter == 'ja'
        id: zwischenspeicher
        uses: actions/cache@v4
        with:
          # Ein eigener Zwischenspeicher, getrennt vom stuendlichen Ablauf.
          #
          # Vorher teilten sich beide denselben Namen, und jeder Lauf nahm
          # den juengsten Stand - den des jeweils anderen. Ein stuendlicher
          # Lauf, der neunzig Minuten arbeitete, sicherte am Ende einen
          # Stand ohne alles, was der Live-Sammler in diesen neunzig Minuten
          # geholt hatte; der naechste Live-Lauf fing damit an und rechnete
          # Aggregate mit einem Bruchteil der Matches. Jetzt hat jeder
          # Ablauf seine eigene Kette, und was beide gemeinsam brauchen,
          # kommt aus Supabase.
          path: data
          key: comphub-live-${{ github.run_id }}
          restore-keys: comphub-live-

      # Was der Zwischenspeicher nicht hergibt, kommt aus Supabase.
      #
      # Der Sammler braucht die Epic-Anmeldung (data/epic-auth.json) und den
      # Stand je Fenster (welche Matches schon ausgewertet sind). Fehlt die
      # Anmeldung, scheitert die Bestenliste jedes laufenden Fensters mit
      # einer Warnung, und der Lauf endet nach drei Sekunden mit "Fertig: 0"
      # - gruen. Genau so sahen die Laeufe aus: am Donnerstagabend, waehrend
      # der Reload Duos Victory Cup lief, waren alle vierundvierzig in unter
      # einer Minute durch und sammelten nichts; die Wiederherstellung des
      # Zwischenspeichers dauerte null Sekunden, der Ordner war also leer.
      #
      # Den Stand je Fenster holt sich der Sammler selbst, und zwar nur fuer
      # die Fenster, die er anfasst, und nur, wenn er ihn nicht schon hat.
      # Vorher wurden hier alle Aggregate der Saison geholt - siebenhundert
      # Megabyte, alle zehn Minuten, bei fuenf Gigabyte Datenverkehr im
      # Monat, die Supabase kostenlos hergibt.
      - name: Anmeldung aus Supabase
        if: steps.pruefung.outputs.weiter == 'ja'
        continue-on-error: true
        run: |
          if [ ! -f data/epic-auth.json ]; then
            echo "Keine Epic-Anmeldung im Zwischenspeicher - wird geholt."
            node scripts/umzug-supabase.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -3
          fi

      # Sammeln, auswerten, hochladen - in einer Schleife, solange ein Cup
      # laeuft. Ein Match ist damit ein bis drei Minuten nach seinem Ende in
      # der Ablage statt zehn bis siebzehn. Das Protokoll der Schleife liegt
      # unter data/replays/_live-lauf.json und wird mit hochgeladen.
      - name: Sammeln, solange ein Cup laeuft
        if: steps.pruefung.outputs.weiter == 'ja'
        continue-on-error: true
        env:
          WERKZEUG_URL: https://www.thecomphub.com
        run: node scripts/replays-live-schleife.mjs --minuten 330 --takt 60

      # Die Zugangsdaten ganz zum Schluss, nicht vorher.
      #
      # Sie standen bisher VOR dem Hochladen - und weil das Skript sie aus
      # .env.local liest, scheiterte jeder Lauf genau an dieser Stelle.
      # Sichtbar war das nur an der Bilanz der Aktion: Schritt eins bis zehn
      # gruen, Schritt elf rot, und zwar sechs Laeufe hintereinander.
      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local
