# Vergleichsrecherche (Betreiber, 15.11.2026): fremde Statistikseiten im echten Browser ansehen - Bilder, Klicks, JSON-Antworten.
# Die Sandbox kommt nicht an fremde Seiten, der Runner schon. Ergebnis als <name>.tar im Release "medien".
# Skript: tools/fremd-ansehen/ansehen.mjs
name: Fremd ansehen
on:
  workflow_dispatch:
    inputs:
      start: { description: 'Start-Adressen (Leerzeichen)', required: true }
      name: { description: 'Dateiname im Release medien', required: false, default: 'fremd-ansehen' }
  push:
    branches: [turnier-leader]
    paths: [.github/workflows/fremd-ansehen.yml, tools/fremd-ansehen/start.txt]
permissions:
  contents: write
jobs:
  ansehen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.62.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Ansehen
        env:
          START: ${{ inputs.start }}
        run: |
          cp tools/fremd-ansehen/ansehen.mjs /tmp/pw/
          S="$START"; [ -n "$S" ] || S="$(cat tools/fremd-ansehen/start.txt)"
          cd /tmp/pw && xvfb-run -a node ansehen.mjs --aus "$GITHUB_WORKSPACE/fremd" --start "$S" || true
      - name: Hochladen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name || 'fremd-ansehen' }}
        run: |
          [ -d fremd ] || exit 0
          ls fremd | head -100; du -sh fremd
          tar -cf "$NAME.tar" fremd
          gh release upload medien "$NAME.tar" --clobber
