# Das Image des XMPP-Dienstes (Dockerfile.xmpp) - NUR wenn sich der Dienst aendert. So bleibt ghcr.io/comphubgg/comphub-web:xmpp bei jedem
# gewoehnlichen Update der Seite gleich, und der Server startet den Dienst "xmpp" (deploy/server-compose.yml) nicht neu: die Verbindung zu Epic,
# ueber die die Match-IDs kommen, bleibt stehen (Betreiber, Heat 2 am 15.11.2026: nach jedem Update minutenlang keine Match-IDs).
name: XMPP-Dienst als Image bauen

on:
  push:
    branches: [main]
    paths:
      - 'scripts/xmpp-dienst.mjs'
      - 'lib/freundAnnahme.mjs'
      - 'Dockerfile.xmpp'
      - '.github/workflows/xmpp-image.yml'
  workflow_dispatch:

concurrency:
  group: xmpp-image
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.xmpp
          push: true
          tags: |
            ghcr.io/comphubgg/comphub-web:xmpp
            ghcr.io/comphubgg/comphub-web:xmpp-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/comphubgg/CompHub
