# X-, Twitch-Konten und Flaggen der wichtigen Spieler suchen (scripts/socials-finden.mjs, lib/socialsFinder.mjs) - Ergebnis in /admin/flaggen.
#
#   plan       suchen, nichts schreiben
#   anwenden   suchen; stark Belegtes in LEERE Felder von spieler-profile.json (protokolliert in socials-auto.json), der Rest als Vorschlag
#              (socials-vorschlaege.json); setzt fort, wo der letzte Lauf aufhoerte (socials-geprueft.json)
#   probe      blind an Spielern mit bekanntem X/Twitch messen (schreibt nichts)
#   endpunkte  die Schnittstellen einmal ansehen
# Zeitplan: taeglich 02:41 UTC mit "anwenden" (hoechstens fuenf Stunden, eine Anfrage je Sekunde und Host).
# Das Ergebnis steht als JSON im Protokoll (Zeile ERGEBNIS_B64, gzip + base64).

name: Socials finden

on:
  schedule:
    - cron: '41 2 * * *'
    - cron: '41 13 * * *'   # Ersatz, falls 02:41 wegen eines grossen Cups wartete (Vorrang, siehe unten)
  workflow_dispatch:
    inputs:
      modus:
        description: 'plan | anwenden | probe | endpunkte'
        type: choice
        default: plan
        options: [plan, anwenden, probe, endpunkte]
      minuten:
        description: 'Budget in Minuten'
        type: string
        default: '300'
      nur:
        description: 'Nur diese Epic-Ids (Komma; "id=Name" fuer Spieler ausserhalb der Kernliste)'
        type: string
        default: ''
      region:
        description: 'Region fuer --nur-Spieler ausserhalb der Kernliste (EU, NAC ...)'
        type: string
        default: ''
      probe:
        description: 'Probe: wie viele Spieler'
        type: string
        default: '30'
      versatz:
        description: 'Probe: andere Auswahl (0, 1, 2 ...)'
        type: string
        default: '0'

concurrency:
  group: socials-finden
  cancel-in-progress: false

jobs:
  # Vorrang fuer grosse Cups (16.11.2026): laeuft ein grosser Cup (FNCS, Cash, Performance Evaluation ...) oder endete er vor hoechstens einer Stunde,
  # belegt ein geplanter (oder per Push angestossener) Lauf keinen der 20 Rechner - die volle Auswertung des Cups (clutch-rechnen.yml) geht vor.
  # Von Hand angestossen laeuft er immer.
  vorrang:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      frei: ${{ steps.p.outputs.frei }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          frei=1
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            curl -sfL --max-time 20 "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/frischer-cup.mjs" -o /tmp/frisch.mjs \
              && n=$(node /tmp/frisch.mjs --gross --nach 60 || echo 0) || n=0
            if [ "${n:-0}" -gt 0 ]; then frei=0; echo "Grosser Cup laeuft oder endete vor weniger als einer Stunde ($(node /tmp/frisch.mjs --gross --nach 60 --liste)) - dieser Lauf wartet auf den naechsten Termin."; fi
            # Taeglicher Lauf mit Ersatztermin: der Ersatz nur, wenn es in den letzten 20 Stunden keinen geglueckten Suchlauf gab.
            if [ "$frei" = "1" ] && [ "${{ github.event.schedule }}" = "41 13 * * *" ]; then
              # Nur Laeufe, die wirklich suchten (laenger als 10 Minuten) - ein wartender Lauf endet ebenfalls mit "success".
              letzt=$(gh run list -R "${{ github.repository }}" -w "${{ github.workflow }}" -s success -L 10 --json createdAt,updatedAt -q '[.[] | select(((.updatedAt | fromdate) - (.createdAt | fromdate)) > 600)][0].createdAt // empty' 2>/dev/null)
              if [ -n "$letzt" ] && [ $(( $(date +%s) - $(date -d "$letzt" +%s) )) -lt 72000 ]; then frei=0; echo "Heute schon gelaufen - Ersatztermin nicht noetig."; fi
            fi
          fi
          echo "frei=$frei" >> "$GITHUB_OUTPUT"

  finden:
    needs: vorrang
    if: needs.vorrang.outputs.frei == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tail -2
      - name: Suchen
        env:
          # Das Archiv (comphub-daten) mit dem GITHUB_TOKEN aus ENV_LOCAL, wie scripts/x-handles.mjs (lib/ablageGitDaten).
          COMPHUB_ABLAGE: github
          # Als Umgebung statt im Befehl: Namen in "id=Name" duerfen Leerzeichen haben.
          NUR: ${{ inputs.nur }}
          REGION: ${{ inputs.region }}
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          mkdir -p aus
          MODUS="${{ inputs.modus || 'anwenden' }}"
          MIN="${{ inputs.minuten || '300' }}"
          case "$MODUS" in
            anwenden)  ARGS="--anwenden --minuten $MIN" ;;
            plan)      ARGS="--minuten $MIN" ;;
            probe)     ARGS="--probe ${{ inputs.probe || '30' }} --versatz ${{ inputs.versatz || '0' }}" ;;
            endpunkte) ARGS="--endpunkte bugha bugha" ;;
          esac
          echo "Modus $MODUS: $ARGS${NUR:+ --nur ($(echo "$NUR" | tr ',' '\n' | grep -c .) Konten)}${REGION:+ --region $REGION}"
          set +e
          node scripts/socials-finden.mjs $ARGS ${NUR:+--nur "$NUR"} ${REGION:+--region "$REGION"} > aus/ergebnis.json
          rc=$?
          rm -f .env.local
          echo "ERGEBNIS_B64 $(gzip -9c aus/ergebnis.json | base64 -w0)"
          exit $rc
