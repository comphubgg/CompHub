# Der Spieler-Kreis (scripts/spieler-kreis.mjs): alle sechs Stunden aus allen Bestenlisten ein Profil fuer jeden, der regelmaessig gut platziert ist.

name: Spieler-Kreis

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/spieler-kreis.yml'
      - 'scripts/spieler-kreis.mjs'
      - 'scripts/prospects.mjs'
      - 'scripts/flaggen-wichtig.mjs'
      - 'lib/flaggenWichtig.mjs'

concurrency:
  group: spieler-kreis
  cancel-in-progress: false

jobs:
  # Vorrang fuer grosse Cups (16.11.2026): laeuft ein grosser Cup (FNCS, Cash, Performance Evaluation ...) oder endete er vor hoechstens einer Stunde,
  # belegt ein geplanter Lauf keinen der 20 Rechner - die volle Auswertung des Cups (clutch-rechnen.yml) geht vor. Von Hand angestossen laeuft er immer.
  vorrang:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      frei: ${{ steps.p.outputs.frei }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          frei=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            curl -sfL --max-time 20 "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/frischer-cup.mjs" -o /tmp/frisch.mjs \
              && n=$(node /tmp/frisch.mjs --gross --nach 60 || echo 0) || n=0
            if [ "${n:-0}" -gt 0 ]; then frei=0; echo "Grosser Cup laeuft oder endete vor weniger als einer Stunde ($(node /tmp/frisch.mjs --gross --nach 60 --liste)) - dieser Lauf wartet auf den naechsten Termin."; fi
          fi
          echo "frei=$frei" >> "$GITHUB_OUTPUT"

  kreis:
    needs: vorrang
    if: needs.vorrang.outputs.frei == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      # Dazu Epics Power Ranking (nur zum Anzeigen bei den Prospects) und die Verdienst-Akte (wer schon etabliert ist); Szene-Liste und LAN-Konten fuer die
      # wichtigen Spieler (/admin/flaggen).
      - name: Bestenlisten, Namen und Power Ranking vom Release
        run: |
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner clutch epic-namen.json power-rankings/global.json verdienst-archiv.json szene-quelle/spielerliste.json lan-konten.json 2>&1 | tail -3
          du -sh data/epic-spieltage data/clutch 2>/dev/null || true

      # Das alte Archiv bis 2019 (je Spieltag die besten 500), einmal vom Rechner des Betreibers ans Release gelegt.
      - name: Altes Archiv
        continue-on-error: true
        run: curl -fsSL "https://github.com/${{ github.repository }}/releases/download/daten-spieltage-alt/epic-spieltage-alt.tar.gz" | tar xz -C data

      - name: Rechnen
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -1
          node --max-old-space-size=6000 scripts/spieler-kreis.mjs
          # Die wichtigen Spieler fuer /admin/flaggen (spieler-kreis/_wichtig.json) - nach dem Kreis, der den Ordner neu anlegt.
          node --max-old-space-size=6000 scripts/flaggen-wichtig.mjs || echo "flaggen-wichtig gescheitert - der Kreis geht trotzdem hinaus"
          # Die Prospects (spieler-kreis/_prospects.json) aus dem Turnierverlauf aller Konten (Release daten-verlauf) - ebenfalls nach dem Kreis.
          node scripts/prospects.mjs --holen && node --max-old-space-size=4000 scripts/prospects.mjs || echo "Prospects gescheitert - der Kreis geht trotzdem hinaus"
          rm -f .env.local

      - name: Ans Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ablage-github.mjs --nur spieler-kreis 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -8
