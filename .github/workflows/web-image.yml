# Die Seite als Docker-Image bauen und veroeffentlichen (Dockerfile.web).
#
# Seit Vercel die Seite am 27.9.2026 gesperrt hat (Rechenzeit des kostenlosen
# Tarifs aufgebraucht), laeuft sie auf einem anderen, dauerhaft kostenlosen
# Host. Der baut nicht selbst - ein Next-Build braucht mehrere Gigabyte
# Speicher, ein kostenloser Server hat 512 MB. Gebaut wird hier, bei jedem
# Push auf main; das fertige Image liegt unter
#   ghcr.io/comphubgg/comphub-web:latest
# Ist das Geheimnis RENDER_DEPLOY_HOOK gesetzt, bekommt Render danach
# Bescheid und holt das neue Image.
#
# Im Image steckt nichts Geheimes (siehe Dockerfile.web und .dockerignore).

name: Seite als Image bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: web-image
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/comphubgg/comphub-web:latest
            ghcr.io/comphubgg/comphub-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/comphubgg/CompHub
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render Bescheid geben
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Render: neues Image angefordert"
          else
            echo "Kein RENDER_DEPLOY_HOOK - nur gebaut."
          fi
