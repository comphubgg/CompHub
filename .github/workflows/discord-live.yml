# #live-now im Discord: wer von den CompHub-VIPs gerade auf Twitch live ist.
#
# Alle zehn Minuten, klein und ohne Bau: scripts/live-discord.mjs fragt die
# VIPs der Startseite ab, dann Twitch, und schreibt oder beendet die
# Meldungen im Kanal. Der Kanal ist das Gedaechtnis, eine Ablage braucht es
# nicht.

name: Discord live

on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    # Fuer den Anstoss des naechsten Laufs (letzter Schritt).
    permissions:
      contents: read
      actions: write
    timeout-minutes: 15
    concurrency:
      group: discord-live
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # lib fuer die Regeln, welche Cups Replays bekommen (lib/replayRegel.mjs, Schritt "Replays schnell anstossen").
          sparse-checkout: |
            scripts
            lib

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Live melden
        run: |
          printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
          set +e
          node scripts/live-discord.mjs
          rc=$?
          rm -f .env.local
          exit $rc

      # Der kostenlose Host legt die Seite nach 15 Minuten ohne Besuch
      # schlafen; dieser Aufruf alle zehn Minuten haelt sie wach. Dazu einmal
      # am Tag (07:0x UTC) die abgelaufenen VIP-Zugaenge - das tat vorher
      # Vercels Zeitplan (vercel.json).
      - name: Seite wach halten
        if: always()
        run: |
          curl -s -o /dev/null -w "Seite: %{http_code} %{time_total}s\n" -m 90 "https://www.thecomphub.com/api/auth/verify?wach=$(date +%s)" || true
          # Zu jedem seit einer halben Stunde beendeten Spieltag den fertigen Ergebnis-Post anlegen (lib/ergebnisPosts) - alle zehn Minuten.
          GEHEIM_E=$(printf '%s' "${{ secrets.ENV_LOCAL }}" | grep '^CRON_SECRET=' | cut -d= -f2- | tr -d '"\r')
          # Ohne CRON_SECRET in der Umgebung gilt der Bot-Schluessel - die Seite nimmt beide (app/api/cron/*).
          [ -z "$GEHEIM_E" ] && GEHEIM_E=$(printf '%s' "${{ secrets.ENV_LOCAL }}" | grep '^DISCORD_BOT_TOKEN=' | cut -d= -f2- | tr -d '"\r')
          curl -s -w ' [Ergebnis-Posts: %{http_code}]' -m 150 -H "Authorization: Bearer $GEHEIM_E" "https://www.thecomphub.com/api/cron/ergebnis-posts" || true
          echo
          # Neue Cups im Katalog als Beitrag mit Grafik nach #news (lib/newsPosts) - alle zehn Minuten.
          curl -s -w ' [News: %{http_code}]' -m 150 -H "Authorization: Bearer $GEHEIM_E" "https://www.thecomphub.com/api/cron/news" || true
          echo
          # Wer neu auf den Discord-Server gekommen ist: Willkommensnachricht privat und eine Meldung in #admin-joins (lib/discord willkommenLauf) - alle zehn Minuten.
          curl -s -w ' [Willkommen: %{http_code}]' -m 150 -H "Authorization: Bearer $GEHEIM_E" "https://www.thecomphub.com/api/cron/willkommen" || true
          echo
          # Turnierkarten der grossen Finals von selbst (lib/kartenAutomatik): ab dem Ende der offenen Runde alle zehn Minuten neu, zehn Minuten nach Beginn ein letztes Mal - alle zehn Minuten.
          curl -s -w ' [Turnierkarten: %{http_code}]' -m 290 -H "Authorization: Bearer $GEHEIM_E" "https://www.thecomphub.com/api/cron/karten-automatik" || true
          echo
          if [ "$(date -u +%H)" = "07" ] && [ "$(date -u +%M)" -lt 10 ]; then
            GEHEIM=$(printf '%s' "${{ secrets.ENV_LOCAL }}" | grep '^CRON_SECRET=' | cut -d= -f2- | tr -d '"\r')
            [ -z "$GEHEIM" ] && GEHEIM=$GEHEIM_E
            curl -s -o /dev/null -w "VIP-Ablauf: %{http_code}\n" -m 120 -H "Authorization: Bearer $GEHEIM" "https://www.thecomphub.com/api/cron/vip-ablauf" || true
            # Neue Kartenversionen bei fortnite.gg suchen (lib/kartenUpdates) - taeglich, ein Fund geht als Meldung an den Admin.
            curl -s -w ' [Karten-Updates: %{http_code}]' -m 120 -H "Authorization: Bearer $GEHEIM" "https://www.thecomphub.com/api/cron/karten-updates" || true
            echo
            # Die Posts des Tages anlegen und dem Admin in #admin-posts melden (lib/tagesposts) - einmal am Tag, ein zweiter Lauf aendert nichts.
            curl -s -w ' [Tagesposts: %{http_code}]' -m 120 -H "Authorization: Bearer $GEHEIM" "https://www.thecomphub.com/api/cron/posts" || true
            echo
          fi

      # CompHub auf neuen Discord-Servern einrichten (Kanal #comphub-dashboard) und Live-Meldungen von POVs
      # abraeumen, die nicht mehr senden (lib/discordGilden.ts).
      - name: Discord-Server einrichten
        if: always()
        continue-on-error: true
        run: |
          GEHEIM=$(printf '%s' "${{ secrets.ENV_LOCAL }}" | grep '^DISCORD_BOT_TOKEN=' | cut -d= -f2- | tr -d '"\r')
          curl -s -w ' [Discord-Server: %{http_code}]' -m 90 -H "Authorization: Bearer $GEHEIM" "https://www.thecomphub.com/api/cron/discord-gilden" || true
          echo

      # Die Wache fuer die Statistik: laeuft der stuendliche Datenlauf nicht mehr durch, merkt es sonst niemand -
      # am 11.10.2026 starb er fuenfmal hintereinander, und die Statistik der letzten Cups stand stundenlang still.
      # Ist der letzte erfolgreiche Lauf aelter als sechs Stunden, kommt eine Meldung in #admin-alarm (hoechstens
      # alle sechs Stunden, nur im ersten Lauf dieser Stunde).
      - name: Statistik-Wache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STUNDE=$(date -u +%H); MINUTE=$(date -u +%M)
          if [ $((10#$STUNDE % 6)) -ne 0 ] || [ "$MINUTE" -ge 10 ]; then echo "keine Wachzeit"; exit 0; fi
          LETZT=$(gh run list -R "${{ github.repository }}" --workflow daten-erneuern.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt')
          [ -z "$LETZT" ] && LETZT="1970-01-01T00:00:00Z"
          ALTER=$(( ( $(date -u +%s) - $(date -u -d "$LETZT" +%s) ) / 3600 ))
          echo "Letzter erfolgreicher Datenlauf: $LETZT (vor $ALTER Stunden)"
          if [ "$ALTER" -ge 6 ]; then
            printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local
            node scripts/discord-update.mjs --ziel alarm --art behoben --titel "Datenlauf steht seit $ALTER Stunden" --text "Der stuendliche Lauf Daten erneuern war zuletzt am $LETZT erfolgreich. Seitdem kommen keine neuen Statistiken auf die Seite. Schau bei GitHub unter Actions nach dem Schritt, der scheitert." || true
            rm -f .env.local
          fi

      # Die Schnellspur der Replays (replays-schnell.yml): solange ein Cup laeuft oder eben zu Ende ging, alle zehn Minuten ein
      # Anstoss - ihr eigener Zeitplan wuerde von GitHub ebenso uebergangen wie der von "Replays live" (29.10.2026).
      - name: Replays schnell anstossen
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/replays-schnell-anstossen.mjs
          if grep -q '^anstossen=ja' "$GITHUB_OUTPUT" 2>/dev/null; then
            gh workflow run replays-schnell.yml -R "${{ github.repository }}" --ref main && echo "Schnellspur angestossen"
          fi

      # GitHub liess den Zeitplan am 28.9.2026 sieben Stunden lang ausfallen.
      # Jeder Lauf stoesst deshalb nach zehn Minuten den naechsten selbst an;
      # der Zeitplan oben bleibt als Rueckfall. Der Lauf sagt es mit "Kette".
      - name: Naechsten Lauf anstossen
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 540
          gh workflow run discord-live.yml -R "${{ github.repository }}" --ref main && echo "Kette: naechster Lauf angestossen"
