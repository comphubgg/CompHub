# Die Seite bei Netlify bereitstellen - gebaut auf einem Linux-Rechner von GitHub.
#
# Der Betreiber (11.10.2026): Render hat den kostenlosen Datenverkehr gesperrt, und die Seite soll
# jetzt wieder erreichbar sein. Netlify hat die Seite "thecomphub" schon, mit der Domain. Die eigenen
# Aufbauten von Netlify scheiterten ohne lesbare Fehlermeldung; hier laeuft derselbe Bau mit dem
# Netlify-Werkzeug, und das Protokoll steht in diesem Lauf. Auf dem Windows-Rechner des Betreibers
# geht der Bau nicht (Netlify legt Verknuepfungen an, die Windows verbietet).
#
# Die Einstellungen der Seite (Zugangsdaten) liegen bei Netlify selbst und werden beim Bau von dort geholt.
# Netlify baut nicht mehr von selbst bei jedem Push (das kostet je Bau 15 Punkte von 300 im Monat);
# gebaut wird nur auf Anstoss hier.
#
#   ziel = entwurf   Testadresse, ohne die Domain anzufassen
#   ziel = live      veroeffentlichen
#   konto = 1|2      welches Netlify-Konto (Betreiber, 11.10.2026: "wenn es sein muss, zwei Netlify-Konten"):
#                    1 = NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID, 2 = NETLIFY_AUTH_TOKEN_2 / NETLIFY_SITE_ID_2.
#                    Die Einstellungen der Seite (Zugangsdaten) legt der Betreiber bei der neuen Netlify-Seite
#                    selbst an (Site configuration > Environment variables > Import from a .env file).

name: Netlify bereitstellen

on:
  # Jeden Montag fruehmorgens der aktuelle Stand (live): so ist die Seite nie lange hinter dem Code,
  # und es kostet nur vier, fuenf Baeue im Monat (je 15 von 300 Punkten).
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      ziel:
        description: 'entwurf (Testadresse) oder live'
        required: true
        default: 'entwurf'
        type: choice
        options: [entwurf, live]
      konto:
        description: 'Netlify-Konto: 1 oder 2'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']

concurrency:
  group: netlify
  cancel-in-progress: false

jobs:
  bereitstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Der Montagslauf stellt beide Konten bereit (Betreiber, 12.10.2026: die Last auf zwei Konten teilen, damit ein
    # Konto nicht wieder allein die Punkte verbraucht); ein Handstart nur das gewaehlte. Faellt eines aus (Punkte
    # aufgebraucht), laeuft das andere trotzdem durch.
    strategy:
      fail-fast: false
      matrix:
        konto: ${{ fromJSON(github.event_name == 'schedule' && '["1","2"]' || format('["{0}"]', inputs.konto)) }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ matrix.konto == '2' && secrets.NETLIFY_AUTH_TOKEN_2 || secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ matrix.konto == '2' && secrets.NETLIFY_SITE_ID_2 || secrets.NETLIFY_SITE_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund
      - name: Bauen und hochladen
        run: |
          # Der Bau laeuft immer als Entwurf (alias probe). Netlify verweigert dem Werkzeug seit dem
          # 11.10.2026 ("Forbidden") einen Bau direkt fuer die Hauptseite, einen Entwurf nimmt es an.
          # "live" veroeffentlicht deshalb den fertigen Entwurf danach ueber die Schnittstelle (restore) -
          # derselbe Stand, ohne zweiten Bau.
          AUS=$(npx --yes netlify-cli@latest deploy --alias probe --json --message "Bereitstellung aus GitHub ${GITHUB_SHA::7}")
          echo "$AUS" | tail -n 40
          ID=$(echo "$AUS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/\"deploy_id\"\s*:\s*\"([0-9a-f]+)\"/);console.log(m?m[1]:'')})")
          echo "Entwurf: $ID"
          if [ "${{ inputs.ziel }}" != "entwurf" ]; then
            if [ -z "$ID" ]; then echo "Keine Entwurfs-Kennung gefunden"; exit 1; fi
            curl -sf -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"               "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$ID/restore" -o /dev/null
            echo "Veroeffentlicht: $ID"
          fi
