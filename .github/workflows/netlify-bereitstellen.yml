# Die Seite bei Netlify bereitstellen - gebaut auf einem Linux-Rechner von GitHub.
#
# Der Betreiber (11.10.2026): Render hat den kostenlosen Datenverkehr gesperrt, und die Seite soll
# jetzt wieder erreichbar sein. Netlify hat die Seite "thecomphub" schon, mit der Domain. Die eigenen
# Aufbauten von Netlify scheiterten ohne lesbare Fehlermeldung; hier laeuft derselbe Bau mit dem
# Netlify-Werkzeug, und das Protokoll steht in diesem Lauf. Auf dem Windows-Rechner des Betreibers
# geht der Bau nicht (Netlify legt Verknuepfungen an, die Windows verbietet).
#
# Die Einstellungen der Seite (Zugangsdaten) liegen bei Netlify selbst und werden beim Bau von dort geholt.
# Netlify baut nicht mehr von selbst bei jedem Push (das kostet je Bau 15 Punkte von 300 im Monat);
# gebaut wird nur auf Anstoss hier.
#
#   ziel = entwurf   Testadresse, ohne die Domain anzufassen
#   ziel = live      veroeffentlichen
#   konto = 1|2      welches Netlify-Konto (Betreiber, 11.10.2026: "wenn es sein muss, zwei Netlify-Konten"):
#                    1 = NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID, 2 = NETLIFY_AUTH_TOKEN_2 / NETLIFY_SITE_ID_2.
#                    Die Einstellungen der Seite (Zugangsdaten) legt der Betreiber bei der neuen Netlify-Seite
#                    selbst an (Site configuration > Environment variables > Import from a .env file).

name: Netlify bereitstellen

on:
  # Jeden Montag fruehmorgens der aktuelle Stand (live): so ist die Seite nie lange hinter dem Code,
  # und es kostet nur vier, fuenf Baeue im Monat (je 15 von 300 Punkten).
  schedule:
    # Montag und Donnerstag (Betreiber, 4.11.2026: ohne seinen PC stand die Seite auf einem alten Stand) - je Konto rund 9 Baue = 135 von 300 Punkten im Monat.
    - cron: '30 3 * * 1,4'
  workflow_dispatch:
    inputs:
      ziel:
        description: 'entwurf (Testadresse) oder live'
        required: true
        default: 'entwurf'
        type: choice
        options: [entwurf, live]
      konto:
        description: 'Netlify-Konto: 1 oder 2'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']

concurrency:
  group: netlify
  cancel-in-progress: false

jobs:
  bereitstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Der Montagslauf stellt beide Konten bereit (Betreiber, 12.10.2026: die Last auf zwei Konten teilen, damit ein
    # Konto nicht wieder allein die Punkte verbraucht); ein Handstart nur das gewaehlte. Faellt eines aus (Punkte
    # aufgebraucht), laeuft das andere trotzdem durch.
    strategy:
      fail-fast: false
      matrix:
        konto: ${{ fromJSON(github.event_name == 'schedule' && '["1","2"]' || format('["{0}"]', inputs.konto)) }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ matrix.konto == '2' && secrets.NETLIFY_AUTH_TOKEN_2 || secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ matrix.konto == '2' && secrets.NETLIFY_SITE_ID_2 || secrets.NETLIFY_SITE_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      # Die Rueckwege der Anmeldedienste sind nur mit www eingetragen (Twitch meldete sonst redirect_mismatch).
      NEXT_PUBLIC_BASE_URL: https://www.thecomphub.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund
      - name: Bauen und hochladen
        run: |
          # Der Bau laeuft immer als Entwurf (alias probe). Netlify verweigert dem Werkzeug seit dem
          # 11.10.2026 ("Forbidden") einen Bau direkt fuer die Hauptseite, einen Entwurf nimmt es an.
          # "live" veroeffentlicht deshalb den fertigen Entwurf danach ueber die Schnittstelle (restore) -
          # derselbe Stand, ohne zweiten Bau.
          # Haengengebliebene Bereitstellungen (Zustand "preparing" o. ae., z. B. nach abgebrochenem Lauf) zuerst abbrechen,
          # und den Zustand von Seite und Konto ausgeben (seit 5.11.2026 blieb jede Bereitstellung in "preparing").
          API="https://api.netlify.com/api/v1"; H="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          curl -s -H "$H" "$API/sites/$NETLIFY_SITE_ID/deploys?per_page=20" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{for(const d of JSON.parse(s))if(['new','pending_review','enqueued','preparing','prepared','uploading','uploaded','processing','building'].includes(d.state))console.log(d.id)}catch{}})" \
            | while read -r D; do echo "Breche haengende Bereitstellung ab: $D"; curl -s -o /dev/null -X POST -H "$H" "$API/deploys/$D/cancel"; done
          curl -s -H "$H" "$API/sites/$NETLIFY_SITE_ID" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s);console.log('Seite:',x.name,x.url,'Zustand:',x.state,'gesperrt:',x.disabled??x.suspended??'-',x.disabled_reason||'','Plan:',x.plan||'',x.account_slug||'')}catch{console.log(s.slice(0,400))}})"
          curl -s -H "$H" "$API/accounts" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{for(const a of JSON.parse(s))console.log('Konto:',a.slug,a.type_name||a.type||'',JSON.stringify(a.capabilities||{}).slice(0,600))}catch{console.log(s.slice(0,400))}})"
          # Bauen und Hochladen in EINEM Aufruf. Getrennt (build, dann deploy --no-build) fehlten am 9.11.2026 alle
          # CSS/JS-Dateien: das Next-Plugin stellt den Ausgabeordner nach dem Bau zurueck, das Hochladen nahm dann den falschen.
          # Netlify wartet hier hoechstens 25 Minuten, danach folgt die Zustandsausgabe.
          AUS=$(timeout 1500 npx --yes netlify-cli@27.16.2 deploy --timeout 1400 --alias probe --json --message "Bereitstellung aus GitHub ${GITHUB_SHA::7}" 2>&1) || {
            echo "$AUS" | tail -n 80
            echo "Letzte Bereitstellungen bei Netlify:"
            curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=8" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{for(const d of JSON.parse(s))console.log(d.created_at,d.state,d.context,d.branch||'',d.error_message||'')}catch(e){console.log(s.slice(0,500))}})"
            exit 1; }
          echo "$AUS" | tail -n 40
          ID=$(echo "$AUS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/\"deploy_id\"\s*:\s*\"([0-9a-f]+)\"/);console.log(m?m[1]:'')})")
          echo "Entwurf: $ID"
          if [ "${{ inputs.ziel }}" != "entwurf" ]; then
            if [ -z "$ID" ]; then echo "Keine Entwurfs-Kennung gefunden"; exit 1; fi
            # Vorher live gewesenen Stand merken: fehlen nach dem Umschalten CSS/JS, sofort dorthin zurueck.
            ALT=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).published_deploy?.id||'')}catch{console.log('')}})")
            curl -sf -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"               "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$ID/restore" -o /dev/null
            echo "Veroeffentlicht: $ID (vorher: $ALT)"
            sleep 30
            curl -s -o /tmp/h.html "$NEXT_PUBLIC_BASE_URL/events"; GES=0; OK=0
            for C in $(grep -oE '/_next/static/[^"]+\.(css|js)' /tmp/h.html | sort -u | head -15); do GES=$((GES+1)); [ "$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_BASE_URL$C")" = 200 ] && OK=$((OK+1)); done
            echo "Pruefung live: $OK von $GES Dateien laden"
            if [ "$GES" = 0 ] || [ "$OK" -lt "$GES" ]; then
              if [ -n "$ALT" ]; then curl -s -o /dev/null -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$ALT/restore"; echo "Zurueck auf $ALT"; fi
              exit 1
            fi
          fi
