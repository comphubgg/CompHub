# Volle Replays fuer JEDES Match jedes Spieltags: Schaden, Treffer, Kopftreffer, Clutch-Punkte, Zeit im Sturm, Reboots, Ueberlebenszeit, Plattform.
#
# Der Betreiber (29.9.2026): "Die Statistik soll wirklich fuer jeden einzelnen Cup sein." Und am 30.10.2026: "jede einzelne Runde analysieren ...
# alle 100 Spieler ... egal wie viele Dateien das frisst ... spaetestens, wenn der Cup um 20 Uhr geendet hat, am naechsten Tag um 13 Uhr."
#
# Bis zum 30.10.2026 gehoerte ein Spieltag einem Rechner, der ein Replay nach dem anderen las (rund 15 s je Match); grosse offene Runden bekamen deshalb
# nur die Matches der besten Teams (TOP_MAX 240). Jetzt drei Stufen (scripts/clutch-berechnen.mjs):
#   planen    welche Spieltage der letzten 31 Tage offen sind und welche Matches darin (Replay-Stand + Epics ganze Bestenliste, gemerkt in
#             clutch/_listen.json); wie viele Rechner es braucht
#   rechnen   bis zu acht Rechner; jeder nimmt von JEDEM offenen Spieltag jedes N-te Match (fest nach der Match-Id) und liest vier zugleich - ein grosser
#             Cup ist so auf alle verteilt. Frisch Beendetes zuerst (Europa vorn), dann der Rest. Lokal gemessen: 37 Matches je Minute statt 4.
#   ablegen   seit 16.11.2026 allein clutch-ablegen.yml (jeder Rechner stoesst es an, sobald sein Teil oben ist; es holt die Teile aller juengeren Runden)
# Solange etwas offen bleibt, stoesst sich der Ablauf selbst wieder an - gleich nach den Rechnern, ohne auf die Ablage zu warten (Matches, die gelesen, aber
# noch nicht abgelegt sind, plant der naechste Plan nicht noch einmal: --im-flug).
#
# Vorrang fuer grosse Cups (16.11.2026, EU LCQ: Ende 20:30 UTC, eine Runde dauerte 100 Minuten - Plan 19:15, Rechner bis 20:15, Ablage bis 20:54): laeuft ein
# grosser Cup (FNCS, Cash, Performance Evaluation ... - scripts/frischer-cup.mjs --gross) oder endete er vor hoechstens 90 Minuten, plant die Runde nur die
# Spieltage der letzten zwei Tage (kein Neu-Lesen aelterer), rechnet hoechstens 9 statt 25 Minuten mit hoechstens 14 Rechnern (Platz fuer Schnellspur,
# Sammler und Ablage unter GitHubs 20) und macht auch ohne Offenes weiter - so kommt jede neue Lobby mit der naechsten Runde dran, alle rund 15 Minuten.

# 6.11.2026: kleine Team-Spieltage der letzten Woche werden einmal neu gelesen (der Schuss, der umhaut, zaehlt jetzt als Schaden), siehe scripts/clutch-berechnen.mjs.

name: Clutch rechnen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clutch-rechnen.yml'
  schedule:
    - cron: '15 */3 * * *'   # Rueckfall, falls die Kette einmal reisst

concurrency:
  group: clutch-rechnen
  cancel-in-progress: false

jobs:
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      rechner: ${{ steps.plan.outputs.rechner }}
      anzahl: ${{ steps.plan.outputs.anzahl }}
      offen: ${{ steps.plan.outputs.offen }}
      vorrang: ${{ steps.vorrang.outputs.vorrang }}
      minuten: ${{ steps.vorrang.outputs.minuten }}
    steps:
      # Vorrang fuer frische Cups (Betreiber, 14.11.2026: "eine Warteschlange darf nicht sein ... instant nach dem Cup"). GitHub laesst hoechstens 20 Rechner
      # gleichzeitig laufen; nach Heat 1 wartete die Auswertung, weil Nacharbeit, Stundenlauf & Co. die Plaetze belegten. Laeuft gerade ein Cup oder ging
      # vor kurzem zu Ende (Katalog, scripts/frischer-cup.mjs), werden diese Nebenlaeufe abgebrochen - sie starten nach Zeitplan von selbst neu und holen nach.
      - name: Platz schaffen fuer frische Cups
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          frisch=$(curl -sfL --max-time 20 "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/frischer-cup.mjs" -o /tmp/frisch.mjs && node /tmp/frisch.mjs || echo 0)
          echo "Frische Spieltage (laufend oder bis 3 h vorbei): $frisch"
          if [ "${frisch:-0}" -gt 0 ]; then
            # daten-erneuern NICHT (15.11.2026): fast immer laeuft irgendwo ein Cup, der Stundenlauf wurde so zehn Stunden lang jedes Mal abgebrochen
            # und die Seite bekam keine neuen Statistiken (Alarm "Datenlauf steht seit 10 Stunden").
            for wf in replays-nacharbeiten.yml replays-schlank.yml eigene-auswerten.yml twitch-statistik.yml; do
              for id in $(gh run list -R "${{ github.repository }}" -w "$wf" -s in_progress --json databaseId -q '.[].databaseId' 2>/dev/null); do
                gh run cancel -R "${{ github.repository }}" "$id" && echo "Platz geschaffen: $wf ($id)"
              done
            done
          else
            echo "Kein frischer Cup - Nebenlaeufe bleiben."
          fi

      - uses: actions/checkout@v4

      # Grosser Cup laeuft oder endete vor hoechstens 90 Minuten? Dann kurze Runden nur fuer Frisches (siehe oben).
      - name: Vorrang fuer einen grossen Cup?
        id: vorrang
        run: |
          n=$(node scripts/frischer-cup.mjs --gross --nach 90 || echo 0)
          echo "Grosse Cups (laufend oder bis 90 Minuten vorbei): $n $(node scripts/frischer-cup.mjs --gross --nach 90 --liste || true)"
          if [ "${n:-0}" -gt 0 ]; then echo "vorrang=1" >> "$GITHUB_OUTPUT"; echo "minuten=9" >> "$GITHUB_OUTPUT"; else echo "vorrang=0" >> "$GITHUB_OUTPUT"; echo "minuten=25" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Epic-Anmeldung und Stand vom Release
        run: |
          # Wann der Stand geholt wurde - ein Neuanfang, den dieser Plan verlangt, gilt nur, wenn der Stand am Release davor anfing (scripts/clutch-zusammen.mjs).
          echo "CLUTCH_STAND_ZEIT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
          # replays/S43 ausdruecklich: "replays" allein ist das alte Release. Ohne den Stand der laufenden Season kannte der Plan einen Cup erst, wenn der Stundenlauf ihn unter die
          # Epic-Spieltage geschrieben hatte (7.11.2026: der Trios Cash Cup war eine Stunde nach dem Ende noch in keinem Plan).
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner clutch --ordner clutch-umbau --ordner replays --ordner replays/S43 --ordner replays/S44 2>&1 | tail -3

      # Was juengere Runden gelesen haben, aber noch nicht abgelegt ist (Marke clutch/_teile-abgelegt.json) - wird nicht noch einmal geplant.
      - name: Unterwegs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/clutch-teile-holen.mjs --ziel data/clutch-flug --stunden 3 2>&1 | tail -5

      - name: Planen
        id: plan
        env:
          # 20 (9.11.2026): Squads Victory Cup + zwei Duos-Reload-Ranked am selben Abend = 15.681 Matches; mit 12 Rechnern a 12 Minuten waren es rund fuenf Runden.
          # 14 bei Vorrang (16.11.2026): mit 20 warteten bei der EU LCQ drei Rechner 27 Minuten auf einen Platz (Schnellspur, Sammler, Stundenlauf, Ablage) - und
          # mit ihnen die ganze Runde.
          CLUTCH_RECHNER: ${{ steps.vorrang.outputs.vorrang == '1' && '14' || '20' }}
          CLUTCH_VORRANG: ${{ steps.vorrang.outputs.vorrang }}
        run: node scripts/clutch-berechnen.mjs --plan data/clutch-plan.json --minuten 40 --im-flug data/clutch-flug 2>&1 | tail -25

      - name: Plan weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: clutch-plan
          path: |
            data/clutch-plan.json
            data/clutch/_listen.json
          retention-days: 2

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local

  rechnen:
    needs: planen
    if: needs.planen.outputs.rechner != '' && needs.planen.outputs.rechner != '[]'
    runs-on: ubuntu-latest
    # 45 statt 330 (8.11.2026): ein Rechner hing fuenf Stunden an einem Match fest (die anderen elf waren nach 14 Minuten fertig). Solange er lief, wartete
    # jeder neue Durchgang - und wurde vom naechsten ersetzt. Der Middle-East-Cup stand drei Stunden nach dem Ende bei 1311 von 1451 Matches.
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        teil: ${{ fromJSON(needs.planen.outputs.rechner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      # Der eigene Leser (tools/replay-voll): Schaden, Treffer, Sturmzeit, Reboots, Kill-Feed, Plattform.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -3

      - name: Epic-Anmeldung
        run: node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2

      - uses: actions/download-artifact@v4
        with:
          name: clutch-plan
          path: data

      - name: Rechnen
        continue-on-error: true
        timeout-minutes: 40
        env:
          # 12 (7.11.2026): ein Replay braucht ~7 s Download (220 kleine Anfragen, wartet aufs Netz); der Leser im Dauerlauf schafft auf vier Kernen rund alle 0,7 s eines. Weniger Downloads liessen ihn warten.
          CLUTCH_GLEICHZEITIG: '12'
        run: |
          # 12 statt 295 Minuten (7.11.2026): abgelegt wird erst nach dem letzten Rechner. Der Trios Cash Cup endete um 18 Uhr, der laufende Durchgang brauchte fuer 148 alte Matches noch
          # fast eine Stunde, und erst dann kam der Cup dran. Kurze Runden heissen: frische Cups sind schnell an der Reihe, und Damage und Clutch wachsen waehrend des Lesens.
          # Hart nach 22 Minuten beenden: --minuten prueft nur zwischen den Matches, ein haengendes Match hielt den Rechner sonst fest.
          # --minuten aus dem Plan: 25, bei Vorrang fuer einen grossen Cup 9 (die naechste Runde holt die neuen Lobbys).
          M=${{ needs.planen.outputs.minuten || 25 }}
          timeout --signal=TERM --kill-after=60 $((M + 9))m node scripts/clutch-berechnen.mjs --verteilt --aus-plan data/clutch-plan.json \
            --teil ${{ matrix.teil }}/${{ needs.planen.outputs.anzahl }} --minuten $M 2>&1 | awk '!/^    [0-9a-f]{32}:/ || n++ < 20' | tail -80

      - name: Teilstand weitergeben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clutch-teil-${{ matrix.teil }}
          path: data/clutch-teil/
          if-no-files-found: ignore
          retention-days: 2

      # Fertig heisst: sofort auf die Seite, nicht erst, wenn der letzte Rechner durch ist (siehe clutch-ablegen.yml).
      - name: Gleich auf die Seite
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run clutch-ablegen.yml -R "${{ github.repository }}" --ref main -f lauf=${{ github.run_id }} && echo "abgelegt wird gleich"

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local

  # Solange etwas offen blieb, gleich weiter - ohne auf die Ablage zu warten (16.11.2026). Bei Vorrang fuer einen grossen Cup auch ohne Offenes: neue Lobbys
  # kommen laufend dazu, und nach dem Ende soll die letzte Runde sofort kommen, nicht erst mit dem Rueckfall alle drei Stunden.
  weiter:
    needs: [planen, rechnen]
    if: always() && !cancelled() && needs.planen.result == 'success' && ((needs.planen.outputs.offen != '' && needs.planen.outputs.offen != '0') || needs.planen.outputs.vorrang == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Weitermachen, solange etwas offen ist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nichts offen (nur Vorrang): zwei Minuten Luft, damit nicht im Sekundentakt geplant wird.
          if [ "${{ needs.planen.outputs.offen }}" = "0" ]; then sleep 120; fi
          gh workflow run clutch-rechnen.yml -R "${{ github.repository }}" --ref main \
            && echo "Noch offen (${{ needs.planen.outputs.offen }} beim Planen) - naechster Durchgang angestossen."
