# Volle Replays fuer JEDES Match jedes Spieltags: Schaden, Treffer, Kopftreffer, Clutch-Punkte, Zeit im Sturm, Reboots, Ueberlebenszeit, Plattform.
#
# Der Betreiber (29.9.2026): "Die Statistik soll wirklich fuer jeden einzelnen Cup sein." Und am 30.10.2026: "jede einzelne Runde analysieren ...
# alle 100 Spieler ... egal wie viele Dateien das frisst ... spaetestens, wenn der Cup um 20 Uhr geendet hat, am naechsten Tag um 13 Uhr."
#
# Bis zum 30.10.2026 gehoerte ein Spieltag einem Rechner, der ein Replay nach dem anderen las (rund 15 s je Match); grosse offene Runden bekamen deshalb
# nur die Matches der besten Teams (TOP_MAX 240). Jetzt drei Stufen (scripts/clutch-berechnen.mjs):
#   planen    welche Spieltage der letzten 31 Tage offen sind und welche Matches darin (Replay-Stand + Epics ganze Bestenliste, gemerkt in
#             clutch/_listen.json); wie viele Rechner es braucht
#   rechnen   bis zu acht Rechner; jeder nimmt von JEDEM offenen Spieltag jedes N-te Match (fest nach der Match-Id) und liest vier zugleich - ein grosser
#             Cup ist so auf alle verteilt. Frisch Beendetes zuerst (Europa vorn), dann der Rest. Lokal gemessen: 37 Matches je Minute statt 4.
#   ablegen   ein einziger Rechner arbeitet die Teilstaende in den Stand vom Release ein (scripts/clutch-zusammen.mjs) und laedt hoch
# Solange etwas offen bleibt, stoesst sich der Ablauf selbst wieder an.

name: Clutch rechnen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clutch-rechnen.yml'
  schedule:
    - cron: '15 */3 * * *'   # Rueckfall, falls die Kette einmal reisst

concurrency:
  group: clutch-rechnen
  cancel-in-progress: false

jobs:
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      rechner: ${{ steps.plan.outputs.rechner }}
      anzahl: ${{ steps.plan.outputs.anzahl }}
      offen: ${{ steps.plan.outputs.offen }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Epic-Anmeldung und Stand vom Release
        run: |
          node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2
          node scripts/ablage-github-holen.mjs --ordner epic-spieltage --ordner clutch --ordner replays 2>&1 | tail -3

      - name: Planen
        id: plan
        env:
          CLUTCH_RECHNER: '8'
        run: node scripts/clutch-berechnen.mjs --plan data/clutch-plan.json --minuten 40 2>&1 | tail -25

      - name: Plan weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: clutch-plan
          path: |
            data/clutch-plan.json
            data/clutch/_listen.json
          retention-days: 2

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local

  rechnen:
    needs: planen
    if: needs.planen.outputs.rechner != '' && needs.planen.outputs.rechner != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        teil: ${{ fromJSON(needs.planen.outputs.rechner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Zugangsdaten
        run: printf '%s' "${{ secrets.ENV_LOCAL }}" > .env.local

      # Der eigene Leser (tools/replay-voll): Schaden, Treffer, Sturmzeit, Reboots, Kill-Feed, Plattform.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Leser bauen
        run: dotnet build tools/replay-voll -c Release -v q 2>&1 | tail -3

      - name: Epic-Anmeldung
        run: node scripts/daten-sync.mjs --herunterladen --nur epic-auth.json 2>&1 | tail -2

      - uses: actions/download-artifact@v4
        with:
          name: clutch-plan
          path: data

      - name: Rechnen
        continue-on-error: true
        timeout-minutes: 310
        env:
          CLUTCH_GLEICHZEITIG: '4'
        run: |
          node scripts/clutch-berechnen.mjs --verteilt --aus-plan data/clutch-plan.json \
            --teil ${{ matrix.teil }}/${{ needs.planen.outputs.anzahl }} --minuten 295 2>&1 | grep -v '^    [0-9a-f]\{32\}:' | tail -60

      - name: Teilstand weitergeben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clutch-teil-${{ matrix.teil }}
          path: data/clutch-teil/
          if-no-files-found: ignore
          retention-days: 2

      - name: Zugangsdaten wieder weg
        if: always()
        run: rm -f .env.local

  ablegen:
    needs: [planen, rechnen]
    if: always() && !cancelled() && needs.planen.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --omit=optional

      - name: Stand vom Release
        run: node scripts/ablage-github-holen.mjs --ordner clutch --ordner clutch-roh 2>&1 | tail -3

      # Die gemerkten Match-Listen des Planers.
      - uses: actions/download-artifact@v4
        with:
          name: clutch-plan
          path: data

      - name: Teilstaende zusammenholen
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: clutch-teil-*
          path: data/clutch-teil
          merge-multiple: true

      - name: Zusammenfuehren
        run: node scripts/clutch-zusammen.mjs

      - name: Clutch aus den Rohdaten nach der aktuellen Regel
        continue-on-error: true
        run: node scripts/clutch-neu-rechnen.mjs
      - name: Ueberlebenszeit aus den Rohdaten
        continue-on-error: true
        run: node scripts/clutch-leben.mjs
      - name: Ans Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls data/clutch | wc -l
          node scripts/ablage-github.mjs --nur clutch --nur clutch-roh 2>&1 | tr '\r' '\n' | awk 'NR % 25 == 1 || !/^ *[0-9]+\/[0-9]+ /' | tail -12

  # Solange etwas offen blieb, gleich weiter.
  weiter:
    needs: [planen, rechnen, ablegen]
    if: always() && !cancelled() && needs.planen.outputs.offen != '' && needs.planen.outputs.offen != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Weitermachen, solange etwas offen ist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run clutch-rechnen.yml -R "${{ github.repository }}" --ref main \
            && echo "Noch offen (${{ needs.planen.outputs.offen }} beim Planen) - naechster Durchgang angestossen."
