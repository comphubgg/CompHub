<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offspawn</title>
<style>
/*
 * Der Offspawn-Stand.
 *
 * Zwei Namen, dazwischen der Stand, darunter eine frei geschriebene Zeile.
 * Der Betreiber wollte das ausdruecklich von Hand pflegen koennen: "der
 * Spieler muss das manuell eingeben im Tool. Es steht Offspawn zwei zu sechs
 * ... nachher kann er das im Tool eingeben und in OBS wird das direkt
 * uebernommen." Es gibt dafuer keine Quelle bei Epic - wer wo landet und wer
 * gewinnt, entscheidet sich in einer Absprache zwischen zwei Teams.
 *
 * Deshalb steht hier nichts, was gerechnet wird: alles kommt aus der
 * Einstellung und aendert sich, sobald sie sich aendert - im Stream nach
 * wenigen Sekunden, ohne die Browserquelle anzufassen.
 */

:root {
  --grund: 0 0 0;
  --deckkraft: 0.72;
  --schrift: 30px;
  --links: #ffffff;
  --rechts: #ffffff;
  /* Hoehe der Bilder, und die Breite des Kastens (0 = nach Inhalt). */
  --bild: 2.1em;
  --breite: auto;
  --text: #ffffff;
  --rand: rgba(255, 255, 255, 0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  /*
   * Schrift so genau zeichnen, wie es geht.
   *
   * Macht aus einer unscharfen Einblendung keine scharfe - dafuer sorgt der
   * Massstab unten -, aber es kostet nichts und hilft bei kleinen Groessen.
   */
  text-rendering: geometricPrecision;
}

/*
 * Der Massstab gegen die Unschaerfe.
 *
 * In OBS ist eine Browserquelle ein Bild in genau der Groesse, die dort
 * eingetragen ist. Wer sie danach in der Szene groesser zieht, vergroessert
 * ein fertiges Bild - und genau so sah es beim Betreiber aus: "das ist sehr,
 * sehr unscharf."
 *
 * Mit zwei wird alles doppelt so gross gezeichnet. Traegt man die Quelle dann
 * ebenfalls doppelt so gross ein und zieht sie in der Szene auf die Haelfte,
 * entsteht kein einziges hochgerechnetes Pixel mehr.
 */
#karte { zoom: var(--massstab, 1); }

#karte {
  /*
   * Breite nach Inhalt - oder fest, wenn eine eingestellt ist.
   *
   * Der Betreiber wollte sie ziehen koennen: "ich moechte das breiter ziehen
   * oder so." Bei fester Breite bleibt der Inhalt mittig.
   */
  width: var(--breite);
  min-width: max-content;
  max-width: 100vw;
  background: rgb(var(--grund) / var(--deckkraft));
  border: 1px solid var(--rand);
  border-radius: 12px;
  padding: 0.45em 0.8em;
  color: var(--text);
  font-size: var(--schrift);
  opacity: 0;
  transition: opacity 0.3s ease;
}
#karte.da { opacity: 1; }

/*
 * Verborgen heisst verborgen.
 *
 * Ein eigenes "display" schlaegt das Attribut hidden - der Balken unter dem
 * Stand blieb deshalb als kurzer Strich stehen, auch wenn gar kein Text
 * darin stand. Diese Zeile stellt das fuer alle drei Stellen richtig.
 */
[hidden] { display: none !important; }

#kopf {
  display: block;
  text-align: center;
  font-size: 0.3em;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 0.15em;
}

#zeile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  white-space: nowrap;
}

/*
 * Ein Foto je Seite.
 *
 * Der Betreiber wollte die Duos erkennbar haben, aber nicht vier Gesichter:
 * "dann tut's nur einem jeweils vom Duo das Bild anzeigen, links rechts."
 * Also eines links, eines rechts, jeweils in der Farbe der Seite eingefasst.
 */
.foto {
  /*
   * Hochkant und eckig, wie auf der Team-Karte.
   *
   * Rund war der erste Versuch; der Betreiber wollte es anders: "mach die
   * Bilder nicht so rund, die sollen so sein wie bei den Teamcards, also ein
   * komplettes Quadrat." Ein leicht gebrochener Rand bleibt, damit es nicht
   * wie ein ausgeschnittenes Stueck Bildschirm aussieht.
   */
  /*
   * So gross wie der Kasten hergibt.
   *
   * Der erste Versuch war ein Daumennagel neben dem Namen - der Betreiber:
   * "es soll das ganze Kaestchen sein, nicht so klein." Es reicht jetzt vom
   * oberen bis zum unteren Rand des Inhalts und laesst sich zusaetzlich
   * ueber einen Regler stellen.
   */
  width: calc(var(--bild) * 0.8);
  height: var(--bild);
  border-radius: 0.08em;
  object-fit: cover;
  object-position: center 18%;
  border: 0.05em solid currentColor;
  flex: 0 0 auto;
}
#f1 { color: var(--links); }
#f2 { color: var(--rechts); }

.name {
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 0.6em;
}
#n1 { color: var(--links); }
#n2 { color: var(--rechts); }

#stand {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
  letter-spacing: 0.02em;
}
#stand .teiler {
  color: rgba(255, 255, 255, 0.35);
  margin: 0 0.16em;
  font-weight: 700;
}

/*
 * Die frei geschriebene Zeile - als Balken, nicht als Fussnote.
 *
 * Der Betreiber hat ein Bild geschickt: "GAME: 4 / 4", weiss auf einem
 * kraeftigen Balken. Genau so sitzt sie jetzt unter dem Stand, in einer
 * eigenen Farbe, die sich einstellen laesst.
 */
#zusatzBalken {
  display: flex;
  justify-content: center;
  margin-top: 0.2em;
}
#zusatz {
  display: inline-block;
  background: var(--balken);
  padding: 0.12em 0.55em;
  border-radius: 0.12em;
  text-align: center;
  font-size: 0.3em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0.06em 0.12em rgba(0, 0, 0, 0.45);
}

@media (prefers-reduced-motion: reduce) {
  #karte { transition: none !important; }
}
</style>
</head>
<body>

<div id="karte">
  <span id="kopf" hidden>OFFSPAWN</span>
  <span id="zeile">
    <img class="foto" id="f1" alt="" hidden>
    <span class="name" id="n1">TEAM 1</span>
    <span id="stand"><span id="p1">0</span><span class="teiler">:</span><span id="p2">0</span></span>
    <span class="name" id="n2">TEAM 2</span>
    <img class="foto" id="f2" alt="" hidden>
  </span>
  <span id="zusatzBalken" hidden><span id="zusatz"></span></span>
</div>

<script src="konfig.js"></script>
<script>
(function () {
  'use strict';

  const STANDARD = {
    kopf: 'OFFSPAWN',
    kopfZeigen: true,
    name1: 'TEAM 1', name2: 'TEAM 2',
    punkte1: 0, punkte2: 0,
    /** Die frei geschriebene Zeile darunter, etwa "Game 1 / 4". */
    zusatz: '',
    /*
     * Weiss als Vorgabe.
     *
     * Der Betreiber: "mach als Standard alles weiss, beide Teams, deren
     * Namen soll weiss sein." Wer Farbe will, waehlt sie.
     */
    farbe1: '#ffffff', farbe2: '#ffffff',
    /** Hoehe der Bilder in Vielfachen der Schriftgroesse. */
    bild: 2.1,
    /** Feste Breite in Pixeln - 0 heisst: so breit wie der Inhalt. */
    breite: 0,
    /** 1 oder 2 - siehe "Der Massstab gegen die Unschaerfe" oben. */
    massstab: 1,
    /** Die Farbe des Balkens unter dem Stand. */
    balken: '#f97316',
    /** Bilder je Seite - eines je Duo, so wollte es der Betreiber. */
    bild1: '', bild2: '',
    grund: '0 0 0', deckkraft: 0.72,
    schrift: 30,
  };

  const $ = (id) => document.getElementById(id);

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(cfg) {
      const s = document.documentElement.style;
      s.setProperty('--grund', String(cfg.grund));
      s.setProperty('--deckkraft', String(cfg.deckkraft));
      s.setProperty('--links', String(cfg.farbe1));
      s.setProperty('--rechts', String(cfg.farbe2));
      s.setProperty('--schrift', cfg.schrift + 'px');
      s.setProperty('--balken', String(cfg.balken || '#f97316'));
      s.setProperty('--bild', (Number(cfg.bild) || 2.1) + 'em');
      s.setProperty('--breite',
        Number(cfg.breite) > 0 ? Number(cfg.breite) + 'px' : 'max-content');
      s.setProperty('--massstab', String(Number(cfg.massstab) || 1));

      for (const [id, pfad] of [['f1', cfg.bild1], ['f2', cfg.bild2]]) {
        const el = $(id);
        if (pfad) { el.src = String(pfad); el.hidden = false; }
        else { el.removeAttribute('src'); el.hidden = true; }
      }

      $('n1').textContent = String(cfg.name1 || 'TEAM 1');
      $('n2').textContent = String(cfg.name2 || 'TEAM 2');
      $('p1').textContent = String(Number(cfg.punkte1) || 0);
      $('p2').textContent = String(Number(cfg.punkte2) || 0);

      const k = $('kopf');
      k.textContent = String(cfg.kopf || 'OFFSPAWN');
      k.hidden = !cfg.kopfZeigen;

      const text = String(cfg.zusatz || '').trim();
      $('zusatz').textContent = text;
      $('zusatzBalken').hidden = !text;

      $('karte').classList.add('da');
    },
  });
})();
</script>
</body>
</html>
