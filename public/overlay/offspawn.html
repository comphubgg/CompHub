<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offspawn</title>
<style>
/*
 * Der Offspawn-Stand.
 *
 * Zwei Namen, dazwischen der Stand, aussen je ein Foto.
 * Der Betreiber wollte das ausdruecklich von Hand pflegen koennen: "der
 * Spieler muss das manuell eingeben im Tool. Es steht Offspawn zwei zu sechs
 * ... nachher kann er das im Tool eingeben und in OBS wird das direkt
 * uebernommen." Es gibt dafuer keine Quelle bei Epic - wer wo landet und wer
 * gewinnt, entscheidet sich in einer Absprache zwischen zwei Teams.
 *
 * Deshalb steht hier nichts, was gerechnet wird: alles kommt aus der
 * Einstellung und aendert sich, sobald sie sich aendert - im Stream nach
 * wenigen Sekunden, ohne die Browserquelle anzufassen.
 */

:root {
  --grund: 0 0 0;
  --deckkraft: 0.72;
  --schrift: 30px;
  --links: #ffffff;
  --rechts: #ffffff;
  /* Breite des Kastens (max-content = so breit wie der Inhalt). */
  --breite: max-content;
  --text: #ffffff;
  --rand: rgba(255, 255, 255, 0.09);
  --massstab: 1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  /*
   * Schrift so genau zeichnen, wie es geht.
   *
   * Macht aus einer unscharfen Einblendung keine scharfe - dafuer sorgt der
   * Massstab unten -, aber es kostet nichts und hilft bei kleinen Groessen.
   */
  text-rendering: geometricPrecision;
}

#karte {
  /*
   * Der Massstab gegen die Unschaerfe.
   *
   * In OBS ist eine Browserquelle ein Bild in genau der Groesse, die dort
   * eingetragen ist. Wer sie danach in der Szene groesser zieht, vergroessert
   * ein fertiges Bild - und genau so sah es beim Betreiber aus: "das ist sehr,
   * sehr unscharf."
   *
   * Mit zwei wird alles doppelt so gross gezeichnet. Traegt man die Quelle dann
   * ebenfalls doppelt so gross ein und zieht sie in der Szene auf die Haelfte,
   * entsteht kein einziges hochgerechnetes Pixel mehr.
   */
  zoom: var(--massstab, 1);

  /*
   * Eine Reihe aus drei Stuecken: Foto, Inhalt, Foto.
   *
   * Die Fotos sitzen nicht mehr in der Namenszeile, sondern sind eigene
   * Spalten des Kastens. Nur so reichen sie vom oberen bis zum unteren Rand -
   * der Betreiber wollte genau das: "es ist immer noch nicht das ganze
   * komplett ausgefuellt ... dass es komplett rundherum ist."
   *
   * Der Innenabstand ist deshalb vom Kasten nach innen gewandert: haette der
   * Kasten selbst noch einen, bliebe ueber und unter dem Foto ein schwarzer
   * Streifen stehen.
   */
  display: flex;
  align-items: stretch;

  /*
   * Breite nach Inhalt - oder fest, wenn eine eingestellt ist.
   *
   * Der Betreiber wollte sie ziehen koennen: "ich moechte das breiter ziehen
   * oder so." Bei fester Breite bleibt der Inhalt mittig.
   */
  width: var(--breite);
  max-width: 100vw;
  background: rgb(var(--grund) / var(--deckkraft));
  border: 1px solid var(--rand);
  border-radius: 12px;
  /* Damit die Fotos an den Ecken sauber vom Kasten beschnitten werden. */
  overflow: hidden;
  color: var(--text);
  font-size: var(--schrift);
  opacity: 0;
  transition: opacity 0.3s ease;
}
#karte.da { opacity: 1; }

#mitte {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0.45em 0.8em;
}

/*
 * Verborgen heisst verborgen.
 *
 * Ein eigenes "display" schlaegt das Attribut hidden - ohne diese Zeile
 * blieb schon einmal ein leerer Kasten als kurzer Strich stehen.
 */
[hidden] { display: none !important; }

#kopf {
  display: block;
  text-align: center;
  font-size: 0.3em;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 0.15em;
}

#zeile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  white-space: nowrap;
}

/*
 * Ein Foto je Seite - randlos, quadratisch, ueber die volle Hoehe.
 *
 * Der Betreiber wollte die Duos erkennbar haben, aber nicht vier Gesichter:
 * "dann tut's nur einem jeweils vom Duo das Bild anzeigen, links rechts."
 *
 * Wie es aussehen soll, hat er zweimal gesagt und zweimal ist es nicht
 * eingetroffen: "die sollen so sein wie bei den Teamcards, also ein
 * komplettes Quadrat", und dann "es ist immer noch nicht das ganze komplett
 * ausgefuellt ... dass es komplett rundherum ist." Also kein Rand, keine
 * abgerundeten Ecken, kein Abstand zum Kastenrand.
 *
 * Der Rahmen traegt die Groesse, das Bild darin liegt frei darueber:
 * "stretch" gibt dem Rahmen die volle Hoehe des Kastens, das Seitenverhaeltnis
 * macht daraus ein Quadrat. Weil das Bild absolut liegt, zaehlt seine eigene
 * Groesse bei der Breite des Kastens nicht mit - sonst wuerde ein Foto von
 * tausend Pixeln den ganzen Kasten aufziehen.
 */
.fotoRahmen {
  flex: 0 0 auto;
  align-self: stretch;
  /*
   * Die Breite kommt aus der gemessenen Hoehe - siehe "quadratisch" im
   * Skript unten. Ein reines "aspect-ratio: 1" reicht hier nicht: im
   * Flex-Kasten steht die Breite fest, bevor die Hoehe ueberhaupt bekannt
   * ist, und das Verhaeltnis geht dann nicht auf. Nachgemessen habe ich das,
   * statt es anzunehmen - das Foto war danach halb so breit wie hoch.
   */
  width: var(--fotoBreite, 2.6em);
  position: relative;
  overflow: hidden;
}
.foto {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* Etwas oberhalb der Mitte - dort sitzt bei Spielerfotos das Gesicht. */
  object-position: center 22%;
}

.name {
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 0.6em;
}
#n1 { color: var(--links); }
#n2 { color: var(--rechts); }

#stand {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
  letter-spacing: 0.02em;
}
#stand .teiler {
  color: rgba(255, 255, 255, 0.35);
  margin: 0 0.16em;
  font-weight: 700;
}

@media (prefers-reduced-motion: reduce) {
  #karte { transition: none !important; }
}
</style>
</head>
<body>

<div id="karte">
  <span class="fotoRahmen" id="r1" hidden><img class="foto" id="f1" alt=""></span>
  <div id="mitte">
    <span id="kopf" hidden>OFFSPAWN</span>
    <span id="zeile">
      <span class="name" id="n1">TEAM 1</span>
      <span id="stand"><span id="p1">0</span><span class="teiler">:</span><span id="p2">0</span></span>
      <span class="name" id="n2">TEAM 2</span>
    </span>
  </div>
  <span class="fotoRahmen" id="r2" hidden><img class="foto" id="f2" alt=""></span>
</div>

<script src="konfig.js"></script>
<script>
(function () {
  'use strict';

  const STANDARD = {
    kopf: 'OFFSPAWN',
    kopfZeigen: true,
    name1: 'TEAM 1', name2: 'TEAM 2',
    punkte1: 0, punkte2: 0,
    /*
     * Weiss als Vorgabe.
     *
     * Der Betreiber: "mach als Standard alles weiss, beide Teams, deren
     * Namen soll weiss sein." Wer Farbe will, waehlt sie.
     */
    farbe1: '#ffffff', farbe2: '#ffffff',
    /** Feste Breite in Pixeln - 0 heisst: so breit wie der Inhalt. */
    breite: 0,
    /** 1 oder 2 - siehe "Der Massstab gegen die Unschaerfe" oben. */
    massstab: 1,
    /** Bilder je Seite - eines je Duo, so wollte es der Betreiber. */
    bild1: '', bild2: '',
    grund: '0 0 0', deckkraft: 0.72,
    schrift: 30,
  };

  const $ = (id) => document.getElementById(id);

  /*
   * Die Fotos quadratisch halten.
   *
   * Gemessen wird die Mitte, nicht der ganze Kasten: die Mitte gibt die Hoehe
   * vor, die Fotos ziehen sich darauf. Wuerde ich den Kasten messen, haenge
   * seine Hoehe wieder an der Fotobreite - eine Katze, die sich in den
   * Schwanz beisst.
   *
   * Das Ergebnis steht in "em" statt in Pixeln, damit der Massstab gegen die
   * Unschaerfe nichts daran verschiebt: Hoehe und Schriftgroesse stammen aus
   * derselben Rechnung, ihr Verhaeltnis bleibt in jedem Massstab gleich.
   */
  function quadratisch() {
    const mitte = $('mitte');
    const hoehe = mitte.offsetHeight;
    if (!hoehe) return;
    const schrift = parseFloat(getComputedStyle(mitte).fontSize) || 1;
    $('karte').style.setProperty('--fotoBreite', (hoehe / schrift) + 'em');
  }

  /*
   * Zweimal messen, einmal beobachten.
   *
   * Gemessen wird, sobald eine Einstellung ankommt - das ist der einzige
   * Zeitpunkt, an dem sich am Inhalt etwas aendert. Ein zweiter Blick im
   * naechsten Bild faengt den Fall ab, dass der Umbruch beim ersten noch
   * nicht fertig war. Der Beobachter ist nur ein Netz darunter: in der
   * Vorschau, in der ich das geprueft habe, liefert er ueberhaupt keine
   * Meldungen, in OBS tut er es - verlassen darf man sich also nicht auf ihn.
   */
  if (window.ResizeObserver) {
    new ResizeObserver(quadratisch).observe($('mitte'));
  }
  window.addEventListener('load', quadratisch);

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(cfg) {
      const s = document.documentElement.style;
      s.setProperty('--grund', String(cfg.grund));
      s.setProperty('--deckkraft', String(cfg.deckkraft));
      s.setProperty('--links', String(cfg.farbe1));
      s.setProperty('--rechts', String(cfg.farbe2));
      s.setProperty('--schrift', cfg.schrift + 'px');
      s.setProperty('--breite',
        Number(cfg.breite) > 0 ? Number(cfg.breite) + 'px' : 'max-content');
      s.setProperty('--massstab', String(Number(cfg.massstab) || 1));

      // Der Rahmen wird versteckt, nicht das Bild darin: er traegt die Groesse.
      for (const [rahmen, bild, pfad] of
           [['r1', 'f1', cfg.bild1], ['r2', 'f2', cfg.bild2]]) {
        if (pfad) { $(bild).src = String(pfad); $(rahmen).hidden = false; }
        else { $(bild).removeAttribute('src'); $(rahmen).hidden = true; }
      }

      $('n1').textContent = String(cfg.name1 || 'TEAM 1');
      $('n2').textContent = String(cfg.name2 || 'TEAM 2');
      $('p1').textContent = String(Number(cfg.punkte1) || 0);
      $('p2').textContent = String(Number(cfg.punkte2) || 0);

      const k = $('kopf');
      k.textContent = String(cfg.kopf || 'OFFSPAWN');
      k.hidden = !cfg.kopfZeigen;

      quadratisch();
      requestAnimationFrame(quadratisch);
      $('karte').classList.add('da');
    },
  });
})();
</script>
</body>
</html>
