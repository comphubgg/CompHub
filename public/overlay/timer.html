<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cup timer</title>
<link rel="stylesheet" href="look.css">
<style>
/*
 * Der Countdown bis zum Start eines Cups.
 *
 * Der Betreiber wollte ihn ausdruecklich als eigene Einblendung: "wenn einer
 * heute ist, dann gibt's eine Cup Timeline. Kann ich draufdruecken, Overlay
 * erstellen, nachher kommt ein Timer fuer den aktuellen Cup. Sobald der live
 * ist, ist der Timer auf null und der Timer wird wie geloescht."
 *
 * Genau so verhaelt er sich: er zaehlt herunter, und in dem Moment, in dem
 * der Spieltag beginnt, verschwindet er von selbst. Nichts bleibt als
 * "00:00" im Bild stehen.
 */

:root {
  --grund: 0 0 0;
  --deckkraft: 0.72;
  --schrift: 34px;
  --akzent: #38bdf8;
  --rand: rgba(255, 255, 255, 0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/*
 * Verborgen heisst verborgen.
 *
 * Ein eigenes "display" an einem Element schlaegt sonst das Attribut hidden,
 * und ein leerer Kasten bleibt als Strich im Bild stehen.
 */
[hidden] { display: none !important; }

html, body {
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#karte.eine {
  display: flex;
  align-items: baseline;
  gap: 0.4em;
}
#karte.eine #wort { font-size: 0.4em; }
#karte.eine #zeit { font-size: 0.8em; }
#karte.eine #cup { margin-top: 0; font-size: 0.34em; }

#karte {
  width: max-content;
  max-width: 100vw;
  background: rgb(var(--grund) / var(--deckkraft));
  border: 1px solid var(--rand);
  border-radius: 10px;
  padding: 0.5em 0.85em;
  color: #fff;
  font-size: var(--schrift);
  opacity: 0;
  transition: opacity 0.35s ease;
}
#karte.da { opacity: 1; }

#wort {
  display: block;
  font-size: 0.34em;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--akzent);
}

#zeit {
  display: block;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: 0.01em;
}

#cup {
  display: block;
  margin-top: 0.12em;
  font-size: 0.3em;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.82);
}

/*
 * ------------------------------------------------ CompHub house style (11/2026)
 * Unless the look is "klassisch": transparent black box with the rotating
 * frame, Inter in white, the small letter-spaced label with the logo, the
 * time big and bold, cup and start time in grey. Layouts:
 *   zwei      label above the time (previous default)
 *   eine      everything in one line (previous)
 *   segmente  days / hours / minutes / seconds as separate blocks with units
 *   balken    time plus a thin progress bar that fills up towards the start
 */
#kopfzeile { display: flex; align-items: center; gap: .35em; }
#kopfzeile .lk-logo { width: .5em; height: .5em; border-radius: .12em; }
body.haus #karte { border: 0; border-radius: 14px; padding: .45em .8em .5em; }
body.haus #wort { color: rgba(255, 255, 255, .7); letter-spacing: .22em; }
body.haus #zeit { font-weight: 700; }
body.haus #cup, body.haus #start { color: rgba(255, 255, 255, .55); font-weight: 600; letter-spacing: .04em; }
#start { display: block; font-size: .26em; margin-top: .1em; }
#segmente { display: none; gap: .18em; margin-top: .08em; }
#segmente .seg { display: flex; flex-direction: column; align-items: center; min-width: 1.35em; padding: .08em .12em .1em; border-radius: .14em; background: rgba(255, 255, 255, .06); }
#segmente b { font-size: .9em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
#segmente i { font-style: normal; font-size: .22em; font-weight: 600; letter-spacing: .18em; color: rgba(255, 255, 255, .5); }
body.l-segmente #segmente { display: flex; }
body.l-segmente #zeit { display: none; }
#bar { display: none; height: .09em; margin-top: .22em; border-radius: 1em; background: rgba(255, 255, 255, .12); overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--lk-akzent, #fff); transition: width 1s linear; }
body.l-balken #bar { display: block; }

@media (prefers-reduced-motion: reduce) {
  #karte { transition: none !important; }
}
</style>
</head>
<body>

<div id="karte" class="lk-karte">
  <span id="kopfzeile"><span id="wort">STARTS IN</span></span>
  <span id="zeit">—</span>
  <span id="segmente"></span>
  <span id="bar"><i></i></span>
  <span id="cup" hidden></span>
  <span id="start" hidden></span>
</div>

<script src="konfig.js"></script>
<script src="look.js"></script>
<script>
(function () {
  'use strict';

  const STANDARD = {
    event: '', window: '',
    /** Wann der Spieltag beginnt, in Millisekunden. Kommt aus dem Werkzeug. */
    beginn: 0,
    /** Wie der Cup heisst - nur zur Anzeige. */
    cup: '',
    wort: 'STARTS IN',
    cupZeigen: true,
    grund: '0 0 0', deckkraft: 0.72,
    akzent: '#38bdf8',
    schrift: 34,
    /*
     * "zwei" = Ueberschrift ueber der Zeit, "eine" = alles nebeneinander.
     *
     * Der Betreiber wollte beides haben koennen, so wie bei der Qual-Linie:
     * "ob das Overlay zum Beispiel nur eine Linie ist, sodass nicht alles
     * untereinander steht, sondern nebeneinander."
     */
    anordnung: 'zwei',
    /*
     * Wie lange vorher er ueberhaupt erscheint.
     *
     * Null heisst: immer. Sonst bleibt er verborgen, bis es so weit ist -
     * ein Countdown ueber neun Stunden ist keine Information, sondern eine
     * Uhr im Bild.
     */
    abStunden: 12,
    /*
     * Immer zeigen, egal wie weit der Spieltag weg ist.
     *
     * Nur die Vorschau im Werkzeug setzt das. Dort soll man sehen, was man
     * gerade einstellt - auch bei einem Cup in drei Tagen, wo der Timer im
     * Stream noch verborgen bliebe. Der Betreiber: "das Preview muss immer
     * da sein."
     */
    immer: false,
    /*
     * Was nach dem Start passiert.
     *
     * "zaehlt": die Zeit seit dem Start laeuft weiter, mit eigener
     * Ueberschrift - der Betreiber (19.10.2026) wollte "einen Timer von einem
     * Cup", der waehrend des Cups nicht einfach verschwindet. "weg": wie
     * bisher, der Kasten verschwindet, sobald der Cup laeuft. Nach vierzehn
     * Stunden ist auch "zaehlt" vorbei: ein Spieltag dauert nicht laenger.
     */
    nachStart: 'zaehlt',
    wortLaeuft: 'LIVE FOR',
    // Redesign 11/2026: layout, start time, house style (look.js).
    layout: '', startZeigen: false,
    look: 'clean', rahmen: true, rahmenTempo: 4, rahmenBreite: 2.5, hintergrund: 'hero', hintergrundUrl: '', heroDeck: 0.1,
    wasserzeichen: 'aus', chLogo: true,
  };

  const $ = (id) => document.getElementById(id);
  let cfg = STANDARD;
  let server = location.origin;
  let uhr = null;
  let katalogUhr = null;
  let beginn = 0;

  /**
   * Aus Sekunden eine lesbare Zeit machen.
   *
   *   4:31            unter einer Stunde
   *   1:02:07         unter einem Tag
   *   2d 10:11:10     darueber
   *
   * Der Betreiber wollte die Tage getrennt: "wenn ich einen Cup nehme, der
   * erst in zwei Tagen ist, dann ist der Timer zwei Tage, zehn Stunden, elf
   * Minuten" - und nicht achtundfuenfzig Stunden am Stueck, die niemand im
   * Kopf umrechnet.
   */
  function alsZeit(sek) {
    const s = Math.max(0, Math.floor(sek));
    const zwei = (n) => String(n).padStart(2, '0');
    const tage = Math.floor(s / 86400);
    const st = Math.floor((s % 86400) / 3600);
    const mi = Math.floor((s % 3600) / 60);
    const se = s % 60;
    if (tage > 0) return tage + 'd ' + zwei(st) + ':' + zwei(mi) + ':' + zwei(se);
    if (st > 0) return st + ':' + zwei(mi) + ':' + zwei(se);
    return mi + ':' + zwei(se);
  }

  /** Segments (days / hrs / min / sec) and the progress bar - both from the same seconds. */
  function extras(sek, vorStart) {
    const s = Math.max(0, Math.floor(sek));
    const teile = [[Math.floor(s / 86400), 'DAYS'], [Math.floor((s % 86400) / 3600), 'HRS'], [Math.floor((s % 3600) / 60), 'MIN'], [s % 60, 'SEC']];
    const seg = $('segmente');
    const zeigen = teile.filter((t, i) => i > 0 || t[0] > 0);
    if (seg.childElementCount !== zeigen.length) {
      seg.textContent = '';
      zeigen.forEach(() => { const d = document.createElement('span'); d.className = 'seg'; d.innerHTML = '<b></b><i></i>'; seg.appendChild(d); });
    }
    zeigen.forEach((t, i) => {
      const d = seg.children[i];
      Look.zahl(d.firstChild, i === 0 && t[1] === 'DAYS' ? String(t[0]) : String(t[0]).padStart(2, '0'));
      d.lastChild.textContent = t[1];
    });
    // Progress: from the moment it appears (abStunden before the start) to the start.
    const fenster = Math.max(1, Number(cfg.abStunden) || 12) * 3600;
    $('bar').firstChild.style.width = vorStart ? Math.max(0, Math.min(100, (1 - s / fenster) * 100)) + '%' : '100%';
    const st = $('start');
    if (cfg.startZeigen && beginn) {
      const d = new Date(beginn);
      st.textContent = (vorStart ? 'STARTS ' : 'STARTED ') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      st.hidden = false;
    } else st.hidden = true;
  }

  function zeichne() {
    if (!beginn) {
      $('karte').classList.remove('da');
      return;
    }
    const uebrig = (beginn - Date.now()) / 1000;

    /*
     * Vorbei heisst weg.
     *
     * Nicht "00:00" stehen lassen: sobald der Cup laeuft, ist der Countdown
     * falsch, und ein falscher Wert im Bild ist schlimmer als keiner.
     */
    if (uebrig <= 0) {
      if (cfg.nachStart === 'zaehlt' && -uebrig <= 14 * 3600) {
        $('zeit').textContent = alsZeit(-uebrig);
        extras(-uebrig, false);
        $('wort').textContent = String(cfg.wortLaeuft || 'LIVE FOR');
        const cz = $('cup');
        if (cfg.cupZeigen && cfg.cup) { cz.textContent = String(cfg.cup); cz.hidden = false; } else cz.hidden = true;
        $('karte').classList.add('da');
        return;
      }
      if (!cfg.immer) {
        $('karte').classList.remove('da');
        return;
      }
      /*
       * In der Vorschau bleibt stattdessen stehen, dass er laeuft.
       *
       * Ein leerer Kasten sieht dort aus wie ein Fehler; im Stream ist genau
       * das aber richtig, deshalb nur hier.
       */
      $('zeit').textContent = 'LIVE';
      $('wort').textContent = String(cfg.wort || 'STARTS IN');
      const cl = $('cup');
      if (cfg.cupZeigen && cfg.cup) { cl.textContent = String(cfg.cup); cl.hidden = false; }
      $('karte').classList.add('da');
      return;
    }

    // Zu frueh ist auch nichts. Erst ab der eingestellten Vorlaufzeit.
    const grenze = Math.max(0, Number(cfg.abStunden) || 0) * 3600;
    if (grenze && uebrig > grenze && !cfg.immer) {
      $('karte').classList.remove('da');
      return;
    }

    $('zeit').textContent = alsZeit(uebrig);
    extras(uebrig, true);
    $('wort').textContent = String(cfg.wort || 'STARTS IN');
    const c = $('cup');
    if (cfg.cupZeigen && cfg.cup) {
      c.textContent = String(cfg.cup);
      c.hidden = false;
    } else {
      c.hidden = true;
    }
    $('karte').classList.add('da');
  }

  /*
   * Die Startzeit nachschaerfen.
   *
   * Sie steht in der Einstellung, weil das Werkzeug sie beim Anlegen kennt -
   * so laeuft der Countdown auch dann, wenn gerade keine Verbindung steht.
   * Epic verschiebt Spieltage aber gelegentlich; deshalb wird sie einmal pro
   * Minute mit dem Katalog verglichen und still berichtigt.
   */
  async function katalog() {
    if (!cfg.window) return;
    try {
      const d = await (await fetch(server + '/api/cup-catalog?modus=alle',
        { cache: 'no-store' })).json();
      for (const c of d.cups || []) {
        for (const liste of Object.values(c.regionen || {})) {
          for (const w of liste) {
            if (w.windowId === cfg.window && w.begin) {
              beginn = Number(w.begin);
              if (!cfg.cup) $('cup').textContent = c.titel;
              return;
            }
          }
        }
      }
    } catch (e) { /* dann bleibt die gespeicherte Zeit stehen */ }
  }

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(neu, wo) {
      cfg = neu;
      server = wo;
      beginn = Number(cfg.beginn) || 0;

      const s = document.documentElement.style;
      s.setProperty('--grund', String(cfg.grund));
      s.setProperty('--deckkraft', String(cfg.deckkraft));
      s.setProperty('--akzent', String(cfg.akzent));
      s.setProperty('--schrift', cfg.schrift + 'px');
      // Layout: the new setting, else the old "anordnung".
      const layout = ['zwei', 'eine', 'segmente', 'balken'].indexOf(cfg.layout) >= 0 ? cfg.layout : (cfg.anordnung === 'eine' ? 'eine' : 'zwei');
      $('karte').classList.toggle('eine', layout === 'eine');
      ['zwei', 'eine', 'segmente', 'balken'].forEach((l) => document.body.classList.toggle('l-' + l, l === layout));
      const haus = cfg.look !== 'klassisch';
      document.body.classList.toggle('haus', haus);
      Look.haus($('karte'), Object.assign({}, cfg, { akzent: haus ? (cfg.lookAkzent || '#ffffff') : cfg.akzent }));
      const kz = $('kopfzeile');
      let lg = kz.querySelector('.lk-logo');
      if (haus && cfg.chLogo !== false && !lg) kz.insertBefore(Look.logo(), kz.firstChild);
      if ((!haus || cfg.chLogo === false) && lg) lg.remove();

      if (uhr) clearInterval(uhr);
      uhr = setInterval(zeichne, 1000);
      zeichne();

      if (katalogUhr) clearInterval(katalogUhr);
      katalogUhr = setInterval(katalog, 60000);
      void katalog();
    },
  });
})();
</script>
</body>
</html>
