<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom text</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="look.css">
<style>
/*
 * Der eigene Text.
 *
 * Eine Zeile, frei geschrieben - "GAME: 4 / 4", "BO3", "LAST GAME", was
 * gerade gebraucht wird. Der Betreiber: "Bar Color, kannst aber auch sagen
 * keine Bar Color, dann den Text, Schriftart und Schriftfarbe natuerlich."
 *
 * Redesign 11/2026 in the house style ("simple, transparent, not many
 * colours" - look.css): four forms instead of one line -
 *   zeile   one line on a transparent black box (no bar colour = no box)
 *   pille   a rounded pill with a small dot
 *   unten   a lower third: small grey label above, the text below
 *   ticker  a fixed-width band whose lines scroll
 * plus an optional label ("NEXT UP"), several lines that take turns, looks,
 * fonts, motion and position. look "klassisch" = the old coloured bar.
 * Old settings (text, balken, schriftart, farbe, schrift) still apply.
 */
@font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/anton-latin.woff2') format('woff2'); }
:root {
  --farbe: #ffffff;
  --balken: transparent;
  --schrift: 32px;
  --familie: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --gewicht: 800;
  --grund: 10 10 12;
  --deckkraft: .62;
  --breite: 900px;
  --tempo: 18s;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { background: transparent; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

#karte {
  display: inline-flex; align-items: center; gap: .45em;
  max-width: 100vw;
  font-size: var(--schrift);
  color: var(--farbe);
  opacity: 0; transition: opacity .3s ease;
}
#karte.da { opacity: 1; }
#text, #label, #lauf { font-family: var(--familie); white-space: nowrap; }
#text {
  display: inline-block;
  font-weight: var(--gewicht);
  line-height: 1.15;
  letter-spacing: .02em;
  text-shadow: 0 .04em .18em rgba(0, 0, 0, .55);
  transition: opacity .35s ease, transform .35s ease;
}
#text.weg { opacity: 0; transform: translateY(.25em); }
#label { font-size: .4em; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
.lk-rand { vertical-align: top; }
#karte > .lk-logo { width: .62em; height: .62em; border-radius: .14em; }
body.f-unten #karte > .lk-logo { position: absolute; right: .6em; top: .45em; width: .45em; height: .45em; }
body.f-ticker #karte > .lk-logo { position: relative; z-index: 2; background: rgb(var(--grund)); box-shadow: 0 0 0 .35em rgb(var(--grund)); }
body.f-ticker #karte { gap: .55em; }
body.f-unten #karte.panel { padding-bottom: .6em; }
#punkt { width: .26em; height: .26em; border-radius: 50%; background: var(--lk-akzent, #ffffff); flex: 0 0 auto; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* ------------------------------------------------ classic: exactly the old line */
body.look-klassisch #label, body.look-klassisch #punkt { display: none; }
body.look-klassisch #text.balken { background: var(--balken); padding: .22em .65em; border-radius: .14em; text-shadow: 0 .05em .1em rgba(0, 0, 0, .35); }

/* ------------------------------------------------ house style and other looks */
body:not(.look-klassisch) #text { font-weight: 700; }
body.lk-eigeneSchrift #text, body.lk-eigeneSchrift #lauf { font-family: var(--lk-font); }
body:not(.look-klassisch):not(.lk-eigeneSchrift) #text, body:not(.look-klassisch):not(.lk-eigeneSchrift) #label, body:not(.look-klassisch):not(.lk-eigeneSchrift) #lauf { font-family: 'Inter', 'Segoe UI', sans-serif; }
body:not(.look-klassisch) #karte.panel { padding: .3em .7em .32em; background-color: rgb(var(--grund) / var(--deckkraft)); }
body:not(.look-klassisch) #karte.panel #text { text-shadow: none; }
body:not(.look-klassisch) #karte:not(.panel) { box-shadow: none !important; background: transparent !important; backdrop-filter: none !important; }

body.f-pille:not(.look-klassisch) #karte { border-radius: 999px !important; padding-left: .65em; padding-right: .85em; }
body.f-unten:not(.look-klassisch) #karte { flex-direction: column; align-items: flex-start; gap: .1em; padding: .38em .85em .42em; }
body.f-ticker:not(.look-klassisch) #karte { width: var(--breite); max-width: 100vw; overflow: hidden; }
#lauf { display: none; }
body.f-ticker:not(.look-klassisch) #lauf { display: flex; font-weight: 700; animation: lauf var(--tempo) linear infinite; }
body.f-ticker:not(.look-klassisch) #text { display: none; }
#lauf span { padding-right: 1.6em; }
#lauf span::after { content: '·'; padding-left: 1.6em; color: rgba(255, 255, 255, .35); }
@keyframes lauf { from { transform: translateX(0); } to { transform: translateX(-50%); } }

@media (prefers-reduced-motion: reduce) { #karte, #text { transition: none !important; } #lauf, #punkt { animation: none !important; } }
</style>
</head>
<body>

<div id="karte" class="lk-karte"><span id="punkt" hidden></span><span id="label" class="lk-label" hidden></span><span id="text" hidden></span><div id="lauf"></div></div>

<script src="konfig.js"></script>
<script src="look.js"></script>
<script>
(function () {
  'use strict';
  const SCHRIFTARTEN = {
    standard: { familie: "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif", gewicht: 800 },
    anton: { familie: "'Anton', 'Arial Black', sans-serif", gewicht: 400 },
    roboto: { familie: "'Roboto', 'Segoe UI', sans-serif", gewicht: 700 },
    mono: { familie: "'Roboto Mono', 'Consolas', monospace", gewicht: 700 },
  };
  const STANDARD = {
    text: '',
    /** Bar colour (classic). In the new looks: empty = no box behind the text. */
    balken: '#f97316',
    schriftart: 'standard',
    farbe: '#ffffff',
    schrift: 32,
    // Redesign 11/2026
    form: 'zeile', label: '', punkt: false,
    /** More lines that take turns with the first one, or scroll in the ticker. */
    texte: [], takt: 6, breite: 900, tempo: 18,
    grund: '10 12 18', deckkraft: 0.66,
    // House frame (look.js)
    rahmen: true, rahmenTempo: 4, rahmenBreite: 2.5, heroDeck: 0.1, hintergrund: 'hero', hintergrundUrl: '',
    wasserzeichen: 'aus', chLogo: true,
  };
  const $ = (id) => document.getElementById(id);
  let uhr = null;
  let nr = 0;

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(cfg) {
      const s = document.documentElement.style;
      const art = SCHRIFTARTEN[cfg.schriftart] || SCHRIFTARTEN.standard;
      s.setProperty('--familie', art.familie);
      s.setProperty('--gewicht', String(art.gewicht));
      s.setProperty('--farbe', String(cfg.farbe || '#ffffff'));
      s.setProperty('--schrift', (Number(cfg.schrift) || 32) + 'px');
      s.setProperty('--grund', String(cfg.grund || '10 10 12'));
      s.setProperty('--deckkraft', String(cfg.deckkraft ?? 0.62));
      s.setProperty('--breite', Math.max(200, Number(cfg.breite) || 900) + 'px');
      s.setProperty('--tempo', Math.max(4, Number(cfg.tempo) || 18) + 's');

      const form = ['zeile', 'pille', 'unten', 'ticker'].indexOf(cfg.form) >= 0 ? cfg.form : 'zeile';
      ['zeile', 'pille', 'unten', 'ticker'].forEach((f) => document.body.classList.toggle('f-' + f, f === form));
      const balken = String(cfg.balken || '').trim();
      const zeilen = [String(cfg.text || '').trim()]
        .concat((Array.isArray(cfg.texte) ? cfg.texte : []).map((x) => String(x || '').trim()))
        .filter(Boolean);

      const el = $('text');
      el.classList.toggle('balken', Boolean(balken));
      s.setProperty('--balken', balken || 'transparent');
      const karte = $('karte');
      const panel = !(form === 'zeile' && !balken);
      karte.classList.toggle('panel', panel);
      Look.haus(karte, cfg, { ohneRahmen: !panel });
      // The CompHub logo in front (new looks, with a box).
      let lg = karte.querySelector(':scope > .lk-logo');
      const logoAn = cfg.chLogo && panel && cfg.look !== 'klassisch';
      if (logoAn && !lg) { lg = Look.logo(); karte.insertBefore(lg, karte.firstChild); }
      if (!logoAn && lg) lg.remove();
      $('label').textContent = String(cfg.label || '');
      $('label').hidden = !cfg.label;
      $('punkt').hidden = !cfg.punkt;

      const lauf = $('lauf');
      lauf.textContent = '';
      if (form === 'ticker') {
        for (let k = 0; k < 2; k++) zeilen.forEach((z) => { const sp = document.createElement('span'); sp.textContent = z; lauf.appendChild(sp); });
      }
      if (uhr) { clearInterval(uhr); uhr = null; }
      nr = 0;
      el.textContent = zeilen[0] || '';
      el.hidden = !zeilen.length;
      karte.hidden = !zeilen.length;
      if (zeilen.length > 1 && form !== 'ticker') {
        uhr = setInterval(() => {
          el.classList.add('weg');
          setTimeout(() => { nr = (nr + 1) % zeilen.length; el.textContent = zeilen[nr]; el.classList.remove('weg'); }, 350);
        }, Math.max(2, Number(cfg.takt) || 6) * 1000);
      }
      karte.classList.add('da');
    },
  });
})();
</script>
</body>
</html>
