<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qual line</title>
<style>
/*
 * Die Qualifikationslinie.
 *
 * Zwei Zahlen, die waehrend eines Cups jeden interessieren: wie viele Punkte
 * es voraussichtlich braucht, und wie viele es gerade tatsaechlich sind.
 *
 * Beide stehen so in der Antwort von /api/qualifikation und werden nicht
 * geraten: die Schaetzung ist der Schnitt derselben Runde aus frueheren
 * Ausgaben desselben Cups, der Live-Wert die Punktzahl, die gerade auf dem
 * Qualifikationsplatz steht. Wo es keine frueheren Ausgaben gibt, faellt die
 * Schaetzung weg statt eine Zahl zu erfinden.
 */

:root {
  --grund: 0 0 0;
  --deckkraft: 0.72;
  --schrift: 16px;
  --akzent: #38bdf8;
  --text: #ffffff;
  /*
   * Die Nebenschrift - Woerter wie "PTS", "LIVE QUAL", "TOP 50".
   *
   * Sie stand auf fuenfundfuenfzig Prozent Weiss. Auf einem dunklen Kasten
   * ging das; sobald die Deckkraft heruntergedreht ist und das Spielbild
   * durchscheint, verschwand sie fast. Der Betreiber: "Wenn ich die
   * Transparenz anpasse, soll es nicht die Transparenz vom Text anpassen,
   * sondern nur vom Hintergrund - der graue Text soll immer noch gleich gut
   * zu sehen sein."
   *
   * Der Regler hat den Text nie angefasst, er wirkt nur auf den Grund. Zu
   * schwach war die Farbe trotzdem. Zweiundachtzig Prozent bleiben deutlich
   * ruhiger als die Hauptschrift und stehen auch ueber einem hellen Bild.
   */
  --leise: rgba(255, 255, 255, 0.82);
  --rand: rgba(255, 255, 255, 0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/*
 * Verborgen heisst verborgen.
 *
 * Ein eigenes "display" an einem Element schlaegt sonst das Attribut hidden,
 * und ein leerer Kasten bleibt als Strich im Bild stehen.
 */
[hidden] { display: none !important; }

html, body {
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#karte {
  width: max-content;
  min-width: min-content;
  max-width: 100vw;
  background: rgb(var(--grund) / var(--deckkraft));
  border: 1px solid var(--rand);
  border-radius: 10px;
  padding: 0.55em 0.95em 0.5em;
  opacity: 0;
  transition: opacity .45s ease;
}
#karte.da { opacity: 1; }

/* Die grosse Zeile: die Schaetzung. */
#oben {
  display: flex;
  align-items: baseline;
  gap: 0.4em;
  white-space: nowrap;
  font-size: calc(var(--schrift) * 1.35);
  font-weight: 800;
  letter-spacing: 0.02em;
  color: var(--text);
  line-height: 1.1;
}
#oben .wort { color: var(--leise); font-size: calc(var(--schrift) * 0.82); }
#oben .einheit { color: var(--leise); font-size: calc(var(--schrift) * 0.62);
                 font-weight: 700; letter-spacing: 0.1em; }

/* Die kleine Zeile: der Live-Wert und wie viele weiterkommen. */
#unten {
  margin-top: 0.25em;
  display: flex;
  align-items: baseline;
  gap: 0.5em;
  white-space: nowrap;
  font-size: calc(var(--schrift) * 0.6);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--leise);
}
#unten b { color: var(--akzent); font-weight: 800; }

/*
 * Der Trenner ist eine gezeichnete Linie, kein Schriftzeichen.
 *
 * Vorher stand dort ein senkrechter Strich aus der Schrift. Der ist so hoch,
 * wie die Schrift ihn zeichnet, sitzt auf der Grundlinie und wird bei jeder
 * Schriftgroesse anders lang - der Betreiber wollte aber "einen langen
 * geraden Strich von oben nach unten". Ein Element mit einer Kante von einem
 * Pixel ist genau das: immer gleich duenn, und so hoch, wie man es sagt.
 */
.strich {
  display: inline-block;
  width: 1px;
  height: 1.15em;
  background: currentColor;
  opacity: 0.28;
  /* Die Grundlinie interessiert hier nicht - der Strich soll mittig zur
     Zeile stehen, nicht auf ihr sitzen. */
  align-self: center;
}

#hinweis {
  font-size: calc(var(--schrift) * 0.7);
  color: var(--leise);
  white-space: nowrap;
}

/*
 * Anordnung "eine Zeile".
 *
 * Der Betreiber wollte es als zweite Moeglichkeit so: "ein richtig duenner
 * Strich, wo steht QUAL 365, dann ein langer gerader Strich von oben nach
 * unten, dann LIVE QUAL, dann noch mal ein Strich, dann TOP - dass es so
 * ganz duenn ist, aber alles nebeneinander."
 *
 * Also nicht zwei Zeilen uebereinander, sondern eine flache Leiste. Die
 * Schaetzung bleibt die groesste Zahl, faellt aber kleiner aus als im
 * zweizeiligen Bild - sonst waere die Leiste so hoch wie vorher und haette
 * nichts gewonnen. Zwischen den Teilen steht dieselbe gezeichnete Linie wie
 * innerhalb der unteren Zeile, damit es ein Muster ist und kein Zufall.
 */
#karte.eine {
  display: flex;
  align-items: center;
  gap: 0.75em;
  padding: 0.4em 0.85em;
}
#karte.eine #oben {
  font-size: calc(var(--schrift) * 1.15);
  align-items: center;
}
#karte.eine #unten {
  margin-top: 0;
  align-items: center;
  /* Der Trenner zwischen den beiden Bloecken - dieselbe Linie, nur als
     Kante des Kastens statt als eigenes Element. */
  border-left: 1px solid var(--rand);
  padding-left: 0.75em;
  align-self: stretch;
}
/* Ist die Schaetzung nicht da, braucht es auch keinen Trenner davor. */
#karte.eine #oben[hidden] + #unten {
  border-left: 0;
  padding-left: 0;
}

@media (prefers-reduced-motion: reduce) {
  #karte { transition: none !important; }
}
</style>
</head>
<body>

<div id="karte">
  <div id="oben" hidden>
    <span class="wort" id="wort">QUAL ~</span>
    <span id="schaetzung">—</span>
    <span class="einheit">PTS</span>
  </div>
  <div id="unten" hidden>
    <span>Live qual · <b id="live">—</b> pts</span>
    <span class="strich" aria-hidden="true"></span>
    <span id="top">TOP —</span>
  </div>
  <div id="hinweis" hidden></div>
</div>

<script src="konfig.js"></script>
<script>
(function () {
  'use strict';

  const STANDARD = {
    event: '', window: '',
    /** Wie viele weiterkommen - Epics Rangschwelle. */
    schwelle: 50,
    wort: 'QUAL ~',
    takt: 15,
    grund: '0 0 0', deckkraft: 0.72,
    akzent: '#38bdf8',
    schrift: 16,
    pausiert: 0, sichtbar: 15,
    /** "zwei" = zwei Zeilen uebereinander, "eine" = eine flache Leiste. */
    anordnung: 'zwei',
  };

  const $ = (id) => document.getElementById(id);
  let cfg = STANDARD;
  let server = location.origin;
  let uhr = null;
  let blendAus = null;

  function meldung(text) {
    $('oben').hidden = true;
    $('unten').hidden = true;
    const h = $('hinweis');
    h.textContent = text;
    h.hidden = false;
    $('karte').classList.add('da');
  }

  async function holen() {
    if (!cfg.event || !cfg.window) return meldung('Pick a cup in the dashboard');
    try {
      const u = server + '/api/qualifikation?event=' + encodeURIComponent(cfg.event)
        + '&window=' + encodeURIComponent(cfg.window)
        + '&schwelle=' + encodeURIComponent(cfg.schwelle);
      const d = await (await fetch(u, { cache: 'no-store' })).json();

      if (!d || (!d.schnitt && !d.tatsaechlich)) {
        return meldung(d && d.hinweis ? d.hinweis : 'No qualification data');
      }

      $('hinweis').hidden = true;
      $('wort').textContent = String(cfg.wort || 'QUAL ~');

      // Die Schaetzung nur, wenn es fruehere Ausgaben gibt.
      if (d.schnitt) {
        $('schaetzung').textContent = d.schnitt;
        $('oben').hidden = false;
      } else {
        $('oben').hidden = true;
      }

      // Der Live-Wert nur, wenn gerade wirklich jemand auf dem Platz steht.
      // Waehrend des Spieltags ist das der Stand von jetzt, alle fuenfzehn
      // Sekunden frisch - danach das Ergebnis.
      if (d.tatsaechlich) {
        $('live').textContent = d.tatsaechlich;
        $('top').textContent = 'TOP ' + (d.schwelle || cfg.schwelle);
        $('unten').hidden = false;
      } else {
        $('unten').hidden = true;
      }

      $('karte').classList.add('da');
    } catch (e) {
      meldung('Server not reachable');
    }
  }

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(neu, wo) {
      cfg = neu;
      server = wo;
      const s = document.documentElement.style;
      s.setProperty('--grund', String(cfg.grund));
      s.setProperty('--deckkraft', String(cfg.deckkraft));
      s.setProperty('--akzent', String(cfg.akzent));
      s.setProperty('--schrift', cfg.schrift + 'px');
      $('karte').classList.toggle('eine', cfg.anordnung === 'eine');

      if (uhr) clearInterval(uhr);
      uhr = setInterval(holen, Math.max(5, cfg.takt) * 1000);

      if (blendAus) blendAus();
      blendAus = OverlayKonfig.blenden(
        $('karte'), cfg.pausiert, cfg.sichtbar, holen);
    },
  });
})();
</script>
</body>
</html>
