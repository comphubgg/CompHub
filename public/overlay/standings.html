<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standings</title>
<style>
/*
 * Das Standings-Overlay.
 *
 * Zwei Dinge unterscheiden es vom alten Leaderboard:
 *
 * 1. Die Adresse traegt nur eine Kennung. Alle Einstellungen stehen auf dem
 *    Server und werden im Takt nachgeholt - wer im Dashboard etwas aendert,
 *    sieht es in OBS, ohne die Browserquelle anzufassen.
 * 2. Es passt sich an. Die Spalte fuer die Punkte waechst mit der laengsten
 *    Zahl, und der Teamname schrumpft, wenn der Platz eng wird, statt
 *    abgeschnitten zu werden.
 *
 * Kein Rahmen, kein Hintergrund ausserhalb der Karte: OBS legt das Overlay
 * ueber das Spiel, und alles, was nicht Karte ist, muss durchsichtig sein.
 */

:root {
  --grund: 0 0 0;
  --deckkraft: 0.72;
  --schrift: 16px;
  --breite: 420px;
  --akzent: #f5c542;
  --text: #ffffff;
  /* Wie rund die Ecken sind - der Betreiber wollte das umstellen koennen. */
  --ecken: 10px;
  /* Wie in qual.html: der Deckkraft-Regler wirkt nur auf den Grund, die
     Nebenschrift bleibt lesbar. Fuenfundfuenfzig Prozent waren zu schwach,
     sobald das Spielbild durchscheint. */
  --leise: rgba(255, 255, 255, 0.82);
  --zeile: rgba(255, 255, 255, 0.05);
  --rand: rgba(255, 255, 255, 0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/*
 * ------------------------------------------------- FNCS Global Championship
 *
 * Fuer die Globals 2026 in Antwerpen. Der Betreiber: "dieser Overlay soll
 * extra farblich angepasst werden fuer die Global Championships ... beim
 * Banner machst du das Logo mittig weg und die Schrift unten, dann hast du
 * einfach nur den Banner ohne Logos. Dann machst du es noch ein bisschen
 * transparent, plus eine schwarze Folie darueber."
 *
 * Genau so: das Bild in public/overlay/globals ist aus den kristall- und
 * goldfarbenen Raendern von Epics Banner gebaut, ohne Logo und ohne Schrift.
 * Darueber liegt dieselbe schwarze Folie, die der Deckkraft-Regler steuert -
 * das Overlay bleibt lesbar, und wie stark das Bild durchkommt, entscheidet
 * er. Die Schrift wird golden, die Trennlinien im Blau des FNCS-Logos
 * (#0e47de, aus dem Logo selbst gelesen, nicht geraten).
 */
body.globals {
  --akzent: #f5c542;
  --rand: rgba(245, 197, 66, 0.30);
  --zeile: rgba(255, 255, 255, 0.06);
  --fncs: #0e47de;
}
body.globals #karte {
  background-image:
    linear-gradient(rgb(var(--grund) / var(--deckkraft)),
                    rgb(var(--grund) / var(--deckkraft))),
    url('globals/fncs-hoch.jpg');
  background-size: cover;
  background-position: center;
  box-shadow: 0 0 0 1px rgba(245, 197, 66, 0.18), 0 10px 30px rgba(0, 0, 0, 0.45);
}
body.globals #kopf {
  background: linear-gradient(90deg, rgba(14, 71, 222, 0.55), rgba(14, 71, 222, 0));
  border-bottom: 1px solid rgba(245, 197, 66, 0.35);
}
body.globals #titel {
  color: #ffd766;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
}
body.globals td.team { color: #fff7e0; }
body.globals tr.gold td.team,
body.globals tr.gold td.platz,
body.globals tr.gold td.punkte { color: #ffd766; }

/* Das eigene Zeichen, klein in der Kopfzeile - wenn er es anhakt. */
#marke {
  height: 1.15em;
  width: auto;
  margin-left: .55em;
  opacity: .85;
  vertical-align: -0.18em;
}

html, body {
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/*
 * Die Karte sitzt oben links und waechst nach Bedarf.
 *
 * Nicht auf die volle Fensterbreite: in OBS ist die Quelle oft groesser als
 * das Overlay, und ein Kasten, der die ganze Quelle fuellt, laesst sich nicht
 * mehr sauber positionieren.
 */
#karte {
  /*
   * So breit wie eingestellt - aber nie schmaler, als die Zahlen brauchen.
   *
   * "min-content" ist hier der Kern: es ist die Breite, unter der eine
   * Spalte umbrechen oder abgeschnitten wuerde. Steht auf Platz eins die
   * 1100 statt der 1, waechst die Karte von allein mit, statt die Ziffern
   * zusammenzuquetschen. Wer sie in OBS schmaler zieht, verliert zuerst
   * den Teamnamen - der bekommt drei Punkte -, nie die Zahlen.
   */
  width: var(--breite);
  min-width: min-content;
  max-width: 100vw;
  background: rgb(var(--grund) / var(--deckkraft));
  border: 1px solid var(--rand);
  border-radius: var(--ecken);
  overflow: hidden;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .45s ease, transform .45s ease;
}
#karte.da { opacity: 1; transform: none; }

/* ------------------------------------------------------------- Kopfzeile */

#kopf {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.4em;
  padding: 0.7em 1em 0.55em;
  font-size: calc(var(--schrift) * 0.62);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--leise);
  font-weight: 700;
  white-space: nowrap;
}
#titel { color: var(--text); }
#spanne {
  color: var(--akzent);
  font-variant-numeric: tabular-nums;
  margin-left: .6em;
}
#kopfrechts { color: var(--leise); }

/* ---------------------------------------------------------------- Zeilen */

table { border-collapse: collapse; width: 100%; }

td {
  padding: 0.42em 0.5em;
  font-size: var(--schrift);
  line-height: 1.25;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  vertical-align: middle;
}
tr { background: transparent; }
tr:nth-child(odd) { background: var(--zeile); }

/*
 * Der Platz.
 *
 * Die Spalte ist so breit wie ihre laengste Zahl - bei "1100" also breiter
 * als bei "5". Genau das wollte der Betreiber: nichts zusammengequetscht,
 * sondern die Breite passt sich an. Ein festes "width" waere das Gegenteil.
 */
td.platz {
  width: 1%;
  padding-left: 1em;
  text-align: right;
  font-weight: 800;
  color: var(--leise);
}
tr.gold td.platz { color: var(--akzent); }

td.bild { width: 1%; padding-right: 0; }
td.bild img {
  display: block;
  height: calc(var(--schrift) * 1.5);
  width: calc(var(--schrift) * 1.5);
  border-radius: 50%;
  object-fit: cover;
  object-position: top;
}

/*
 * Der Teamname ist das Einzige, was schrumpfen darf.
 *
 * Wird das Overlay schmaler gezogen, sollen Platz und Punkte vollstaendig
 * lesbar bleiben - sie sind der Inhalt. Der Name bekommt den Rest und wird
 * am Ende mit drei Punkten gekuerzt, statt die Zahlen aus dem Bild zu
 * schieben.
 */
td.team {
  /*
   * Eine Obergrenze, kein "fuell alles".
   *
   * Mit width:100% zog die Tabelle die Karte auf die volle Fensterbreite -
   * in OBS ist die Quelle oft viel breiter als das Overlay, und dann stand
   * ein Balken quer ueber dem Bild. Mit einer Obergrenze bleibt die Karte
   * so breit, wie ihr Inhalt sie braucht, waechst aber mit, wenn ein Name
   * oder eine vierstellige Zahl mehr Platz verlangt.
   */
  max-width: 22em;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
tr.gold td.team { color: var(--akzent); }

td.punkte {
  width: 1%;
  padding-right: 1em;
  text-align: right;
  font-weight: 800;
}
tr.gold td.punkte { color: var(--akzent); }

/* Eine Punktzahl, die sich gerade geaendert hat, blinkt einmal auf. */
@keyframes stups {
  0%   { color: var(--akzent); transform: translateY(-2px); }
  100% { color: inherit; transform: none; }
}
td.punkte b { display: inline-block; font-weight: inherit; }
td.punkte b.neu { animation: stups .9s ease-out; }

#hinweis {
  padding: 1em;
  font-size: calc(var(--schrift) * 0.8);
  color: var(--leise);
}

@media (prefers-reduced-motion: reduce) {
  #karte, td.punkte b { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="karte">
  <div id="kopf">
    <span id="titel">STANDINGS</span><img id="marke" src="/logos/CompHub-Logo-frei.png" alt="" hidden>
    <!-- Beim Blaettern steht hier, welche Plaetze gerade zu sehen sind. -->
    <span id="spanne" hidden></span>
    <span id="kopfrechts">POINTS</span>
  </div>
  <table><tbody id="zeilen"></tbody></table>
  <div id="hinweis" hidden></div>
</div>

<script src="konfig.js"></script>
<script>
(function () {
  'use strict';

  /*
   * Die Voreinstellungen.
   *
   * Sie stehen hier und nicht auf dem Server: ein Overlay, dessen Kennung
   * verlorengeht, soll trotzdem etwas Sinnvolles zeigen statt einer leeren
   * Flaeche.
   */
  const STANDARD = {
    event: '', window: '',
    titel: 'STANDINGS',
    kopfrechts: 'POINTS',
    thema: '',
    ecken: 10,
    marke: 0,
    /*
     * Weitere Spieltage desselben Cups - fuer den Gesamtstand.
     *
     * Der Betreiber zu den Globals: "da kann er entweder ein Leaderboard nur
     * von dem heutigen Tag oder ein Leaderboard vom ganzen Tournament
     * auswaehlen." Steht hier mehr als ein Fenster, werden die Tage
     * zusammengezaehlt: Punkte, Eliminierungen, Siege und Spiele je Team.
     */
    fenster: [],
    /** Von welchem bis zu welchem Platz. */
    von: 1, bis: 5,
    /** Wie oft die Zahlen geholt werden, in Sekunden. */
    takt: 15,
    /** Grundfarbe als "R G B" und wie deckend sie ist. */
    grund: '0 0 0', deckkraft: 0.72,
    akzent: '#f5c542',
    schrift: 16,
    breite: 420,
    /** Fotos vor dem Namen? */
    bilder: false,
    /** Wie viele Plaetze golden sind - 0, 1 oder 3. */
    gold: 1,
    /** Ein- und Ausblenden: 0 heisst dauerhaft sichtbar. */
    pausiert: 0,
    sichtbar: 15,
    /*
     * Blaettern statt einer langen Liste.
     *
     * Der Betreiber: "Ich kann aus den Standings auch ein Overlay machen,
     * indem ich Top fuenf anzeige, aber es dann mehrere Seiten gibt - Seite
     * eins Top fuenf, Seite zwei fuenf bis zehn, Seite drei zehn bis fuenfzehn
     * und so weiter."
     *
     * "seitenBis" ist der letzte Platz, bis zu dem geblaettert wird; null
     * heisst: nicht blaettern, es bleibt bei von/bis. Wie viele Zeilen eine
     * Seite hat, steht schon da - es ist die Spanne von/bis.
     */
    seitenBis: 0,
    /** Sekunden je Seite. */
    seitenTakt: 8,
  };

  const $ = (id) => document.getElementById(id);
  let cfg = STANDARD;
  let server = location.origin;
  let uhr = null;
  let seitenUhr = null;
  let blendAus = null;
  const vorher = new Map();
  /** Die zuletzt geholten Zeilen - daraus werden die Seiten geschnitten. */
  let bestand = [];
  /** Die laufende Seite, von null an gezaehlt. */
  let seite = 0;

  /** Wie viele Zeilen eine Seite hat. */
  function seitenGroesse() {
    return Math.max(1, (Number(cfg.bis) || 1) - (Number(cfg.von) || 1) + 1);
  }

  /** Der letzte Platz, der ueberhaupt geholt werden muss. */
  function letzterPlatz() {
    return Math.max(Number(cfg.bis) || 1, Number(cfg.seitenBis) || 0);
  }

  /** Wie viele Seiten es gibt. Ohne Blaettern genau eine. */
  function seitenZahl() {
    const bis = Number(cfg.seitenBis) || 0;
    if (bis <= (Number(cfg.bis) || 1)) return 1;
    const spanne = bis - (Number(cfg.von) || 1) + 1;
    return Math.max(1, Math.ceil(spanne / seitenGroesse()));
  }

  /**
   * Welche Plaetze gerade zu sehen sind.
   *
   * Ohne Blaettern ist das schlicht von/bis. Mit Blaettern wandert das
   * Fenster in Schritten seiner eigenen Groesse nach unten, bis der letzte
   * Platz erreicht ist, und faengt dann wieder oben an.
   */
  function spanne() {
    const von = Number(cfg.von) || 1;
    if (seitenZahl() <= 1) return { von, bis: Number(cfg.bis) || von };
    const g = seitenGroesse();
    const a = von + seite * g;
    return { von: a, bis: Math.min(a + g - 1, letzterPlatz()) };
  }

  /** Die aktuelle Seite aus dem Bestand zeichnen. */
  function seiteZeigen() {
    const { von, bis } = spanne();
    const teil = bestand.filter((e) => e.rank >= von && e.rank <= bis);
    const anzeige = $('spanne');
    if (seitenZahl() > 1) {
      anzeige.textContent = von + '–' + bis;
      anzeige.hidden = false;
    } else {
      anzeige.hidden = true;
    }
    if (!teil.length) return meldung('No standings yet');
    zeichnen(teil);
  }

  function meldung(text) {
    $('zeilen').innerHTML = '';
    const h = $('hinweis');
    h.textContent = text;
    h.hidden = false;
    $('karte').classList.add('da');
  }

  /*
   * Der Name ohne Turniermarke.
   *
   * Bei einem LAN traegt jedes Konto die Marke des Turniers vor dem Namen -
   * bei den Globals 2026 heisst jeder Spieler "[FNCSGC26] GodL Chap". In der
   * Tabelle frisst das die halbe Zeile und sagt nichts: dass es die Globals
   * sind, steht in der Ueberschrift.
   */
  function spielerName(roh) {
    var n = String(roh || '').replace(/\[[^\]]*\]\s*/g, '').trim();
    return n || String(roh || '');
  }

  function zeichnen(eintraege) {
    $('hinweis').hidden = true;
    const tb = $('zeilen');
    tb.innerHTML = '';

    for (const e of eintraege) {
      const tr = document.createElement('tr');
      if (cfg.gold > 0 && e.rank <= cfg.gold) tr.className = 'gold';

      const platz = document.createElement('td');
      platz.className = 'platz';
      platz.textContent = e.rank;
      tr.appendChild(platz);

      /*
       * Fotos nur, wo es welche gibt.
       *
       * Eine graue Silhouette neben einem echten Gesicht sieht schlechter
       * aus als gar kein Bild - dieselbe Regel wie bei der Bildgenerierung.
       */
      if (cfg.bilder) {
        const td = document.createElement('td');
        td.className = 'bild';
        const mit = (e.players || []).find((p) => p.img);
        if (mit) {
          const img = document.createElement('img');
          img.src = mit.img;
          img.alt = '';
          td.appendChild(img);
        }
        tr.appendChild(td);
      }

      const team = document.createElement('td');
      team.className = 'team';
      team.textContent = (e.players || []).map((p) => spielerName(p.name)).join(' & ');
      tr.appendChild(team);

      const punkte = document.createElement('td');
      punkte.className = 'punkte';
      const b = document.createElement('b');
      b.textContent = e.points;
      // Eine Zahl, die sich gerade geaendert hat, blinkt einmal auf.
      if (vorher.get(e.rank) !== undefined && vorher.get(e.rank) !== e.points) {
        b.className = 'neu';
      }
      vorher.set(e.rank, e.points);
      punkte.appendChild(b);
      tr.appendChild(punkte);

      tb.appendChild(tr);
    }
    $('karte').classList.add('da');
  }

  async function holen() {
    if (!cfg.event || !cfg.window) {
      return meldung('Pick a cup in the dashboard');
    }
    try {
      /*
       * Geholt wird bis zum letzten Platz, der irgendwann gezeigt wird -
       * einmal, nicht je Seite. Sonst laege bei zehn Seiten alle acht
       * Sekunden eine Abfrage an, obwohl sich die Tabelle in der Zeit kaum
       * bewegt.
       */
      const grenze = Math.max(1, letzterPlatz());
      const eine = async function (fenster) {
        const u = server + '/api/cup-leaderboard?event=' + encodeURIComponent(cfg.event)
          + '&window=' + encodeURIComponent(fenster)
          + '&limit=' + grenze;
        const d = await (await fetch(u, { cache: 'no-store' })).json();
        return d.entries || [];
      };

      /*
       * Ein Tag - oder alle Tage zusammen.
       *
       * Bei einem mehrtaegigen Finale (Globals: Tag 1 und Tag 2) wollte der
       * Betreiber beides zeigen koennen: "entweder ein Leaderboard nur von
       * dem heutigen Tag oder ein Leaderboard vom ganzen Tournament."
       * Stehen in cfg.fenster mehrere Spieltage, werden sie hier
       * zusammengezaehlt - Punkte, Eliminierungen, Siege und Spiele je Team,
       * und der Platz ergibt sich neu aus der Summe. Erfunden wird dabei
       * nichts: jede Zahl kommt aus Epics Bestenliste des jeweiligen Tages.
       */
      const tage = Array.isArray(cfg.fenster) && cfg.fenster.length > 1
        ? cfg.fenster : [cfg.window];

      if (tage.length === 1) {
        bestand = await eine(tage[0]);
      } else {
        const zusammen = new Map();
        for (const f of tage) {
          let zeilen = [];
          try { zeilen = await eine(f); } catch (e) { zeilen = []; }
          for (const e of zeilen) {
            const ids = (e.players || []).map(function (p) { return p.id || p.name; });
            const schluessel = ids.slice().sort().join('|');
            const da = zusammen.get(schluessel);
            if (da) {
              da.points += e.points || 0;
              da.elims += e.elims || 0;
              da.wins += e.wins || 0;
              da.games += e.games || 0;
            } else {
              zusammen.set(schluessel, {
                players: e.players, points: e.points || 0, elims: e.elims || 0,
                wins: e.wins || 0, games: e.games || 0, rank: 0,
              });
            }
          }
        }
        bestand = Array.from(zusammen.values())
          .sort(function (a, b) { return b.points - a.points || b.elims - a.elims; })
          .map(function (e, i) { e.rank = i + 1; return e; });
      }
      if (!bestand.length) return meldung('No standings yet');
      seiteZeigen();
    } catch (e) {
      meldung('Server not reachable');
    }
  }

  OverlayKonfig.starte({
    standard: STANDARD,
    anwenden(neu, wo) {
      cfg = neu;
      server = wo;
      const s = document.documentElement.style;
      s.setProperty('--grund', String(cfg.grund));
      s.setProperty('--deckkraft', String(cfg.deckkraft));
      s.setProperty('--akzent', String(cfg.akzent));
      s.setProperty('--schrift', cfg.schrift + 'px');
      s.setProperty('--breite', cfg.breite + 'px');
      s.setProperty('--ecken', (Number(cfg.ecken) || 0) + 'px');
      document.body.classList.toggle('globals', cfg.thema === 'globals');
      $('marke').hidden = !Number(cfg.marke);
      $('titel').textContent = String(cfg.titel || 'STANDINGS');
      $('kopfrechts').textContent = String(cfg.kopfrechts || 'POINTS');

      if (uhr) clearInterval(uhr);
      uhr = setInterval(holen, Math.max(3, cfg.takt) * 1000);

      /*
       * Die Seitenuhr laeuft getrennt von der Abfrage: geblaettert wird aus
       * dem, was schon da ist. Beim Umstellen faengt sie wieder bei der
       * ersten Seite an, damit man im Dashboard sieht, was man eingestellt
       * hat, statt mitten in einer Runde zu landen.
       */
      if (seitenUhr) clearInterval(seitenUhr);
      seite = 0;
      if (seitenZahl() > 1) {
        seitenUhr = setInterval(function () {
          seite = (seite + 1) % seitenZahl();
          if (bestand.length) seiteZeigen();
        }, Math.max(3, Number(cfg.seitenTakt) || 8) * 1000);
      }

      if (blendAus) blendAus();
      blendAus = OverlayKonfig.blenden(
        $('karte'), cfg.pausiert, cfg.sichtbar, holen);
    },
  });
})();
</script>
</body>
</html>
