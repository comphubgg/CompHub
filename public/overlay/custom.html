<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom scoreboard</title>
<!--
  Custom / Tokens scoreboard: team vs team for custom matches, token events
  and showmatches. Built for a 1920 x 1080 browser source with a transparent
  page; the board places itself (top / middle / bottom, left / centre / right).

  House style (operator, 11/2026: "simple, transparent, not many colours"):
  one semi-transparent black rounded box, Inter in white, names at the outer
  edges with small flags, a big score with a muted colon, a small letter-spaced
  title line with the CompHub logo, an optional grey footer ("FIRST TO 5").
  Around the box a rotating blue/white border, inside it the homepage hero
  images drifting at ~10 % (look.js "house frame"). No LIVE indicator.
  Colour is optional ("farbig": team accents) - never default.

  Three ways to feed it:
    ?id=<id>            a saved overlay (/overlays/custom). Score changes from
                        the control page arrive within ~1.5 s (one tiny request
                        every 1.5 s, answered from server memory).
    ?vorschau=<json>    the live preview in the configurator (no requests).
    plain URL params    no account needed, e.g.
      ?title=MASTER%20MONDAYS&p1=Chap,Kaan,Fastroki&p2=Nociff,Izzi,Akiira
      &s1=0&s2=0 &fl1=de,de,at &fl2=fr,de,ch (flag per player)
      &style=bar|compact|vertical &layout=stacked|inline
      &t1=..&t2=.. (team names, optional) &tag1/&tag2 (compact)
      &v=top|middle|bottom &h=left|center|right &margin=48 &scale=1
      &hideTitle=1 &font=inter|oswald|... &nologo=1
      &border=0 &borderspeed=4 &borderwidth=2.5 &hero=10 (0-100, background opacity)
      &bgmode=hero|fotos|eigen|aus &bgurl=<image or .mp4/.webm> &url=rechts|links|kopf|aus
      &bg=0a0a0c &op=62 &text=ffffff &color=1 &c1=3b82f6 &c2=ef4444
      &mode=boxfight &ft=5 (first to) &round=7 &series=1-0 &logo1=<url>
-->
<link rel="stylesheet" href="look.css">
<style>
:root {
  --grund: 10 10 12;
  --deck: .62;
  --a: #3b82f6;
  --b: #ef4444;
  --text: #ffffff;
  --live: #ff4d4d;
  --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --mass: 1;
  --rand: 48px;
  --ecken: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
body { display: flex; padding: var(--rand); font-family: var(--font); color: var(--text); }
body.v-top { align-items: flex-start; } body.v-middle { align-items: center; } body.v-bottom { align-items: flex-end; }
body.h-left { justify-content: flex-start; } body.h-center { justify-content: center; } body.h-right { justify-content: flex-end; }

.lk-rand { zoom: var(--mass); }
#board {
  min-width: 520px;
  background: rgb(var(--grund) / var(--deck));
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  opacity: 0; transform: translateY(6px);
  transition: opacity .35s ease, transform .35s ease;
}
#board.da { opacity: 1; transform: none; }

/* small letter-spaced title line, optional red LIVE dot */
#kopf {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 7px 16px 0;
  font-size: 12px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(255, 255, 255, .65); white-space: nowrap;
}
#kopf b { color: var(--text); font-weight: 700; }
#marke { height: 18px; max-width: 120px; object-fit: contain; }
#kopf .lk-logo { height: 16px; width: 16px; }
.mitte-logo { display: none; width: 26px; height: 26px; border-radius: 6px; opacity: .9; }

#reihe { display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 10px 30px 14px; }
.seite { display: flex; align-items: center; gap: 12px; min-width: 0; }
.seite.b { flex-direction: row-reverse; }
.team { display: flex; flex-direction: column; min-width: 0; }
.seite.b .team { align-items: flex-end; text-align: right; }
.tname { margin-bottom: 2px; font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(255, 255, 255, .5); white-space: nowrap; }
.spieler { display: flex; flex-direction: column; }
.sp { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
.seite.b .sp { flex-direction: row-reverse; }
.flagge { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; flex: 0 0 auto; }
.logo { width: 48px; height: 48px; object-fit: contain; flex: 0 0 auto; }
body.inline .spieler { flex-direction: row; flex-wrap: nowrap; }
body.inline .sp + .sp::before { content: '·'; opacity: .45; margin: 0 .3em 0 -.1em; }
body.inline .seite.b .spieler { flex-direction: row-reverse; }
body.inline .seite.b .sp + .sp::before { content: none; }
body.inline .seite.b .sp + .sp::after { content: '·'; opacity: .45; margin: 0 -.1em 0 .3em; }

#stand { display: flex; align-items: center; gap: 16px; font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.teiler { color: rgba(255, 255, 255, .3); font-size: 34px; }
.zahl { display: inline-block; min-width: .6em; text-align: center; }
.pips { display: flex; gap: 5px; margin-top: 6px; }
.seite.b .pips { justify-content: flex-end; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .2); transition: background .3s ease; }
.pips i.an { background: var(--text); }

#fuss { padding: 0 16px 9px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(255, 255, 255, .5); white-space: nowrap; }

/* score change animations */
.zahl.pop { animation: pop .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
.zahl.flip { animation: flip .5s ease; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); opacity: .3; } 100% { transform: rotateX(0); } }
.zahl.glow { animation: glow 1.1s ease; }
@keyframes glow { 0%, 100% { text-shadow: none; } 30% { text-shadow: 0 0 18px rgba(255, 255, 255, .8); } }

/* compact: one line, no title, no footer */
body.compact #kopf, body.compact #fuss, body.compact .spieler, body.compact .logo, body.compact .tname { display: none; }
body.compact #board { min-width: 520px; }
body.compact #reihe { padding: 12px 26px; }
body.compact .kurz { display: block; }
.kurz { display: none; font-size: 24px; font-weight: 600; white-space: nowrap; }
body.compact #stand { font-size: 44px; }
body.compact .teiler { font-size: 28px; }
body.compact.mitLogo .teiler { display: none; }
body.compact.mitLogo .mitte-logo { display: block; }

/* sidebar: stacked */
body.vertical #board { min-width: 300px; }
body.vertical #reihe { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px 22px 14px; }
body.vertical .seite, body.vertical .seite.b { flex-direction: row; justify-content: space-between; }
body.vertical .seite.b .team { align-items: flex-start; text-align: left; }
body.vertical .seite.b .sp { flex-direction: row; }
body.vertical #stand { justify-content: center; padding: 4px 0; border-top: 1px solid rgba(255, 255, 255, .1); border-bottom: 1px solid rgba(255, 255, 255, .1); }
body.vertical .seite.b .pips { justify-content: flex-start; }

/* optional colour ("farbig"): team accents - only when chosen */
body.farbig .seite.a .tname, body.farbig .seite.a .kurz { color: var(--a); }
body.farbig .seite.b .tname, body.farbig .seite.b .kurz { color: var(--b); }
body.farbig #board { box-shadow: inset 0 3px 0 -1px transparent, 0 8px 24px rgba(0, 0, 0, .18); background-image: linear-gradient(90deg, color-mix(in srgb, var(--a) 18%, transparent), transparent 35%, transparent 65%, color-mix(in srgb, var(--b) 18%, transparent)); }
body.farbig #z1 { color: color-mix(in srgb, var(--a) 35%, var(--text)); }
body.farbig #z2 { color: color-mix(in srgb, var(--b) 35%, var(--text)); }
body.farbig .seite.a .pips i.an { background: var(--a); }
body.farbig .seite.b .pips i.an { background: var(--b); }
/* optional diagonal texture */
body.m-diagonal #board { background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 10px); }

@media (prefers-reduced-motion: reduce) { #board, .zahl, #live i { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="v-top h-center">

<div id="board">
  <div id="kopf" data-lk-kopf><img id="marke" alt="" hidden><b id="titeltext"></b></div>
  <div id="reihe">
    <div class="seite a">
      <img class="logo" id="l1" alt="" hidden>
      <div class="team">
        <div class="tname" id="tn1"></div>
        <div class="kurz" id="k1"></div>
        <div class="spieler" id="sp1"></div>
        <div class="pips" id="pips1" hidden></div>
      </div>
    </div>
    <div id="stand"><span class="zahl" id="z1">0</span><span class="teiler">:</span><span id="mitteLogo"></span><span class="zahl" id="z2">0</span></div>
    <div class="seite b">
      <img class="logo" id="l2" alt="" hidden>
      <div class="team">
        <div class="tname" id="tn2"></div>
        <div class="kurz" id="k2"></div>
        <div class="spieler" id="sp2"></div>
        <div class="pips" id="pips2" hidden></div>
      </div>
    </div>
  </div>
  <div id="fuss" hidden></div>
</div>

<script src="look.js"></script>
<script>
(function () {
  'use strict';

  var STANDARD = {
    // House frame (look.js): rotating border, faint hero images, CompHub logo.
    rahmen: true, rahmenTempo: 4, rahmenBreite: 2.5, heroDeck: 0.1, chLogo: true,
    // Background inside the box: 'hero' | 'fotos' (players' photos) | 'eigen' (hintergrundUrl) | 'aus'
    hintergrund: 'hero', hintergrundUrl: '',
    // "thecomphub.com": 'rechts' | 'links' | 'kopf' | 'aus'
    wasserzeichen: 'rechts',
    titel: 'MASTER MONDAYS', titelZeigen: true,
    live: 'LIVE', liveZeigen: true,
    name1: '', name2: '', tag1: '', tag2: '', teamZeigen: true,
    spieler1: ['Chap', 'Kaan', 'Fastroki'], spieler2: ['Nociff', 'Izzi', 'Akiira'],
    laender1: [], laender2: [],
    flagge1: '', flagge2: '', logo1: '', logo2: '',
    punkte1: 0, punkte2: 0,
    stil: 'bar', anordnung: 'stapel',
    grund: '#0a0c12', deckkraft: 0.66,
    akzent1: '#3b82f6', akzent2: '#ef4444', text: '#ffffff', liveFarbe: '#ff4d4d',
    farbig: false,
    schrift: 'inter', groesse: 1, ecken: 14,
    vert: 'top', horiz: 'center', rand: 48,
    animation: 'pop',
    muster: 'none', markeLogo: '', markeZeigen: true,
    modus: 'match', ziel: 5, zielZeigen: true, runde: 0, serie1: 0, serie2: 0, serieZeigen: false,
    fussText: '',
  };

  var SCHRIFTEN = {
    inter: { css: "'Inter', 'Segoe UI', sans-serif", g: 'Inter:wght@400;500;600;700;800' },
    oswald: { css: "'Oswald', 'Arial Narrow', sans-serif", g: 'Oswald:wght@400;500;600;700' },
    bebas: { css: "'Bebas Neue', 'Arial Narrow', sans-serif", g: 'Bebas+Neue' },
    rajdhani: { css: "'Rajdhani', sans-serif", g: 'Rajdhani:wght@500;600;700' },
    chakra: { css: "'Chakra Petch', sans-serif", g: 'Chakra+Petch:wght@500;600;700' },
    barlow: { css: "'Barlow Condensed', sans-serif", g: 'Barlow+Condensed:wght@500;600;700;800' },
    anton: { css: "'Anton', Impact, sans-serif", eigen: true },
  };
  var geladen = {};
  function schriftLaden(k) {
    var s = SCHRIFTEN[k] || SCHRIFTEN.inter;
    if (geladen[k]) return s.css;
    geladen[k] = true;
    if (s.eigen) {
      var st = document.createElement('style');
      st.textContent = "@font-face{font-family:'Anton';src:url('/fonts/anton-latin.woff2') format('woff2');font-display:block}";
      document.head.appendChild(st);
    } else {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + s.g + '&display=block';
      document.head.appendChild(l);
    }
    return s.css;
  }

  var $ = function (id) { return document.getElementById(id); };
  var P = new URLSearchParams(location.search);
  var SERVER = P.get('server') || location.origin;

  function hex(v, std) {
    v = String(v || '').trim();
    if (/^#?[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)) return v[0] === '#' ? v : '#' + v;
    return std;
  }
  function rgb(h) {
    h = hex(h, '#0a0a0c').slice(1);
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255);
  }
  function liste(v) {
    if (Array.isArray(v)) return v.map(String);
    return String(v || '').split(',').map(function (x) { return x.trim(); });
  }
  function flaggenPfad(code) {
    code = String(code || '').trim().toLowerCase();
    return /^[a-z]{2}$/.test(code) ? SERVER + '/flags/' + code + '.png' : '';
  }

  /* Plain URL params -> settings (links without an account). */
  function ausAdresse() {
    var c = {};
    var ja = function (k) { var w = P.get(k); return w === '1' || w === 'true' || w === 'yes'; };
    var map = { title: 'titel', live: 'live', t1: 'name1', t2: 'name2', tag1: 'tag1', tag2: 'tag2',
      logo1: 'logo1', logo2: 'logo2', f1: 'flagge1', f2: 'flagge2', font: 'schrift', anim: 'animation', footer: 'fussText' };
    Object.keys(map).forEach(function (k) { if (P.has(k)) c[map[k]] = P.get(k); });
    if (P.has('p1')) c.spieler1 = liste(P.get('p1'));
    if (P.has('p2')) c.spieler2 = liste(P.get('p2'));
    if (P.has('fl1')) c.laender1 = liste(P.get('fl1'));
    if (P.has('fl2')) c.laender2 = liste(P.get('fl2'));
    if (P.has('s1')) c.punkte1 = Number(P.get('s1')) || 0;
    if (P.has('s2')) c.punkte2 = Number(P.get('s2')) || 0;
    if (P.has('c1')) c.akzent1 = P.get('c1');
    if (P.has('c2')) c.akzent2 = P.get('c2');
    if (ja('color')) c.farbig = true;
    if (P.has('bg')) c.grund = P.get('bg');
    if (P.has('text')) c.text = P.get('text');
    if (P.has('livecolor')) c.liveFarbe = P.get('livecolor');
    if (P.has('op')) c.deckkraft = Math.max(0, Math.min(100, Number(P.get('op')))) / 100;
    if (P.has('scale')) c.groesse = Number(P.get('scale')) || 1;
    if (P.has('radius')) c.ecken = Number(P.get('radius'));
    if (P.has('margin')) c.rand = Number(P.get('margin')) || 0;
    if (P.has('v')) c.vert = P.get('v');
    if (P.has('h')) c.horiz = P.get('h');
    if (P.has('style')) c.stil = P.get('style');
    if (P.has('layout')) c.anordnung = P.get('layout') === 'inline' ? 'reihe' : 'stapel';
    if (P.has('pattern')) c.muster = P.get('pattern');
    if (P.has('logo')) c.markeLogo = P.get('logo');
    if (P.has('mode')) c.modus = P.get('mode');
    if (P.has('ft')) c.ziel = Number(P.get('ft')) || 0;
    if (P.has('round')) c.runde = Number(P.get('round')) || 0;
    if (P.has('series')) {
      var se = String(P.get('series')).split(/[-:]/);
      c.serie1 = Number(se[0]) || 0; c.serie2 = Number(se[1]) || 0; c.serieZeigen = true;
    }
    if (ja('hideTitle')) c.titelZeigen = false;
    if (ja('nologo')) c.chLogo = false;
    if (P.get('border') === '0') c.rahmen = false;
    if (P.has('borderspeed')) c.rahmenTempo = Number(P.get('borderspeed')) || 4;
    if (P.has('borderwidth')) c.rahmenBreite = Number(P.get('borderwidth')) || 2.5;
    if (P.has('bgmode')) c.hintergrund = P.get('bgmode');
    if (P.has('bgurl')) c.hintergrundUrl = P.get('bgurl');
    if (P.has('url')) c.wasserzeichen = P.get('url');
    if (P.has('hero')) c.heroDeck = Math.max(0, Math.min(100, Number(P.get('hero')))) / 100;
    if (ja('hideLive')) c.liveZeigen = false;
    if (ja('hideTeams')) c.teamZeigen = false;
    return c;
  }

  var vorher = { p1: null, p2: null };
  var aktuelleAnim = 'pop';
  var ziel = 0;
  function zaehlen(el, wert, alt) {
    el.textContent = String(wert);
    if (alt === null || alt === wert || !aktuelleAnim || aktuelleAnim === 'none') return;
    el.classList.remove('pop', 'flip', 'glow');
    void el.offsetWidth;
    el.classList.add(aktuelleAnim);
  }
  function pips(n, wert) {
    var el = $('pips' + n);
    el.hidden = !ziel || ziel > 15;
    if (el.hidden) return;
    if (el.childElementCount !== ziel) {
      el.textContent = '';
      for (var i = 0; i < ziel; i++) el.appendChild(document.createElement('i'));
    }
    Array.prototype.forEach.call(el.children, function (p, i) { p.classList.toggle('an', i < wert); });
  }
  function punkte(p1, p2, anim) {
    if (anim) aktuelleAnim = anim;
    p1 = Number(p1) || 0; p2 = Number(p2) || 0;
    pips(1, p1); pips(2, p2);
    zaehlen($('z1'), p1, vorher.p1);
    zaehlen($('z2'), p2, vorher.p2);
    vorher.p1 = p1; vorher.p2 = p2;
  }

  function seite(n, cfg) {
    var namen = liste(cfg['spieler' + n]).filter(Boolean).slice(0, 4);
    var laender = liste(cfg['laender' + n]);
    var name = String(cfg['name' + n] || '').trim();
    var tag = String(cfg['tag' + n] || '').trim();

    var tn = $('tn' + n);
    tn.textContent = name;
    tn.hidden = !name || !cfg.teamZeigen;

    // Compact: one short label - tag, team name, or the players.
    $('k' + n).textContent = tag || name || (namen.length > 2 ? namen.join(' · ') : namen.join(' & '));

    var sp = $('sp' + n);
    sp.textContent = '';
    var teamFlagge = flaggenPfad(cfg['flagge' + n]);
    namen.forEach(function (nm, i) {
      var z = document.createElement('div');
      z.className = 'sp';
      var f = flaggenPfad(laender[i]) || (i === 0 ? teamFlagge : '');
      if (f) {
        var im = document.createElement('img');
        im.className = 'flagge'; im.alt = ''; im.src = f;
        z.appendChild(im);
      }
      var s = document.createElement('span');
      s.textContent = nm;
      z.appendChild(s);
      sp.appendChild(z);
    });
    sp.hidden = !namen.length;

    var logo = $('l' + n);
    var lp = String(cfg['logo' + n] || '').trim();
    if (lp && /^(https?:\/\/|\/)/.test(lp)) { if (logo.getAttribute('src') !== lp) logo.src = lp; logo.hidden = false; }
    else logo.hidden = true;
  }

  function anwenden(cfg) {
    var r = document.documentElement.style;
    r.setProperty('--grund', rgb(cfg.grund));
    r.setProperty('--deck', String(Math.max(0, Math.min(1, Number(cfg.deckkraft)))));
    r.setProperty('--a', hex(cfg.akzent1, '#3b82f6'));
    r.setProperty('--b', hex(cfg.akzent2, '#ef4444'));
    r.setProperty('--text', hex(cfg.text, '#ffffff'));
    r.setProperty('--live', hex(cfg.liveFarbe, '#ff4d4d'));
    r.setProperty('--font', schriftLaden(cfg.schrift));
    r.setProperty('--mass', String(Math.max(0.4, Math.min(2.5, Number(cfg.groesse) || 1))));
    r.setProperty('--rand', Math.max(0, Math.min(400, Number(cfg.rand) || 0)) + 'px');
    r.setProperty('--ecken', Math.max(0, Math.min(30, Number(cfg.ecken ?? 14))) + 'px');

    var b = document.body;
    var vert = ['top', 'middle', 'bottom'].indexOf(cfg.vert) >= 0 ? cfg.vert : 'top';
    var horiz = ['left', 'center', 'right'].indexOf(cfg.horiz) >= 0 ? cfg.horiz : 'center';
    var stil = ['bar', 'compact', 'vertical'].indexOf(cfg.stil) >= 0 ? cfg.stil : 'bar';
    var box = cfg.modus === 'boxfight';
    b.className = 'v-' + vert + ' h-' + horiz + ' ' + stil + (cfg.anordnung === 'reihe' ? ' inline' : '')
      + (cfg.farbig ? ' farbig' : '') + (cfg.muster === 'diagonal' ? ' m-diagonal' : '') + (box ? ' boxfight' : '');
    ziel = box ? Math.max(0, Math.min(30, Math.round(Number(cfg.ziel) || 0))) : 0;

    var marke = $('marke');
    var ml = String(cfg.markeLogo || '').trim();
    var mlOk = cfg.markeZeigen && /^(https?:\/\/|\/|data:image\/)/.test(ml);
    if (mlOk) { if (marke.getAttribute('src') !== ml) marke.src = ml; marke.hidden = false; } else marke.hidden = true;
    $('titeltext').textContent = String(cfg.titel || '');
    $('titeltext').hidden = !cfg.titelZeigen || !cfg.titel;
    // The CompHub logo next to the title (and in place of the colon in the compact layout).
    var kopf = $('kopf');
    var chl = kopf.querySelector('.lk-logo');
    if (cfg.chLogo && !chl) kopf.insertBefore(Look.logo(), kopf.firstChild);
    if (!cfg.chLogo && chl) chl.remove();
    var ml2 = $('mitteLogo');
    if (cfg.chLogo && !ml2.firstChild) ml2.appendChild(Look.logo('mitte-logo'));
    b.classList.toggle('mitLogo', Boolean(cfg.chLogo));
    kopf.hidden = $('titeltext').hidden && !mlOk && !cfg.chLogo;
    Look.rahmen($('board'), cfg, { fotos: { links: liste(cfg.spieler1).filter(Boolean), rechts: liste(cfg.spieler2).filter(Boolean) } });

    // Footer: first to / round / series / own text - grey and small.
    var teile = [];
    if (String(cfg.fussText || '').trim()) teile.push(String(cfg.fussText).trim());
    if (ziel && cfg.zielZeigen) teile.push('FIRST TO ' + ziel);
    if (box && Number(cfg.runde) > 0) teile.push('ROUND ' + Number(cfg.runde));
    if (cfg.serieZeigen) teile.push('SERIES ' + (Number(cfg.serie1) || 0) + '–' + (Number(cfg.serie2) || 0));
    $('fuss').textContent = teile.join(' · ');
    $('fuss').hidden = !teile.length;

    seite(1, cfg);
    seite(2, cfg);
    punkte(cfg.punkte1, cfg.punkte2, cfg.animation);
    $('board').classList.add('da');
  }

  function mit(c) {
    var o = {};
    Object.keys(STANDARD).forEach(function (k) { o[k] = STANDARD[k]; });
    Object.keys(c || {}).forEach(function (k) { o[k] = c[k]; });
    // Shipped briefly with uppercase "TEAM A/B" defaults and "LIVE NOW" - treat those as unset.
    if (o.name1 === 'TEAM A') o.name1 = '';
    if (o.name2 === 'TEAM B') o.name2 = '';
    return o;
  }

  // 1. Preview inside the configurator.
  var vorschau = P.get('vorschau');
  if (vorschau) {
    try { anwenden(mit(JSON.parse(vorschau))); } catch (e) { anwenden(mit({})); }
    window.addEventListener('message', function (ev) {
      if (ev.origin !== location.origin || !ev.data || ev.data.comphub !== 'custom-cfg') return;
      anwenden(mit(ev.data.cfg));
    });
    return;
  }

  var id = P.get('id');
  // 2. No id: plain URL params.
  if (!id) { anwenden(mit(ausAdresse())); return; }

  // 3. A saved overlay: settings once, then only the tiny score question.
  var MERK = 'comphub-overlay:' + id;
  var stand = -1;
  var laeuft = false;
  function merkzettel() {
    if (laeuft) return;
    try {
      var g = JSON.parse(localStorage.getItem(MERK) || 'null');
      if (g && g.config) { laeuft = true; anwenden(mit(g.config)); }
    } catch (e) { /* none */ }
  }
  function voll() {
    return fetch(SERVER + '/api/overlay-config?id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.config) { merkzettel(); return; }
        try { localStorage.setItem(MERK, JSON.stringify({ config: j.config, stand: j.stand })); } catch (e) { /* blocked */ }
        stand = j.stand;
        laeuft = true;
        anwenden(mit(j.config));
      })
      .catch(merkzettel);
  }
  var unterwegs = false;
  function kurz() {
    if (unterwegs || document.hidden) return;
    unterwegs = true;
    fetch(SERVER + '/api/overlay-config?nur=stand&id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || typeof j.stand !== 'number' || j.stand === stand) return;
        punkte(j.p1, j.p2);
        return voll();
      })
      .catch(function () { /* network gone - keep what is on screen */ })
      .then(function () { unterwegs = false; });
  }
  voll();
  setInterval(kurz, 1500);
})();
</script>
